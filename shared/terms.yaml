causa_meritoria:
  english: Meritorious Cause
  type: scholastic
  first_use: ""

causa_impulsiva:
  english: Impulsive Cause
  type: scholastic
  first_use: ""
  note: Distinguished internal vs. external.

causa_instrumentalis:
  english: Instrumental Cause
  type: scholastic
  first_use: ""
