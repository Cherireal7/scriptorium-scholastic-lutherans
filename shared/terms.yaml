ioannes_xii_excommunicat_omnes_synodum:
  english: John XII's absurd two-sentence excommunication of the entire synod
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0200"
  note: >
    IOANNES EPISCOPUS SERVUS SERVORUM DEI OMNIBUS EPISCOPIS: NOS
    AUDIVIMUS DICERE QUOD UOS UULTIS ALIUM PAPAM FACERE: SI HAEC
    FACITIS EXCOMMUNICO UOS DE DEO OMNIPOTENTI UT NON HABEATIS
    LICENTIAM ULLUM ORDINARE ET MISSAM CELEBRARE. Two-sentence
    "Apologeticum" excommunicating the entire December 963 Roman
    Synod (including the Emperor, Roman clergy, and Italian/Ottonian
    bishops). Servus servorum Dei humility-formula prefixed to
    excommunico uos de Deo omnipotenti = strongest possible imperial-
    Roman anathema. Reformation-standard example of scandalous papal-
    monarchical pretension: 26-year-old ignoring synodal summons on
    serious charges responds with unilateral universal excommunication.

iudas_typologia_paparum_claves_perditae:
  english: Judas-typology — sinful pope forfeits keys-power (deposition-argument)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0202"
  note: >
    Synod's coup-de-grâce argument for deposition of John XII: Judas
    Iscariot had received from Christ the power of binding and loosing
    (Matt 18:18) as one of the apostles; but by cupidity became a poison-
    murderer, and thereby FORFEITED the keys, able only to bind himself
    in the noose of despair (Matt 27:5). John XII by manifest wickedness
    has like Judas FORFEITED the keys — his excommunication of the synod
    is therefore INOPERATIVE; the synod can lawfully disregard it. MOST-
    IMPORTANT PRE-REFORMATION ECCLESIOLOGICAL FORMULATION ON THE
    CONDITIONAL CHARACTER OF THE KEYS-POWER: the keys operate only in
    a holy office-holder. Directly picked up by Wyclif De Ecclesia 1378,
    Hus De Ecclesia 1413, Luther De captivitate Babylonica 1520 WA
    6:497-573.

leo_viii_electio_963_protoscriniarius:
  english: Leo VIII elected Pope 4 December 963 (Ottonian-installed)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0204"
  note: >
    Leo VIII r. 4 Dec 963-1 Mar 965 elected by December 963 Roman Synod
    unanimously (una uoce dixerunt, said three times) as protoscriniarius
    (papal chief-notary) elevated to Pope with Emperor's consent after
    John XII deposition. Led to Lateran with praises; consecrated at
    St Peter's; oaths of fidelity from clergy. First Ottonian-installed
    Pope; canonical status contested in modern historiography (John XII
    still living) but Reformation polemic accepts deposition as valid.

pons_tiberis_bellum_963_964:
  english: Battle at the Tiber bridge (Otto's Saxons vs bribed Roman mob)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0205"
  note: >
    Late 963 or early 964. Deposed John XII sent secret nuncios from
    exile promising PECUNIAM BEATI PETRI OMNIUMQUE ECCLESIARUM (money
    of blessed Peter and all churches) to Romans willing to attack
    Emperor + new Pope Leo VIII. Papacy's own treasury weaponised
    against imperial protector. Romans blocked Tiber bridge with wagons;
    Otto's Saxon soldiers SICUT ACCIPITRES IN AUES (as hawks against
    birds) trampled fleeing mob. Otto pulled back own men still thirsting
    to kill. Leo VIII prostrated at Emperor's feet begged mercy;
    hostages returned. Otto left Rome COMMITTENS LUPIS AGNUM
    (committing the Pope as lamb to wolves) — Reformation-standard
    rueful-realism about impossibility of external institutional-
    protection of Reforming Pope.

mutilatio_papalis_iohannis_azonis_964:
  english: John Cardinal + Azo mutilated by John XII faction (spring 964)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0206"
  note: >
    When John XII faction returned to power in Rome (spring 964 after
    Otto left), inflicted maimings on Leo VIII supporters: JOHN CARDINAL-
    DEACON lost his RIGHT HAND; AZO PROTOSCRINIARIUS lost his TONGUE +
    both nostrils + two fingers. Standard early-medieval mutilating-
    punishment for political enemies. Reformation-standard exhibit of
    how papal-factional violence exceeded even secular sanguinolentia.

ioannes_xii_mors_diabolica_964:
  english: John XII's death 14 May 964 struck by devil at woman's bed unhouseled
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0206"
  note: >
    Liutprand's hagiographic-inverted providential-death account: John
    XII on a night outside Rome, delighting himself with someone's wife
    (adulterating), in his temples struck by the devil so grievously that
    within 8 days' space died from the same wound. DID NOT RECEIVE THE
    EUCHARIST VIATICUM — dying IMPENITENT AND UNHOUSELED. Liutprand's
    source: John XII's own kin + familiars present testifying under oath.
    REFORMATION-STANDARD PROVIDENTIAL-DEATH: pope who invoked demons at
    dice died struck by devil in adultery unhouseled. Melanchthon on
    IRA DEI MANIFESTANS in providential deaths of the impious.

benedictus_v_grammaticus_deposit_964:
  english: Pope Benedict V "Grammaticus" briefly elected then deposed by Otto
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0206"
  note: >
    Benedict V r. 22 May 964-4 July 964 briefly elected by Roman clergy
    after John XII death in disregard of oath sworn to Otto (no Pope
    without imperial consent). Otto besieged Rome by weapons + machines
    + famine; Romans surrendered; Benedict formally DEPOSED at Roman
    synod 23 June 964 led into Leo VIII presence at Lateran formally
    STRIPPED of pontifical vestments by Benedict Cardinal archdeacon +
    reduced to diaconate + EXILED to HAMBURG (where he died 966). Leo
    VIII restored. Standard Reformation-Lutheran example of emperor as
    DEPOSITOR-OF-ANTIPOPES imperial power adjudicating between competing
    papal claimants. Schieffer Lex des Mittelalters I 1980.

conciliarism_praedecessor_haec_sancta_synodus:
  english: 963 Synod as conciliarist predecessor of Constance Haec Sancta 1415
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0201"
  note: >
    The synod's formal response (via Otto's supplementary summons 22 Nov
    963) naming the synod (from Liguria + Tuscany + Saxony + Franconia +
    Lotharingia + Aemilia) as PROPER ECCLESIAL FORUM, joining Emperor's
    authority to assembled clergy — Reformation-standard CONCILIARIST
    ECCLESIOLOGY anticipating Council of Constance 1414-1418 HAEC SANCTA
    SYNODUS decree on conciliar supremacy over Pope. The 963 deposition-
    of-John-XII is the first-attested medieval instance of the conciliar-
    imperial deposition of a Pope for manifest wickedness/heresy.

# ─── Tranche 2kk — Benedict V deposition ceremony + Reformatio monachorum +
# Leo VII Bavarian bishops accusation + Leo IX Worms deacon + Mainz Synod
# 1049 + Privilegia (Donation of Constantine + Constitutum Ludovicianum
# forgeries + Anastasius Librarian as forger) vl0207-vl0214 ─────────────

benedictus_v_ceremonia_deposit_964:
  english: Benedict V's formal deposition ceremony (ferula broken)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0207"
  note: >
    Fullest ceremonial account of PAPAL DEPOSITION RITUAL in medieval
    sources. Emperor's rebuke QUA TIBI AUTHORITATE QUA UE LEGE INUASOR
    HAEC PONTIFICALIA INDUMENTA USURPASTI. Benedict responded SIC PECCAUI
    MISERERE MEI. Formal deposition symbolism: pallium returned to Leo
    VIII + PONTIFICALIS FERULA (pastoral staff) BROKEN and thrown down
    to people + stola removed + casula/planeta (chasuble) forfeited.
    Reduction to diaconate (not full lay-degradation) as Otto's mercy.
    Exile to Hamburg (in Saxony under Otto direct authority). Ancestor
    of Constance Council 1417 deposition ceremonies of John XXIII +
    Gregory XII + Benedict XIII.

totus_papatus_ex_mendacijs_costatus:
  english: The whole Papacy assembled and constituted from lies
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Reformatio monachorum at vl0208"
  note: >
    TOTUS ENIM PAPATUS EX MENDACIJS COSCUTUS ATQUE COSTATUS EST. Flacius
    most-extreme summary formulation on medieval papal-hagiographic
    tradition (specifically triggered by papal-clerical fable of Benedict
    V as martyr/confessor at Hamburg-Bremen, which Krantz Metropolis
    Book II refutes). Compare Luther Wider das Papsttum zu Rom vom
    Teufel gestiftet 1545 WA 54:206-299 DAS GANZE PAPSTTUM IST EINE
    LÜGENKIRCHE = Reformation-standard mendacity-critique of papacy.

reformatio_monachorum_ottoniana_940:
  english: Otto I's monastic reform c. 940 (Gorze tradition)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Reformatio monachorum at vl0208"
  note: >
    Otto (still king before 962 imperial coronation) already began c. 940
    to sponsor reform of German monasticism, cooperation with reforming-
    episcopate (Cologne, Trier, Mainz), building on GORZE REFORM movement
    from Lorraine. Standard Hallinger Gorze-Kluny 2 vols Rome 1950-51 +
    Nightingale Monasteries and Patrons in the Gorze Reform Oxford 2001.
    Flacius via Krantz + Ursberg testify to grave reformation: many drone-
    monks returned to secular life; satius esse paucos uiros bonos ali
    quam multos alios inutiles. Flacius lament: contemporary rulers
    (Charles V + Ferdinand I + Philip II) as ANTICHRISTI MANCIPIA
    (Antichrist's chattels) NOT reforming.

canes_muti_speculatores_caeci:
  english: Isaiah 56:10 dumb dogs + blind watchmen anti-clerical trope
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Leo VII at vl0209"
  note: >
    Isaiah 56:10 SPECULATORES EIUS CAECI OMNES NESCIERUNT UNIVERSI CANES
    MUTI NON VALENTES LATRARE. Reformation-standard anti-clerical
    prophetic proof-text: negligent shepherds as DUMB DOGS who cannot
    even bark warning. Applied by Pope Leo VII c. 940 to Bavarian bishops
    (Egilulph of Salzburg + Espengrin of Regensburg + Lampert of Freising
    + Visund of Sabon + Starchand of Eichstätt) accusing greed/corruption/
    hunting/simony/violence-to-poor. Compare Luther Auslegung des 82.
    Psalms 1530 WA 31.I:189-218 + Melanchthon Loci on officium ministerii.

leo_ix_reformator_1049_worms:
  english: Pope Leo IX (1049-1054) Gregorian-reform pope + Worms deacon incident
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Leo IX at vl0210"
  note: >
    Bruno of Egisheim-Dagsburg cousin of Emperor Henry III, r. 12 Feb
    1049-19 Apr 1054, elected pope with imperial support = GREAT GREGORIAN-
    REFORM POPE. Initiated systematic reform of 11th-c Church, prohibiting
    simony and clerical marriage. Legate Cardinal Humbert of Silva Candida
    triggered EAST-WEST SCHISM 16 July 1054 in Constantinople. German
    tour 1050. Worms deacon incident 1050: Leo IX stripped deacon of
    sacerdotal vestments and degraded for poor-Latin Gospel; Lupold
    Archbishop of Mainz REFUSED to continue Mass unless Pope restored
    deacon; Pope YIELDED (concessit et restituit) — striking demonstration
    of pre-Gregorian-reform limits on papal jurisdictional overreach:
    metropolitan archbishop still commanded ius provincial over ordinations
    in his own diocese. Parisse Bruno de Toul 1992 + Cushing Reform and
    Papacy in the Eleventh Century Manchester 2005. Mainz Synod 19 Oct
    1049 under Leo IX + Henry III + 92 bishops: anti-clerical-hunting +
    anti-secular-commerce + anti-premature-monastic-profession canons.

episcopi_non_papae_mancipia:
  english: Pre-Gregorian bishops not the Pope's chattels
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Leo IX at vl0211"
  note: >
    Flacius summary of Worms 1050 deacon incident: NON FUISSE EPISCOPOS
    ALIOS ADHUC TAM DISTRICTE PAPAE MANCIPIA UT IAM SUNT: NEC PAPAM ESSE
    TANTUM QUENDAM DEUM CUI STATIM IN OMNIBUS PARERE SIT NECESSE UT NUNC
    PAPISTAE SENTIUNT. Pre-Gregorian bishop was NOT the Pope's chattel;
    Pope not treated as a god to be immediately obeyed in all things.
    Reformation-standard critique of post-Gregorian papal MONARCHIA.

donatio_constantini_valla_refutata:
  english: Donation of Constantine as forgery (Valla 1440 dismantled)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0211"
  note: >
    8th-c forgery (probably drafted at Lateran c. 750-760 in Frankish
    court context to legitimise papal territorial claims). LORENZO VALLA
    c. 1407-1457 De falso credita et ementita Constantini donatione
    (composed 1440 at Alfonso V of Aragon court, published posthumously
    1517 by Ulrich von Hutten to Luther's delight) definitively demolished
    the Donation's authenticity on philological and historical grounds.
    Reginald Pecock (English c. 1440) and Nicholas of Cusa De Concordantia
    Catholica III.2 1433 had earlier reached similar conclusions
    independently. Reformation-standard canonical-critical foundation for
    rejecting papal PLENITUDO TEMPORALIS POTESTATIS.

constitutum_ludovicianum_forgery:
  english: Constitutum Ludovicianum (Gratian D.63 c.30) as 12th-c forgery
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0211"
  note: >
    Forged 12th-c text ascribed to Louis the Pious claiming Louis
    renounced imperial rights in papal creation. Distinct from historical
    Pactum Ludovicianum 817 (already at n515). Charles du Moulin
    Molinaeus Commentaria in edictum Henrici II contra parvas datas 1552
    + De monarchia Franciae 1555 great humanist-jurist demolition. Modern
    Sickel Das Privilegium Otto I 1883 + Schramm Kaiser Rom und Renovatio
    1929. Weaponised at Investiture Controversy.

anastasius_bibliothecarius_falsarius:
  english: Anastasius the Librarian as papal-archive forger (Flacius's charge)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0212"
  note: >
    Reformation critical-hermeneutical charge against Anastasius
    Bibliothecarius (already at n470 + n516). BIBLIOTHECARIUS AUTHORE
    SUSPECTO QUIPPE QUI SCRIPTA SUA CONCHARCINAUIT EX QUIBUS APOCRYPHIS
    ILLIS SCRIPTURIS IN SCRINIJS UEL BIBLIOTHECIS PAPAE QUIBUS PRAEERAT
    REPERTIS MODO ESSENT IN DOMINI SUA FAUOREM. Papal-monkish-familiar
    inflamed by ambition for papacy of his own time manufactured
    historical-textual proofs favourable to papal claims. FOUNDING-
    METHODOLOGICAL-PRINCIPLE OF REFORMATION HISTORICAL CRITICISM:
    papal-authorised sources composed by papal insiders (Anastasius,
    Liber Pontificalis compilers, pseudo-Isidorian Decretals of
    Benedictus Levita) must be read WITH SUSPICION of forgery-in-
    favour-of-papal-claims. Direct ancestor of Magdeburg Centuries
    1559-1574 and later historisch-kritische Methode.

# ─── Tranche 2ll — Privilegia refutation continued + Theodoric of Niem
# translatio-imperii + Adrianum privilegium 774 + Leo VIII 964 renewal to
