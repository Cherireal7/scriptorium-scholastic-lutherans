lateranense_palatium_prostibulum:
  english: The Lateran Palace as prostibulum (whore-house)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0191"
  note: >
    Lateranense palatium sanctorum quondam hospitium, nunc prostibulum
    meretricum. Reformation-standard identification of 10th-c Lateran
    with Babylon of Rev 17-18: the very seat that had been Constantine's
    basilica and Sylvester I's residence had become under John XII a
    brothel (widow Rainerius + Stephana + Anna widow with niece named as
    named victims). Luther Wider das Papsttum zu Rom vom Teufel gestiftet
    1545 WA 54:206-299 cites directly.

ioannes_xii_hungaros_incitat_conjuratio:
  english: John XII conspiring with Hungarians to invade Otto's Germany
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0193"
  note: >
    THE REFORMATION UNFORGIVABLE-SIN CHARGE: John XII sent Salecum
    (Bulgarian-Hungarian familiar of Pope) + Zacchaeus (reprobate
    freshly-consecrated bishop, ignorant of divine/human letters) to
    preach among Magyars so they would invade Otto's German lands.
    Magyars had raided German territory since c. 899; Otto crushed them
    at Battle of Lechfeld 10 August 955 = decisively ending Magyar
    raiding. John XII attempt to reignite Magyar invasion with freshly-
    consecrated bishop as agent = papal complicity with pagan invaders
    against Christendom. Papal lead bulla authenticated intercepted
    letters. Uhlirz Jahrbücher OttoII+III 1902 + Szőke Carolingian Age
    in Carpathian Basin 2014.

luitprandus_orator_apud_papam_ioannem_xii:
  english: Liutprand of Cremona as Otto's own legate to John XII
  type: reference
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0193"
  note: >
    Historian himself was one of two episcopal envoys (Landohard of
    Naumburg in Saxony + Liutprand of Cremona) sent by Otto to Rome to
    seek satisfaction from John XII with soldiers ready to fight judicial
    duel (iudicium Dei) to prove Otto's innocence. Gives Liutprand
    narrative extraordinary first-hand authority: historian is his own
    primary source. Reformation-standard authenticity claim. MGH SS
    rer.Germ. 41 Chiesa 1998; Karl Leyser Liutprand of Cremona in Rule
    and Conflict in an Early Medieval Society Oxford 1979.

iuramentum_romanorum_ottoni_electionem:
  english: Roman oath to Otto for imperial control of papal elections (963)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0194"
  note: >
    Historic oath. On receiving Otto after John XII second flight
    (autumn 963), Roman citizens swore NUNQUAM SE PAPAE ELECTUROS AUT
    ORDINATUROS PRAETER CONSENSUM ATQUE ELECTIONEM DOMINI IMPERATORIS
    OTTHONIS CAESARIS AUGUSTI FILIJQUE IPSIUS REGIS OTTHONIS. Ottonian
    imperial papal-electoral control predecessor to 1042 renewal.
    Reversed by Nicholas II 1059 decree (exclusive College-of-Cardinals
    election). Reformation-standard pre-1059 evidence.

roma_synodus_963_formales_accusationes:
  english: December 963 Roman Synod formal charges catalogue against John XII
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0197"
  note: >
    December 963 Roman Synod at St Peter's Basilica (4 or 6 Dec) formal
    sworn charges against John XII by Roman clergy: (i) celebrated Mass
    without communicating (Peter Card presb testified); (ii) ordained
    deacon in stable outside proper times (John of Narni + John Card
    diaconus); (iii) SOLD EPISCOPATES for money + ordained TEN-YEAR-OLD
    BOY as bishop in Todi (Benedict + Cardinals — canonical age 30 per
    Nicaea 325, triple-canonically-invalid: age+simony+defect of intention);
    (iv) sacrilege ("we saw more with our eyes than we say"); (v)
    ADULTERY with widow Rainerius + Stephana his father's concubine +
    Anna widow with niece = SACRED PALACE A LUPANAR (whore-house) and
    PROSTIBULUM; (vi) hunted publicly; (vii) blinded spiritual father
    Benedict and killed him; (viii) killed John Card subdeacon by
    mutilation; (ix) girded himself with sword+helmet+coat of mail;
    (x) all acclaimed for LOVE OF DEVIL wine drunk; (xi) in DICE-GAME
    INVOKED JUPITER, VENUS, other DEMONS = explicit paganism per 1 Cor
    10:20 = Reformation smoking-gun on papal apostasy; (xii) did not
    celebrate Matins or canonical hours; (xiii) did not sign himself
    with sign of cross. Standard Reformation-most-cited historical
    exhibit of papal apostasy. Laudage Otto der Große und der Papst 2003.

dei_ludi_iouis_veneris_daemonum:
  english: Dice-game invocation of Jupiter/Venus/demons (papal paganism)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0197"
  note: >
    In ludo aleae, Iouis, Veneris, ceterorumq[ue] daemonum auxilium
    poposcisse. Explicit paganism from Pope's mouth: at dice-table
    John XII called on pagan gods (Jupiter, Venus) whom Christian tradition
    following 1 Cor 10:20 classified as DEMONS. Reformation-standard
    smoking-gun on papal apostasy: very Vicar of Christ invoked the
    demons. Melanchthon Tractatus §41 Antichrist-identification of papacy.

puer_decem_annorum_episcopus_tudertinus:
  english: Ten-year-old boy ordained bishop at Todi for money (simony)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0197"
  note: >
    John XII ordained 10-year-old boy as bishop in city of Todi for
    money. Triple canonically invalid: age (canonical minimum 30 per
    Nicaea 325 canon), simony (money exchange), defect of intention.
    Reformation-standard example of papal disregard for canonical norm.

apertim_diabolica_negocia_pertractat:
  english: John XII openly transacts diabolical business without concealment
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Otho primus Liutprand at vl0197"
  note: >
    Roman Cardinals' own denunciation of John XII at 963 synod: non iam
    de illis est, qui ueniunt in uestimentis ouium, intus autem sunt lupi
    rapaces: sed ita apertè saeuit, ut apertè diabolica pertractat
    negocia, ut nihil circuitionis utatur. John XII does not even use
    pretence of wolf-in-sheep's-clothing (Matt 7:15); openly rages,
    openly transacts diabolical business, using no circumlocution. Most
    extreme Reformation-anticipating formulation FROM THE MOUTHS OF 10th-c
    ROMAN CARDINALS THEMSELVES: John XII openly wears insignia of
    Antichrist.

