gregorius_vii_donationum_nec_meminit:
  english: Gregory VII never invoked Constantine or Louis donations
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0215"
  note: >
    Great Gregorian-reform pope who fought Henry IV in Investiture
    Controversy 1075-1122 NEVER invoked either Constantine's or Louis's
    donations in his canonical-polemical arsenal = striking ex silentio
    argument. Gregory relied only on Matt 16:18-19 + Luke 22:38 (duo
    gladii) distorted to universal-temporal jurisdiction. Reformation-
    standard historical-critical: even Pope who would most benefit from
    citing these donations did not cite them, because they were forged
    (or not yet in circulation). Ian Robinson The Papacy 1073-1198
    Cambridge 1990.

gregorius_iv_imperatoris_confirmatione_827:
  english: Gregory IV (827) refused pontificate until imperial confirmation
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0215"
  note: >
    Gregory IV r. 27 Dec 827-25 Jan 844 elected in last years of Louis
    the Pious, REFUSED to enter the pontificate until Louis's imperial
    legates confirmed the election. Standard Reformation-standard exhibit
    of continuing imperial ecclesiastical superintendence = direct
    contradiction of Constitutum Ludovicianum's claim that Louis had
    already renounced this right. Platina adds Louis did this not out
    of arrogance but so as not to lose imperial-fear-of-populace.
    MGH Concilia II.2 Werminghoff; Zielinski Lex des Mittelalters IV 1989.

translatio_imperii_a_graecis_ad_germanos_754:
  english: Pope Stephen II 754 transferred Empire from Greeks to Germans
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0217"
  note: >
    TRANSTULIT IMPERIUM DE GRAECIS IN GERMANOS IN PERSONA DICTI CAROLI.
    Medieval doctrine (developed in 12th-14th c imperial-ideological
    literature: Otto of Freising, Dante Monarchia, Marsilius of Padua)
    that Empire passed from Byzantium (through Constantine + Justinian
    + Byzantines) to Frankish-German line via papal mediation in 754
    (Stephen II) / 800 (Leo III / Charlemagne). Reformation-standard
    evidence for imperial-ecclesiastical continuity + GERMAN-IMPERIAL
    CHARACTER of medieval Empire (against contemporary papal-Italian
    claims to sovereignty). Kantorowicz King's Two Bodies Princeton
    1957 chs.3-4. Historically compresses Stephen II 754 mission to
    Pippin the Short (Donation of Pippin 756 = founding of Papal States)
    with Charlemagne's later 773-774 expedition.

carolus_natus_ingelheim_moguntinae:
  english: Charlemagne born at Ingelheim palace in Mainz diocese Rhine
  type: reference
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0218"
  note: >
    IN OPPIDO IMPERIALI INGENHEIM MAGUNTINAE DIOECESIS SUPER FLUMINE
    RHENI CONSISTENTE. Ingelheim am Rhein one of 3 great imperial-
    Carolingian palace-complexes (with Aachen + Nijmegen). Charlemagne
    traditionally reported born there (modern scholarship favours Herstal
    or Aachen). Charles IV r. 1346-1378 transformed palace into Bohemian
    Regular Canons cœnobium reflecting Luxembourg-Bohemian imperial
    reception of Charlemagne's legacy. His son Sigismund r. 1410-1437 HRE
    is Theodoric of Niem contemporary. Bertrada (Bertha) Charlemagne's
    mother was Frankish not Greek; de Graecia oriunda claim medieval-
    legendary elevating Carolingian status by putative Byzantine-imperial
    ancestry.

carolus_pavia_745_desiderius_captus:
  english: Charlemagne captured Desiderius at Pavia 774 + Easter 774 Rome
  type: reference
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0218"
  note: >
    Charlemagne's Italian campaign 773-774: besieged Pavia; went to Rome
    for Easter Sunday 2 April 774; ceremonially received by Pope Adrian
    I at steps of St Peter's Basilica with acclamations CAROLO VICTORI
    PERPETUO AUGUSTO A DEO VITAM ET VICTORIAM = traditional Byzantine-
    imperial acclamation-formula preserved. After Easter returned to
    Pavia, June 774 city surrendered, King Desiderius r. 757-774 captured
    and exiled to Frankish monastery; son Adalgis fled to Byzantine court
    Constantinople continued intrigues. Charlemagne assumed crown of Italy
    same year. Reformation-standard evidence of Byzantine-formal-continuity
    in translatio imperii. McKitterick Charlemagne Cambridge 2008 ch. 1.

adrianum_privilegium_774_lateranense:
  english: Adrianum privilegium 774 Lateran Synod 4 imperial ecclesiastical rights
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0219-vl0220"
  note: >
    Pope Adrian I 774 Lateran Synod at San Salvatore basilica with 153
    religious men (bishops, abbots, judges, law-doctors) conceded to
    Charlemagne 4 imperial-ecclesiastical rights: (i) IUS ELIGENDI SUMMUM
    PONTIFICEM (right to elect highest pontiff) (ii) ORDINANDI APOSTOLICAM
    SEDEM (right to ordain Apostolic See) (iii) DIGNITAS PATRICIATUS
    (dignity of Patrician of Romans) (iv) INVESTITURAE EPISCOPORUM +
    ARCHIEPISCOPORUM PER SINGULAS PROUINCIAS = FOUNDING-CHARTER OF
    IMPERIAL EPISCOPAL-INVESTITURE, the very right Gregory VII attempted
    to abolish in Investiture Controversy 1075-1122, finally settled
    Concordat of Worms 1122. Preserved Gratian Decretum Distinction 63
    c. 22 Hadrianus (Friedberg CIC I:238-40). Modern historicity contested:
    Fuhrmann Einfluss und Verbreitung pseudoisidorischen Fälschungen
    3 vols Stuttgart 1972-4 classes with pseudo-Isidorian forgery-complex
    of mid-9th c not genuine 8th-c tradition. Reformation-standard
    reception (Flacius + Magdeburg Centuries) accepts historicity.

roma_lex_regia_ad_carolum_transtulit:
  english: Roman people transferred lex regia to Charlemagne (populist theory)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0219"
  note: >
    POPULUS ROMANUS CONCESSIT EI ET IN EUM TRANSTULIT OMNE IUS SUUM ET
    POTESTATEM. Roman lex regia (Institutes 1.2.6 + Digest 1.4.1 Ulpian
    QUOD PRINCIPI PLACUIT LEGIS HABET VIGOREM) that Roman people
    transferred imperium et potestas to Emperor. Theodoric of Niem here
    retroactively applies to Charlemagne's 774 assumption of Italian
    crown. Reformation-standard evidence for POPULIST/CONTRACTUAL origin
    of imperial authority = ANCESTOR OF SOCIAL CONTRACT THEORY running
    through Marsilius + Bartolus + Nicholas of Cusa + 17th-c political
    theorists (Grotius, Hobbes, Locke).

privilegium_ottonianum_leonianum_964:
  english: Leo VIII 964 renewal of Adrianum privilegium to Otto I in perpetuity
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Privilegia at vl0221-vl0222"
  note: >
    Leo VIII r. 963-965 formal RENEWAL of Adrianum privilegium 774 to
    Otto I "TEUTONICO REGI DIGNISSIMO" in perpetuity: dignitas Patriciatus
    + investiturae episcopatum. Historically dated 13 February 962 as
    PRIVILEGIUM OTTONIANUM (already at n596); Theodoric of Niem here
    places later 963-964, reflecting specific manuscript tradition.
    Reformation-standard evidence for TWO SUCCESSIVE PAPAL-CONCILIAR
    CONCESSIONS (774 Hadrian + 962 Leo) of imperial ecclesiastical
    superintendence = constitutional-canonical foundation of pre-Investiture
    Ottonian-imperial Church. MGH Diplomata regum et imperatorum Germaniae
    I:322-324; Sickel Das Privilegium Otto I. Innsbruck 1883.

