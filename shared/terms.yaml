# ─── POLEMICAL VOCABULARY ───────────────────────────────────────────────

adiaphora:
  english: Adiaphora
  type: polemical
  first_use: ""
  note: Preserve untranslated. Central to 16th-c. Interim controversies.

syncretismus:
  english: Syncretism
  type: polemical
  first_use: ""
  note: >
    Central to Dannhauer's ***Mysterium syncretismi*** and to Calixtine
    polemics generally.

consensus_quinquesaecularis:
  english: Consensus of the First Five Centuries
  type: polemical
  first_use: ""
  note: >
    Calixtine irenic principle — that the first 5 c. of the Church furnish
    a sufficient doctrinal norm. Lutheran orthodoxy sharply rejects.

articuli_fundamentales:
  english: Fundamental Articles
  type: polemical
  first_use: ""
  note: >
    Calixtine distinction between fundamental and non-fundamental doctrines
    of faith.

fundamentaltheologie:
  english: Fundamental Theology
  type: polemical
  first_use: ""

# ─── SCHOLASTIC METHOD ──────────────────────────────────────────────────

reduplicative:
  english: Reduplicatively
  type: scholastic
  first_use: ""
  note: >
    Distinct from ***specificative***. Scholastic distinction on modes of
    predication.

specificative:
  english: Specificatively
  type: scholastic
  first_use: ""

analogia_entis:
  english: Analogy of Being
  type: scholastic
  first_use: ""
  note: >
    Roman Catholic scholastic doctrine; Lutheran orthodoxy variously
    engages (Gerhard, Calov) or rejects (Dannhauer).

concursus_divinus:
  english: Divine Concurrence
  type: dogmatic
  first_use: ""
  note: >
    Providence — how God concurs with created causes. Central to
    predestination and to human freedom debates.

# ─── CONFESSIONAL AND ECCLESIASTICAL VOCABULARY ─────────────────────────

concordia:
  english: Concord
  type: dogmatic
  first_use: ""
  note: >
    Both the general concept and the confessional documents. Preserve for
    ***Formula Concordiae*** and ***Book of Concord***.

formula_concordiae:
  english: Formula of Concord
  type: dogmatic
  first_use: ""
  note: Preserve Latin.

corpus_doctrinae:
  english: Corpus Doctrinae
  type: dogmatic
  first_use: ""
  note: The 16th-c. Lutheran confessional collections.

kirchenordnung:
  english: Church Ordinance
  type: dogmatic
  first_use: ""
  note: German source term; preserve when the source is German.

landeskirche:
  english: Territorial Church
  type: dogmatic
  first_use: ""

symbolum:
  english: Confession (of faith)
  alt: [Creed]
  type: dogmatic
  first_use: ""

# ─── CATECHETICAL — from Chytraeus 1594 (Ch. 1 Prolegomena) ────────────

catechesis:
  english: Catechesis
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1"
  note: >
    Oral, methodical instruction in the elements of Christian doctrine,
    with examination. From Greek κατηχέω (katēcheō), "to sound into
    the ear," "to instruct by voice." In Chytraeus preserved untranslated
    as the subject of definition throughout the volume.
  see_also: [summa_doctrinae_christianae, examen, catechumeni]

katecheo:
  english: To instruct by voice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 10"
  note: >
    κατηχέω. NT usage: Luke 1:4; Acts 18:25; Rom 2:18; 1 Cor 14:19;
    Gal 6:6. The etymon of "catechesis." "To sound down into the ear."

summa_doctrinae_christianae:
  english: The summa of Christian doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 1"
  note: >
    Technical Melanchthonian phrase — the systematic ordered epitome of
    the whole of Christian doctrine, from which loci-based method flows.
    Cf. Melanchthon Loci Communes 1521 preface (CR 21:81).
  see_also: [loci_communes, loci_praecipui, catechesis]

theologia:
  english: Theology
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 2"
  note: >
    In Chytraeus's opening definition (following Melanchthon Loci
    Praecipui 1559, CR 21:606-7): the doctrine concerning God's essence,
    will, benefits (through Christ), and the worships owed to Him —
    made manifest in Scripture and efficacious for the salvation of
    believers.

agnitio_dei:
  english: Acknowledgement / knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Not mere notitia (information) about God, but the reverent
    recognition of God as God, which issues in worship. Standard
    Lutheran-orthodox distinction; distinguished from cognitio Dei
    in the technical scholastic register (Gerhard, Loci I).
  see_also: [cognitio_et_invocatio_dei, vera_dei_agnitio]

cognitio_et_invocatio_dei:
  english: Knowledge and invocation of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 9"
  note: >
    The dual formula summarising the practical aim of theology: cognitio
    issuing in invocatio. The pattern for the Lutheran division of the
    Decalogue's First Table.
  see_also: [agnitio_dei, praxis_theologiae]

vera_dei_agnitio:
  english: The true knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 4"
  note: >
    The material subject of Locus I of Chytraeus's Catechism. In
    Lutheran-orthodox usage, distinguishes the trinitarian revealed
    God from the God-of-natural-reason.
  see_also: [agnitio_dei]

praxis_theologiae:
  english: The practice of theology
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Chytraeus identifies religio Christiana with theology-in-practice —
    cognition issuing in worship. Not theologia practica in the later
    17th-c. sense (Voetius, van Mastricht) but the immediate ordering
    of doctrine to worship.

religio_christiana:
  english: The Christian Religion
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Not a genus of which paganism is another species, but the only true
    worship of God, defined by Christ, the Word, faith, and the
    Sacraments. Anti-pagan and anti-natural-religion in emphasis.

religio_ethnica:
  english: Pagan religion
  type: polemical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 6"
  note: >
    The category of external-cultic religion opposed to the religio
    Christiana. Includes both classical polytheism and any humanly-
    invented ceremonial system.

authoritas_divina:
  english: Divine authority
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    In the Lutheran doctrine of Scripture, the formal cause of the
    certitude of Christian doctrine — DIXIT DOMINUS.
  see_also: [patefactio_divina, sacra_scriptura]

patefactio_divina:
  english: Divine self-revelation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Chytraeus's preferred term (over revelatio) for the divine act of
    making Himself known in the written Word. Emphasises the openness
    of what was hidden.

rationes_certitudinis:
  english: Grounds of certainty
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Chytraeus's eleven-point enumeration of the subordinate arguments
    for the certitude of Christian doctrine. Parallels Gerhard Loci
    Theologici I, De Scriptura Sacra.

miracula_divinae_omnipotentiae:
  english: Miracles of the divine omnipotence
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Especially the resuscitationes hominum mortuorum (raisings of the
    dead), which Chytraeus (following Melanchthon and the pre-Chemnitz
    apologetic tradition) argues are proper to God alone.

conservatio_ecclesiae:
  english: Conservation of the Church
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    The standing miracle of the Church's survival against all
    persecution — one of Chytraeus's rationes certitudinis. Cf. Luther
    WA 30.2:632.

capita_doctrinae:
  english: Chief heads of doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    In catechetical usage, the duo capita are Law and Gospel;
    pedagogically expanded into the ten loci in Chytraeus's scheme.
  see_also: [loci_praecipui, lex_et_evangelium]

decalogus:
  english: The Decalogue
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Preserved in Latin as the standard catechetical designation.
    Chytraeus locates the definitions of all virtues under it.

symbolum_fidei:
  english: The Symbol of the Faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Apostles' or Nicene Creed. Preserved in Latin as the technical
    designation of the confessional formula.

locus:
  english: Locus (theological)
  alt: [loci]
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    The systematic "place" or heading under which theology is disposed.
    Preserved in Latin because (i) technical, (ii) the subject of
    division in Chytraeus's Prolegomena, and (iii) foundational to
    Melanchthonian and post-Melanchthonian Lutheran method.
  see_also: [loci_communes, loci_praecipui, sedes_doctrinae]

loci_communes:
  english: Common places (theological loci)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Melanchthon's Loci Communes rerum theologicarum (1521, definitive
    ed. 1559 = CR 21). Chytraeus's explicit model.

loci_praecipui:
  english: The chief loci
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 4"
  note: >
    The ten Chytraeus enumerates. Not fixed at ten in the earlier
    Melanchthonian scheme; Chytraeus's pedagogical reduction.

# ─── LUTHER'S THREE INSTRUMENTS OF THEOLOGY (WA 50:658-61, 1539) ────────

oratio_meditatio_tentatio:
  english: Prayer, meditation, temptation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Luther's three instruments of theology, from the 1539 preface to
    Vol. I of the German Wittenberg edition, drawn from Ps 119. The
    complete formula: (1) oratio ardens et quotidiana — burning and
    daily prayer; (2) meditatio — sustained attention to Scripture;
    (3) tentatio — the touchstone (lapis Lydius) by which the Word's
    true efficacy is proved. Chytraeus recommends verbatim.
  see_also: [precatio_ardens, meditatio, tentatio, textus_bibliorum]

precatio_ardens:
  english: Burning prayer
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: The first of Luther's three instruments as Chytraeus formulates it.

meditatio:
  english: Meditation (on Scripture)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    In Luther's three-instrument scheme, sustained prayerful attention
    to the text of Scripture. Not the mystical or contemplative
    meditatio of the older monastic tradition.

tentatio:
  english: Temptation, tribulation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    The third of Luther's three instruments. Called by Luther lapis
    Lydius — the touchstone which teaches the theologian by experience
    the sweetness and power of God's Word. WA 50:660.

experientia_theologica:
  english: Theological experience
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Chytraeus's own gloss on tentatio: not empirical experience but the
    experience of faith under trial. Prefigures the 17th-c. Lutheran
    distinction between theologia archetypa and theologia ectypa in
    Gerhard.

# ─── SOURCES CHYTRAEUS CITES ────────────────────────────────────────────

textus_bibliorum:
  english: The text of the Bibles
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Chytraeus's preferred term for the primary source of theology.
    Marks the humanist ad-fontes commitment already in the Melanchthon
    tradition.

lingua_hebraea:
  english: The Hebrew language
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"

lingua_graeca:
  english: The Greek language
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"

dialectica_methodus:
  english: Dialectical method
  type: scholastic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    In the Melanchthonian curriculum, not sophistical disputation but
    the methodical art of definition, division, argument, and
    refutation — a preparatory discipline for theology.

magister_sententiarum:
  english: The Master of the Sentences (Peter Lombard)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Peter Lombard, whose Sententiae (c. 1150) remained the standard
    textbook of Latin theology into the 16th c. Chytraeus's inclusion
    of him in the theological curriculum is a humanist-Lutheran
    willingness to use Lombard as a historical source.

acta_conciliorum:
  english: Acts of the Councils
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    The standard 16th-c. collection was Peter Crabbe, Concilia Omnia
    (Cologne, 1538 and 1551), later superseded by the Roman edition of
    Severin Binius.

# ─── PEDAGOGICAL / SCHOOL VOCABULARY ────────────────────────────────────

auditores:
  english: Auditors, hearers
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 10"
  note: The catechumens as hearers of the catechetical instruction.

catechumeni:
  english: Catechumens
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    Those under catechesis, particularly pre-baptismal in the primitive-
    church usage that Chytraeus invokes.

examen:
  english: Examination
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    Both (i) the act of examining a learner, and (ii) the specific
    reference to Chemnitz's Examen Concilii Tridentini (Frankfurt,
    1565-73) as Chytraeus's stated textbook.

confessio_fidei:
  english: Confession of faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    In Chytraeus's argument, the confessio the every Christian must
    render is the ecclesial ground of the practice of examination.

finis_studiorum:
  english: The end (goal) of studies
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 9"
  note: >
    Chytraeus distinguishes proximate ends (wisdom, expressive ability)
    from the principal end (the agnitio et celebratio Dei).

# ─── HUMANIST / TOPONYMIC ─────────────────────────────────────────────

urbs_rosarum:
  english: The City of Roses (Rostock)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Rostock. The epithet is standard in 16th-c. Rostock self-designation,
    from the three roses on the city's arms. Chytraeus dates his
    dedication "Ex Academia urbis Rosarum."

argentoratensis_academia:
  english: The Academy of Strasbourg
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Founded by Johannes Sturm 1538 as Gymnasium, raised to Academia
    (right to confer BA/MA) 1566, to full university 1621. In the
    1560s the most-praised humanist school in the Empire.

sarepta:
  english: Sarepta (as type-name for Rostock)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Ṣarpath / Sarafand, the widow's town where Elijah lodged during
    the drought (1 Kgs 17:8-24). Chytraeus applies the type to Rostock,
    where he was preserved and taught. Standard trope among 16th-c.
    north-German reformers.

pio_et_candido_lectori:
  english: To the Pious and Candid Reader
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, prefatory address"
  note: >
    Standard 16th-c. dedicatory formula for the address-to-reader that
    complements the epistola dedicatoria to a patron. Chytraeus's
    version is dated Die Lucae 1575.

epistola_dedicatoria:
  english: Dedicatory Epistle
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Chytraeus's is dated 7 January 1568 to Bernhard von Menzingen,
    son of his patron Peter von Menzingen. Preserved unchanged in the
    1594 revision.

paterfamilias:
  english: Head of the household
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    In the Roman-humanist ethical vocabulary Chytraeus borrows, a
    title of civic and pious dignity — the pattern of the pious
    Christian householder, applied to the elder Menzingen.

genus_doctrinae:
  english: Kind, or genre, of doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    In Chytraeus's argument at § 7 (IV): the very sort of teaching
    that Scripture is — making manifest what is hidden to reason — is
    itself an argument for its divinity.

# ─── CHYTRAEUS 1594 · Locus I (De Deo, De Trinitate, De Christo) ────────

symbolum_apostolicum:
  english: The Apostles' Creed
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 1"
  note: >
    In Chytraeus's pedagogical usage, the simplicissima et prima forma
    doctrinae de Deo — the priority-form for children's catechesis.
    The Nicene enters at the confessional-doctrinal level.
  see_also: [symbolum_fidei, symbolum_nicaenum]

essentia_dei:
  english: The essence of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 2"
  note: >
    Chytraeus's compact list of divine attributes: spiritualis, aeterna,
    vera, sapiens, bona, misericors, omnipotens. Anticipates the fuller
    scholastic-Lutheran treatment in Gerhard Loci II.

persona_boethiana:
  english: Person (Boethian definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 3"
  note: >
    Individua substantia intelligens, incommunicabilis, non sustentata
    in alio. Chytraeus's expansion of the Boethian definition (naturae
    rationabilis individua substantia — Boethius Contra Eutychen III,
    PL 64:1343) with the Thomist qualifiers (STh I q.29 a.1) — making
    the definition precise for Trinitarian and Christological use.
  see_also: [unio_personalis, hypostasis]

fundamentum_totius_doctrinae:
  english: Foundation of the whole theological doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 4"
  note: >
    Chytraeus's compact statement of the Lutheran Sola Scriptura:
    nothing about God's essence or will is to be thought or taught
    except as He has revealed Himself in the Word delivered through
    the Prophets and Apostles. Deut 4:2; Isa 8:20.
  see_also: [sola_scriptura, authoritas_divina]

logos_verbum:
  english: Word (Logos, Verbum)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 8"
  note: >
    Chytraeus's double aspect: (i) respectu Patris — the Son as the
    substantial Image of the Father; (ii) respectu nostri — the Son as
    the One who speaks the Gospel promise and is efficacious in His
    Word. Cf. Chemnitz De Duabus Naturis, cap. II-IV.

imago_patris_substantialis:
  english: The substantial and integral Image of the Father
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 6"
  note: >
    The Son as imago consubstantialis — distinguished from the imago
    Dei in man (an accidental created likeness, capable of loss and
    restoration).

homoousion:
  english: Of the same substance (homoousion)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 10"
  note: >
    ὁμοούσιον. The Nicene-Constantinopolitan term for the
    consubstantiality of the persons. Chytraeus applies it to the Holy
    Spirit as well as to the Son, following Athanasius Ep. ad Serapionem.

pneuma_hagion:
  english: Holy Spirit (Πνεῦμα ἅγιον)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 9"
  note: >
    Chytraeus's account of the Spirit's processio is Filioquist (Western,
    a Patre Filioque) — the settled Lutheran doctrine, articulated
    against the Reformed and confirmed at the Formula of Concord.

filioque:
  english: And from the Son
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 9"
  note: >
    The Western clause added to the Nicene-Constantinopolitan Creed on
    the Spirit's procession, formally affirmed by Lutheran orthodoxy.

incarnatio_filii_dei:
  english: Incarnation of the Son of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 12"
  note: >
    Chytraeus's definition — unio personalis duarum naturarum — is
    Chalcedonian and closely tracks Chemnitz De Duabus Naturis (Jena,
    1571/1578), cap. II. Both natures preserved without confusion,
    change, division, or separation.
  see_also: [unio_personalis, chalcedonense]

assumptio_naturae_humanae:
  english: Assumption of human nature
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 11"
  note: >
    The one-way movement of the Incarnation: the Son of God takes to
    Himself human nature — not the reverse. Central to Lutheran
    Christological polemics.

emmanuel_quatuor_causae:
  english: Emmanuel — four causes
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 13"
  note: >
    Chytraeus's four-fold explanation of the name Emmanuel (Isa 7:14,
    Matt 1:23): (1) assumption of our nature, (2) intercession and
    price of redemption, (3) indwelling by faith, (4) presence in
    perils and death.

synaphos:
  english: Joined-together (σύναφος)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 12"
  note: >
    Chytraeus's Greek Christological adjective for the Emmanuel-union —
    rare in classical usage but functional in his Christological
    register.

syngenos:
  english: Kindred (σύγγενος)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 13"
  note: >
    Applied to Christ as "flesh of our flesh, bone of our bones" in
    the assumption of our nature.

homogenes:
  english: Of the same kind (ὁμογενής)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 15"
  note: Applied to Christ as sanctifier of the assumed nature.

mediator_definitio_chytraei:
  english: Mediator (definition per Chytraeus)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 14"
  note: >
    The Person set between angered God and guilty man, who satisfies
    divine justice, sustains wrath and punishment, pleads for us,
    applies His merits, and hears our prayers. Anselmic-scholastic
    in structure, confessionally Lutheran in idiom.
  see_also: [satisfactio_vicaria, mediator]

munus_triplex_christi:
  english: The threefold office of Christ
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 16"
  note: >
    Prophet (revealing the Father through the Gospel), Priest
    (interceding and satisfying), King (governing and defending the
    Church). Common Reformation property; Chytraeus articulates it
    without naming Calvin.

praxis_pietatis:
  english: The practice of piety
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 18"
  note: >
    Chytraeus's identifier of the true Church of God: not doctrine as
    speculation but doctrine as invocation, gratitude, and obedience.
    Distinct from the later 17th-c. Pietist theologia practica.

invocatio_dei_vera:
  english: True Invocation of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 19"
  note: >
    Chytraeus's definition centres on (i) address to the true
    trinitarian God, (ii) knowledge of the promise, (iii) confidence
    of hearing on account of Christ the Mediator.

partes_invocationis:
  english: Parts of Invocation (six)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 20"
  note: >
    Chytraeus's six: compellatio, cogitatio mandatorum, poenitentia seu
    confessio, consideratio promissionis, fides, commemoratio.

paracletus:
  english: Comforter, Paraclete
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 18"
  note: >
    Johannine title of the Holy Spirit (John 14:16, 26; 15:26; 16:7).
    Preserved on formal Trinitarian occurrence.

septem_petitiones:
  english: The seven petitions of the Lord's Prayer
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 20"
  note: Matt 6:9-13.

# ─── CHYTRAEUS 1594 · Locus II (De Creatione, De Providentia, De Homine) ─

creatio_ex_nihilo:
  english: Creation out of nothing
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 1"
  note: >
    Chytraeus's definition stresses (i) actio externa Dei — outward, not
    an eternal emanation from the divine essence (against Neoplatonic
    and Origenist inheritance); (ii) ex nihilo — against Aristotelian
    eternalism; (iii) ecclesiological finis — the eternal Church, not
    the world for its own sake.

opera_trinitatis_ad_extra:
  english: The outward works of the Trinity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 2"
  note: >
    In Lutheran orthodoxy, indivisa — every outward work is jointly of
    the Father, the Son, and the Holy Spirit. Preserved untranslated on
    formal doctrinal use. Cf. Augustine De Trinitate I.4.7; Aquinas STh
    I q.45 a.6.

hexaemeron:
  english: The Six-Day Work of Creation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 3"
  note: >
    The literal six days of Gen 1:1-2:3, per the standard 16th-c.
    Lutheran hexaemeral reading (Luther In Genesin, WA 42:1-91).

theatrum_naturae:
  english: The Theatre of Nature
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, locus II § 4"
  note: >
    Chytraeus's humanist metaphor for the created universe as a schola
    sapientiae Dei. Ultimately from Cicero De Natura Deorum II.98,
    mediated through Melanchthon Initia Doctrinae Physicae (1549).

providentia_generalis_specialis:
  english: Providence (general and special)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    Chytraeus's twofold definition: (i) action of the divine mind that
    sees and foresees; (ii) government by which God preserves, cares
    for the human race, punishes crimes, rewards righteousness.
  see_also: [determinatio_divina, concursus_divinus]

determinatio_divina:
  english: Divine determination
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    A part of Providence: God, seeing all events, helps the good,
    permits the evil, and to that permission sets times and limits.
    Classical distinction between God's voluntas signi and His
    permission.

permissio_divina:
  english: Divine permission
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    God's negative-permissive relation to evil, distinguished from His
    positive will. God permits evil but sets its limits.

angeli_boni:
  english: Good Angels
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 6"
  note: >
    Spiritual essences, created to God's image (intelligent, truthful,
    just, free-willed), immortal, ordained by God to celebrate Him,
    servants of the Church and guardians of the pious.

diaboli:
  english: Devils
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 7"
  note: >
    Initially created to God's image, fell by depravitas propriae
    voluntatis (not by divine impulse — the Augustinian anti-Manichaean
    point), enemies of God, God-permitted, God-repressed, God-terminated
    at the Last Judgement. Cf. Augustine De Civitate Dei XI.9-17.

anima_immortalis:
  english: The immortal soul
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 9"
  note: >
    Chytraeus's insistence that the soul is not extinguished when it
    departs from the body — aimed against the mortalist (psychopannychist)
    tradition in the radical Reformation. Fuller treatment in Locus X.

vires_animae_quinque:
  english: The five powers of the soul
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Rational, sensitive, appetitive, locomotive, vegetative. The
    Aristotelian-Melanchthonian scheme (Aristotle De Anima II-III;
    Melanchthon De Anima 1553, CR 13:5-178). Chytraeus was Melanchthon's
    student and here reproduces the master's textbook.

mens_intellectus:
  english: Mind / Intellect
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Power of rational soul, rectrix vitae, seat of the principia et
    normae artium (axioms of the arts), including the λόγοι of number
    and order. Given chiefly ad cognoscendum Deum — for the knowledge
    of God.

voluntas_indeclinabilis:
  english: Will (not compelled)
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Pre-lapsarian will was indeclinabilis — not compelled either to good
    or to evil — but acquiescens in lege Dei. Careful pre-Formula-of-
    Concord language; not semi-Pelagian since it treats the pre-lapsarian
    condition.

affectus_cordis:
  english: Affects of the heart
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Motions of the will or heart following cognition — species and
    forms of movement accompanied by delight or pain, by which we
    pursue or flee the object shown by mind or sense.

imago_dei_in_creatione:
  english: The Image of God in creation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    Chytraeus's threefold analysis: mind illuminated with true knowledge
    of God + will freely loving and obeying God + heart with affects
    conformable to the Law of God. Follows Melanchthon Loci Praecipui
    1559, CR 21:665-69.
  see_also: [renovatio_imaginis, imago_dei]

renovatio_imaginis:
  english: The renewal of the Image of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    Renewal of the imago Dei in Christ, per Col 3:10, Eph 4:24,
    2 Cor 3:18 — the standard Lutheran axis for renewed anthropology.

archetypus:
  english: Archetype
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    God Himself, of whom the imago in man was the similitude and
    conformity of the principal human powers. Preserved on formal use.

liberum_arbitrium_ante_lapsum:
  english: Free choice before the Fall
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Integrity of mind and will — Adam had libertas contradictionis,
    free to obey or to fall. FC SD I §9-11, Art. II §10-12.

liberum_arbitrium_post_lapsum:
  english: Free choice after the Fall
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Retains natural competence in things of civil life (honest / base,
    useful / useless), but servile et captivum et mortuum in things
    pertaining to salvation. Luther De Servo Arbitrio (1525) doctrine
    as received into FC SD II §7, 17, 24, 60.

liberum_arbitrium_in_renatis:
  english: Free choice in the regenerate
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Careful post-Formula theology by a Formula signatory (Chytraeus,
    1577): (i) liberated by the Son — passive; (ii) helped by the Holy
    Spirit — cooperative; (iii) by their own effort and diligence in
    SANCTIFICATION (not in conversion). Explicitly allows the possibility
    of losing faith (et rursum a Deo deficere potest) — against Reformed
    perseverantia sanctorum.
  see_also: [concursus_divinus, perseverantia_sanctorum]

tenebrae_peccati:
  english: Darkness of sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Chytraeus's term for the noetic effect of the Fall — the mind is
    oppressa and cannot rightly know God's essence or will.

aversa_adversa_deo:
  english: Averse to and set against God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Chytraeus's FC-conformable description of the fallen will and heart
    (aversa et adversa Deo).

servum_arbitrium:
  english: Servile choice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Luther's De Servo Arbitrio (1525), WA 18:632-787. The fallen will
    is servile, captive, and dead in things pertaining to salvation.
    Received by Chytraeus and by FC SD II.

perseverantia_sanctorum:
  english: Perseverance of the saints
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Reformed doctrine (five points of Dort will formalise later) that
    the regenerate cannot finally fall. Chytraeus, following the Formula
    of Concord, allows that they CAN fall — et rursum a Deo deficere
    potest.

# ─── CHYTRAEUS 1594 · Locus III Part 1 (De Lege Dei — Framework + 1st Table)

lex_dei_duplex_definitio:
  english: The Law of God (twofold definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III §§ 1-2"
  note: >
    (i) Brief: the Ten Commandments. (ii) Melanchthonian: the eternal
    and unmoved wisdom and rule of righteousness in God, discerning
    right and non-right, obliging all rational creatures. Cf.
    Melanchthon Loci Praecipui 1559, De Lege, CR 21:685-89.
  see_also: [decalogus, lex_moralis, lex_naturae]

lex_moralis:
  english: The Moral Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The part of the Mosaic Law which is eternal and immutable — the
    Decalogue itself. Distinct from Leges ceremoniales and Leges
    forenses which were abrogated with the Mosaic polity.

leges_ceremoniales:
  english: Ceremonial Laws
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The rites and cultic prescriptions of the OT, abrogated in the NT.
    Types of Christ. FC SD V, VI.

leges_forenses:
  english: Forensic Laws
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The judicial and civil prescriptions of the Mosaic polity,
    abrogated with the polity itself when Christ was exhibited.

lex_naturae:
  english: Law of Nature
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 5"
  note: >
    The notice of the divine Law innate by God in human nature (Rom 2:15).
    Its sum is contained in the Decalogue. Melanchthonian-humanist
    mainstream, not the strong voluntarism of some later Reformed
    writers.

leges_positivae_humanae:
  english: Positive Human Laws
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus III § 6"
  note: >
    Political laws laid down by magistrates as adminicula of the Law of
    Nature; mutable, binding only to external obedience and bodily
    penalties, only binding those to whom given.

politeia_mosis:
  english: The polity of Moses
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 8"
  note: >
    The whole Mosaic ecclesiastical-civil order, described by Chytraeus
    as hospitium et schola Christi — the domicile and school of Christ
    before His manifestation. Draws on Gal 3:24 (paedagogus in Christum).

impletio_legis_quatuor_modis:
  english: Christ's four-fold fulfilment of the Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 9"
  note: >
    (i) Perfect active obedience for our person; (ii) sufficient passive
    obedience/penalty for our disobedience; (iii) right explanation of
    the true meaning of the Law (Sermon on the Mount); (iv) new
    obedience in believers through the Holy Spirit (tertius usus legis).
    Cf. FC SD III §14-15; SD VI.
  see_also: [tertius_usus_legis, iustificatio, satisfactio_vicaria]

maledictio_legis:
  english: The malediction (curse) of the Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 10"
  note: >
    What Christ took upon Himself (Gal 3:13) and from which the
    justified are liberated. But the eternal obligation to obedience
    remains — Formula-of-Concord doctrine.

libertas_christiana:
  english: Christian Liberty
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 11"
  note: >
    NOT licence to do whatever one pleases; the liberation from sin,
    wrath, curse of the Law, Mosaic ceremonies and forensic laws, and
    external rites without divine command (outside the case of scandal).
    Cf. Luther De Libertate Christiana (1520), WA 7:49-73.

pietas_erga_deum:
  english: Piety toward God (Religion)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The common genus of all the virtues of the First Table in Chytraeus's
    eight-virtue enumeration (Wisdom, Fear, Faith, Love, Hope, Humility,
    Patience, Perseverance).

vera_notitia_dei:
  english: True knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    To rightly acknowledge God's essence and will as revealed in the
    Law and Gospel, confirmed by illustrious testimonies of miracles
    (exodus, resurrection of the dead).

caligo_mentis:
  english: Blindness of the mind
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The noetic effect of the Fall, opposite of vera notitia Dei. Cf.
    Locus II § 12 (tenebrae peccati).

timor_dei_filialis:
  english: Filial fear of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Not servile terror but reverent submission and shunning of crimes.
    Chytraeus's two extremes: securitas (careless) and superstitio
    (fearful where no fear).

fides_et_fiducia:
  english: Faith and trust
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Chytraeus's habitual coupling: fides as cognitive assent to all
    articles of Christian doctrine plus the promise; fiducia as the
    resting-in of the will in that promise for Christ's sake.

dilectio_dei:
  english: Love of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The ardent burning of love by which the mind and will, acknowledging
    God's love toward us in the Son, embraces God. Identified with
    universal obedience (Rom 13:10, Dilectio est impletio Legis).

spes:
  english: Hope
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Certain expectation of eternal life and of liberation from
    calamities in this life according to the counsel of God.

humilitas_tapeinophrosyne:
  english: Humility (ταπεινοφροσύνη)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Chytraeus's Pauline (Phil 2:3; Col 3:12) technical term for the
    virtue by which we do not exalt ourselves but subject ourselves in
    the fear of God. Extreme opposite: superbia.

patientia_christiana:
  english: Christian Patience
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Virtue by which sorrows are borne moderately and calmly, subjecting
    oneself reverently to the will of God. Parts: timor Dei and fides.

perseverantia_in_fide:
  english: Perseverance in faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Constantly and perpetually to remain in the true knowledge of God
    and faith in Christ until the extreme of life. Distinct from
    Reformed perseverantia sanctorum (which excludes possibility of
    losing faith).

idololatria_quadruplex:
  english: Idolatry (Chytraeus's fourfold definition)
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    (i) to feign that some thing is God which is not; (ii) to attribute
    honour due to God to a non-God; (iii) to bind God to something to
    which He has not bound Himself; (iv) to invent and confide in
    worships without divine command. Dii alieni = quidquid amamus et
    timemus plus quam Deum.

hypocrisis:
  english: Hypocrisy
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    Simulation of external piety with heart void of true Fear of God
    and Faith. Chytraeus's technical term for false religion beyond
    mere formal external worship.

scandalum:
  english: Scandal
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    False doctrine or bad example harming the glory of God and salvation
    of others. Fivefold enumeration in Chytraeus.

gratiarum_actio:
  english: Thanksgiving
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 15"
  note: >
    To confess with mind and voice that God is fons et unicus autor of
    all benefits — spiritual and bodily.

iusiurandum:
  english: Oath-taking
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 15"
  note: >
    Invocation of the true God as witness that we speak truth. Extremes:
    perjury and superstitious observation of impious oaths.

sanctificatio_sabbati:
  english: Sanctification of the Sabbath
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 17"
  note: >
    Not idleness or bodily labour, but attendance on the ministry of
    teaching and the divinely instituted ceremonies.

conservatio_ministerii_evangelici:
  english: Conservation of the Evangelical Ministry
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 17"
  note: >
    The virtue akin to Sabbath-sanctification: preserving and providing
    for the office of publicly preaching the Word and administering the
    Sacraments legitimately.

ceremoniae_divinae_humanae:
  english: Ceremonies (divine and human)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 18"
  note: >
    Chytraeus's careful distinction: (i) Divine — commanded by God (OT:
    circumcision, sacrifices; NT: Baptism, Lord's Supper); (ii) Human
    (Pauline traditiones humanae) — either openly against the Word, or
    Adiaphora.

adiaphora_ceremoniarum:
  english: Adiaphora (things indifferent) in ceremonies
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 18"
  note: >
    Neither commanded nor prohibited by God; free to observe or not.
    FC SD X De Adiaphoris. Some useful for good order; some ludicrous
    or superstitious. Distinguish from soteric adiaphora.

sabbatum_moraliter_ceremonialiter:
  english: The Sabbath, morally and ceremonially
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 19"
  note: >
    Morally — the conservation of public ministry; retained. Ceremonially
    — the specific rite of the seventh day; abrogated. The Lord's Day
    (first day of the week) substituted, on which Christ rose. Cf. AC
    XXVIII; Luther Large Catechism, Third Commandment.

