# Scholastic Lutherans — Master Translation Glossary
# ═══════════════════════════════════════════════════════════════════════════
# Living master glossary, all 22 works. Every work adds entries; entries are
# preserved once added. Keyed by the Latin/German lemma as the source spells it.
#
# Fields:
#   english      — chosen rendering (used consistently)
#   alt          — acceptable alternates (internal QA only, do not switch)
#   type         — musical | liturgical | theological | dogmatic |
#                  polemical | philosophical | scholastic | rhetorical |
#                  proper-name | biblical-ref
#   first_use    — work-slug where first attested, and chapter
#   note         — rationale, technical context, discipline history
#   see_also     — cross-references to related lemmas
#
# Convention: entries are grouped by broad domain, then alphabetical within
# domain. The Praetorius trilogy contributed ~250 musical entries; those live
# in the syntagma-musicum repo's own glossary/terms.yaml. This file starts
# with the seed of Lutheran-Orthodoxy theological vocabulary and grows.

# ─── DOGMATICS — the article of Justification ───────────────────────────

justificatio:
  english: Justification
  type: dogmatic
  first_use: ""
  note: >
    The articulus stantis et cadentis ecclesiae. Preserve on formal doctrinal
    occurrence; use English "justification" freely thereafter.
  see_also: [sanctificatio, fides_qua, articulus_stantis]

sanctificatio:
  english: Sanctification
  type: dogmatic
  first_use: ""

articulus_stantis_et_cadentis_ecclesiae:
  english: Article of the Standing or Falling Church
  type: dogmatic
  first_use: ""
  note: >
    Justification. Preserve Latin on formal doctrinal invocation; use English
    otherwise.

fides_quae_creditur:
  english: The faith which is believed
  alt: ["fides quae"]
  type: dogmatic
  first_use: ""
  note: >
    Objective content of faith. Contrast fides_qua_creditur (subjective act).

fides_qua_creditur:
  english: The faith by which one believes
  alt: ["fides qua"]
  type: dogmatic
  first_use: ""

fides_historica:
  english: Historical Faith
  type: dogmatic
  first_use: ""
  note: >
    Mere assent to historical facts of salvation history, without fiducia.

fiducia:
  english: Trusting Faith
  type: dogmatic
  first_use: ""

simul_iustus_et_peccator:
  english: Simul iustus et peccator
  type: dogmatic
  first_use: ""
  note: Preserve untranslated. Confessional shibboleth.

sola_scriptura:
  english: Sola Scriptura
  type: dogmatic
  first_use: ""
  note: Preserve untranslated. Confessional shibboleth.

sola_fide:
  english: Sola Fide
  type: dogmatic
  first_use: ""
  note: Preserve untranslated.

sola_gratia:
  english: Sola Gratia
  type: dogmatic
  first_use: ""
  note: Preserve untranslated.

# ─── DOGMATICS — Christology ────────────────────────────────────────────

unio_personalis:
  english: Personal Union
  type: dogmatic
  first_use: ""
  note: The Two Natures in Christ. Central to Lutheran vs. Reformed disputes.

communicatio_idiomatum:
  english: Communication of Attributes
  type: dogmatic
  first_use: ""
  note: >
    Preserve on all formal Christological occurrence. Central Lutheran term;
    three genera follow.

genus_maiestaticum:
  english: Genus Maiestaticum
  type: dogmatic
  first_use: ""
  note: >
    Communication of divine attributes to the human nature. The Lutheran
    genus that the Reformed reject.

genus_apotelesmaticum:
  english: Genus Apotelesmaticum
  type: dogmatic
  first_use: ""
  note: Common operation of both natures.

genus_tapeinoticum:
  english: Genus Tapeinoticum
  type: dogmatic
  first_use: ""
  note: >
    Reformed (Ursinus, etc.) doctrine — the communication of human
    limitations to the divine nature during the state of humiliation.
    Lutherans reject.

status_humiliationis:
  english: State of Humiliation
  type: dogmatic
  first_use: ""

status_exaltationis:
  english: State of Exaltation
  type: dogmatic
  first_use: ""

ubiquitas:
  english: Ubiquity
  type: dogmatic
  first_use: ""
  note: >
    Lutheran doctrine of Christ's body — following from the genus
    maiestaticum. Central to Reformed polemics.

finitum_capax_infiniti:
  english: The finite is capable of the infinite
  type: dogmatic
  first_use: ""
  note: >
    Lutheran principle. Preserve Latin on formal invocation. The Reformed
    counter-principle is *finitum non capax infiniti* — see below.

finitum_non_capax_infiniti:
  english: The finite is not capable of the infinite
  type: dogmatic
  first_use: ""
  note: Reformed principle; cite when Lutheran sources reject it.

extra_calvinisticum:
  english: Extra Calvinisticum
  type: polemical
  first_use: ""
  note: >
    Reformed doctrine of the Logos operating outside the flesh of Christ.
    Preserve untranslated.

# ─── DOGMATICS — Predestination ─────────────────────────────────────────

praedestinatio:
  english: Predestination
  type: dogmatic
  first_use: ""

reprobatio:
  english: Reprobation
  type: dogmatic
  first_use: ""

praescientia:
  english: Foreknowledge
  type: dogmatic
  first_use: ""

praedestinatio_ante_praevisa_merita:
  english: Predestination before foreseen merits
  type: dogmatic
  first_use: ""
  note: Reformed / Augustinian-strict; Lutherans distinguish carefully.

praedestinatio_post_praevisa_merita:
  english: Predestination after foreseen merits
  type: dogmatic
  first_use: ""
  note: >
    Formula of Concord Article XI acknowledges *praescientia* of unbelief
    but rejects merit-based predestination.

decreta_absoluta:
  english: Absolute Decrees
  type: polemical
  first_use: ""
  note: Reformed strict-supralapsarian doctrine; Lutheran polemic target.

scientia_media:
  english: Middle Knowledge
  type: dogmatic
  first_use: ""
  note: >
    Molina's doctrine of God's knowledge of counterfactuals of freedom.
    Lutheran orthodoxy variously receives or rejects.

