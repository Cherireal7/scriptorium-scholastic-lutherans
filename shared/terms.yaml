# ─── POLEMICAL VOCABULARY ───────────────────────────────────────────────

adiaphora:
  english: Adiaphora
  type: polemical
  first_use: ""
  note: Preserve untranslated. Central to 16th-c. Interim controversies.

syncretismus:
  english: Syncretism
  type: polemical
  first_use: ""
  note: >
    Central to Dannhauer's ***Mysterium syncretismi*** and to Calixtine
    polemics generally.

consensus_quinquesaecularis:
  english: Consensus of the First Five Centuries
  type: polemical
  first_use: ""
  note: >
    Calixtine irenic principle — that the first 5 c. of the Church furnish
    a sufficient doctrinal norm. Lutheran orthodoxy sharply rejects.

articuli_fundamentales:
  english: Fundamental Articles
  type: polemical
  first_use: ""
  note: >
    Calixtine distinction between fundamental and non-fundamental doctrines
    of faith.

fundamentaltheologie:
  english: Fundamental Theology
  type: polemical
  first_use: ""

# ─── SCHOLASTIC METHOD ──────────────────────────────────────────────────

reduplicative:
  english: Reduplicatively
  type: scholastic
  first_use: ""
  note: >
    Distinct from ***specificative***. Scholastic distinction on modes of
    predication.

specificative:
  english: Specificatively
  type: scholastic
  first_use: ""

analogia_entis:
  english: Analogy of Being
  type: scholastic
  first_use: ""
  note: >
    Roman Catholic scholastic doctrine; Lutheran orthodoxy variously
    engages (Gerhard, Calov) or rejects (Dannhauer).

concursus_divinus:
  english: Divine Concurrence
  type: dogmatic
  first_use: ""
  note: >
    Providence — how God concurs with created causes. Central to
    predestination and to human freedom debates.

# ─── CONFESSIONAL AND ECCLESIASTICAL VOCABULARY ─────────────────────────

concordia:
  english: Concord
  type: dogmatic
  first_use: ""
  note: >
    Both the general concept and the confessional documents. Preserve for
    ***Formula Concordiae*** and ***Book of Concord***.

formula_concordiae:
  english: Formula of Concord
  type: dogmatic
  first_use: ""
  note: Preserve Latin.

corpus_doctrinae:
  english: Corpus Doctrinae
  type: dogmatic
  first_use: ""
  note: The 16th-c. Lutheran confessional collections.

kirchenordnung:
  english: Church Ordinance
  type: dogmatic
  first_use: ""
  note: German source term; preserve when the source is German.

landeskirche:
  english: Territorial Church
  type: dogmatic
  first_use: ""

symbolum:
  english: Confession (of faith)
  alt: [Creed]
  type: dogmatic
  first_use: ""

# ─── CATECHETICAL — from Chytraeus 1594 (Ch. 1 Prolegomena) ────────────

catechesis:
  english: Catechesis
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1"
  note: >
    Oral, methodical instruction in the elements of Christian doctrine,
    with examination. From Greek κατηχέω (katēcheō), "to sound into
    the ear," "to instruct by voice." In Chytraeus preserved untranslated
    as the subject of definition throughout the volume.
  see_also: [summa_doctrinae_christianae, examen, catechumeni]

katecheo:
  english: To instruct by voice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 10"
  note: >
    κατηχέω. NT usage: Luke 1:4; Acts 18:25; Rom 2:18; 1 Cor 14:19;
    Gal 6:6. The etymon of "catechesis." "To sound down into the ear."

summa_doctrinae_christianae:
  english: The summa of Christian doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 1"
  note: >
    Technical Melanchthonian phrase — the systematic ordered epitome of
    the whole of Christian doctrine, from which loci-based method flows.
    Cf. Melanchthon Loci Communes 1521 preface (CR 21:81).
  see_also: [loci_communes, loci_praecipui, catechesis]

theologia:
  english: Theology
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 2"
  note: >
    In Chytraeus's opening definition (following Melanchthon Loci
    Praecipui 1559, CR 21:606-7): the doctrine concerning God's essence,
    will, benefits (through Christ), and the worships owed to Him —
    made manifest in Scripture and efficacious for the salvation of
    believers.

agnitio_dei:
  english: Acknowledgement / knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Not mere notitia (information) about God, but the reverent
    recognition of God as God, which issues in worship. Standard
    Lutheran-orthodox distinction; distinguished from cognitio Dei
    in the technical scholastic register (Gerhard, Loci I).
  see_also: [cognitio_et_invocatio_dei, vera_dei_agnitio]

cognitio_et_invocatio_dei:
  english: Knowledge and invocation of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 9"
  note: >
    The dual formula summarising the practical aim of theology: cognitio
    issuing in invocatio. The pattern for the Lutheran division of the
    Decalogue's First Table.
  see_also: [agnitio_dei, praxis_theologiae]

vera_dei_agnitio:
  english: The true knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 4"
  note: >
    The material subject of Locus I of Chytraeus's Catechism. In
    Lutheran-orthodox usage, distinguishes the trinitarian revealed
    God from the God-of-natural-reason.
  see_also: [agnitio_dei]

praxis_theologiae:
  english: The practice of theology
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Chytraeus identifies religio Christiana with theology-in-practice —
    cognition issuing in worship. Not theologia practica in the later
    17th-c. sense (Voetius, van Mastricht) but the immediate ordering
    of doctrine to worship.

religio_christiana:
  english: The Christian Religion
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 5"
  note: >
    Not a genus of which paganism is another species, but the only true
    worship of God, defined by Christ, the Word, faith, and the
    Sacraments. Anti-pagan and anti-natural-religion in emphasis.

religio_ethnica:
  english: Pagan religion
  type: polemical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 6"
  note: >
    The category of external-cultic religion opposed to the religio
    Christiana. Includes both classical polytheism and any humanly-
    invented ceremonial system.

authoritas_divina:
  english: Divine authority
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    In the Lutheran doctrine of Scripture, the formal cause of the
    certitude of Christian doctrine — DIXIT DOMINUS.
  see_also: [patefactio_divina, sacra_scriptura]

patefactio_divina:
  english: Divine self-revelation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Chytraeus's preferred term (over revelatio) for the divine act of
    making Himself known in the written Word. Emphasises the openness
    of what was hidden.

rationes_certitudinis:
  english: Grounds of certainty
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Chytraeus's eleven-point enumeration of the subordinate arguments
    for the certitude of Christian doctrine. Parallels Gerhard Loci
    Theologici I, De Scriptura Sacra.

miracula_divinae_omnipotentiae:
  english: Miracles of the divine omnipotence
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    Especially the resuscitationes hominum mortuorum (raisings of the
    dead), which Chytraeus (following Melanchthon and the pre-Chemnitz
    apologetic tradition) argues are proper to God alone.

conservatio_ecclesiae:
  english: Conservation of the Church
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    The standing miracle of the Church's survival against all
    persecution — one of Chytraeus's rationes certitudinis. Cf. Luther
    WA 30.2:632.

capita_doctrinae:
  english: Chief heads of doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    In catechetical usage, the duo capita are Law and Gospel;
    pedagogically expanded into the ten loci in Chytraeus's scheme.
  see_also: [loci_praecipui, lex_et_evangelium]

decalogus:
  english: The Decalogue
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Preserved in Latin as the standard catechetical designation.
    Chytraeus locates the definitions of all virtues under it.

symbolum_fidei:
  english: The Symbol of the Faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Apostles' or Nicene Creed. Preserved in Latin as the technical
    designation of the confessional formula.

locus:
  english: Locus (theological)
  alt: [loci]
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    The systematic "place" or heading under which theology is disposed.
    Preserved in Latin because (i) technical, (ii) the subject of
    division in Chytraeus's Prolegomena, and (iii) foundational to
    Melanchthonian and post-Melanchthonian Lutheran method.
  see_also: [loci_communes, loci_praecipui, sedes_doctrinae]

loci_communes:
  english: Common places (theological loci)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 3"
  note: >
    Melanchthon's Loci Communes rerum theologicarum (1521, definitive
    ed. 1559 = CR 21). Chytraeus's explicit model.

loci_praecipui:
  english: The chief loci
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 4"
  note: >
    The ten Chytraeus enumerates. Not fixed at ten in the earlier
    Melanchthonian scheme; Chytraeus's pedagogical reduction.

# ─── LUTHER'S THREE INSTRUMENTS OF THEOLOGY (WA 50:658-61, 1539) ────────

oratio_meditatio_tentatio:
  english: Prayer, meditation, temptation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Luther's three instruments of theology, from the 1539 preface to
    Vol. I of the German Wittenberg edition, drawn from Ps 119. The
    complete formula: (1) oratio ardens et quotidiana — burning and
    daily prayer; (2) meditatio — sustained attention to Scripture;
    (3) tentatio — the touchstone (lapis Lydius) by which the Word's
    true efficacy is proved. Chytraeus recommends verbatim.
  see_also: [precatio_ardens, meditatio, tentatio, textus_bibliorum]

precatio_ardens:
  english: Burning prayer
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: The first of Luther's three instruments as Chytraeus formulates it.

meditatio:
  english: Meditation (on Scripture)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    In Luther's three-instrument scheme, sustained prayerful attention
    to the text of Scripture. Not the mystical or contemplative
    meditatio of the older monastic tradition.

tentatio:
  english: Temptation, tribulation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    The third of Luther's three instruments. Called by Luther lapis
    Lydius — the touchstone which teaches the theologian by experience
    the sweetness and power of God's Word. WA 50:660.

experientia_theologica:
  english: Theological experience
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Chytraeus's own gloss on tentatio: not empirical experience but the
    experience of faith under trial. Prefigures the 17th-c. Lutheran
    distinction between theologia archetypa and theologia ectypa in
    Gerhard.

# ─── SOURCES CHYTRAEUS CITES ────────────────────────────────────────────

textus_bibliorum:
  english: The text of the Bibles
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Chytraeus's preferred term for the primary source of theology.
    Marks the humanist ad-fontes commitment already in the Melanchthon
    tradition.

lingua_hebraea:
  english: The Hebrew language
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"

lingua_graeca:
  english: The Greek language
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"

dialectica_methodus:
  english: Dialectical method
  type: scholastic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    In the Melanchthonian curriculum, not sophistical disputation but
    the methodical art of definition, division, argument, and
    refutation — a preparatory discipline for theology.

magister_sententiarum:
  english: The Master of the Sentences (Peter Lombard)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    Peter Lombard, whose Sententiae (c. 1150) remained the standard
    textbook of Latin theology into the 16th c. Chytraeus's inclusion
    of him in the theological curriculum is a humanist-Lutheran
    willingness to use Lombard as a historical source.

acta_conciliorum:
  english: Acts of the Councils
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 8"
  note: >
    The standard 16th-c. collection was Peter Crabbe, Concilia Omnia
    (Cologne, 1538 and 1551), later superseded by the Roman edition of
    Severin Binius.

# ─── PEDAGOGICAL / SCHOOL VOCABULARY ────────────────────────────────────

auditores:
  english: Auditors, hearers
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 10"
  note: The catechumens as hearers of the catechetical instruction.

catechumeni:
  english: Catechumens
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    Those under catechesis, particularly pre-baptismal in the primitive-
    church usage that Chytraeus invokes.

examen:
  english: Examination
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    Both (i) the act of examining a learner, and (ii) the specific
    reference to Chemnitz's Examen Concilii Tridentini (Frankfurt,
    1565-73) as Chytraeus's stated textbook.

confessio_fidei:
  english: Confession of faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 11"
  note: >
    In Chytraeus's argument, the confessio the every Christian must
    render is the ecclesial ground of the practice of examination.

finis_studiorum:
  english: The end (goal) of studies
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ch. 1 § 9"
  note: >
    Chytraeus distinguishes proximate ends (wisdom, expressive ability)
    from the principal end (the agnitio et celebratio Dei).

# ─── HUMANIST / TOPONYMIC ─────────────────────────────────────────────

urbs_rosarum:
  english: The City of Roses (Rostock)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Rostock. The epithet is standard in 16th-c. Rostock self-designation,
    from the three roses on the city's arms. Chytraeus dates his
    dedication "Ex Academia urbis Rosarum."

argentoratensis_academia:
  english: The Academy of Strasbourg
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Founded by Johannes Sturm 1538 as Gymnasium, raised to Academia
    (right to confer BA/MA) 1566, to full university 1621. In the
    1560s the most-praised humanist school in the Empire.

sarepta:
  english: Sarepta (as type-name for Rostock)
  type: proper-name
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Ṣarpath / Sarafand, the widow's town where Elijah lodged during
    the drought (1 Kgs 17:8-24). Chytraeus applies the type to Rostock,
    where he was preserved and taught. Standard trope among 16th-c.
    north-German reformers.

pio_et_candido_lectori:
  english: To the Pious and Candid Reader
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, prefatory address"
  note: >
    Standard 16th-c. dedicatory formula for the address-to-reader that
    complements the epistola dedicatoria to a patron. Chytraeus's
    version is dated Die Lucae 1575.

epistola_dedicatoria:
  english: Dedicatory Epistle
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    Chytraeus's is dated 7 January 1568 to Bernhard von Menzingen,
    son of his patron Peter von Menzingen. Preserved unchanged in the
    1594 revision.

paterfamilias:
  english: Head of the household
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, ep. dedicatoria"
  note: >
    In the Roman-humanist ethical vocabulary Chytraeus borrows, a
    title of civic and pious dignity — the pattern of the pious
    Christian householder, applied to the elder Menzingen.

genus_doctrinae:
  english: Kind, or genre, of doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, ch. 1 § 7"
  note: >
    In Chytraeus's argument at § 7 (IV): the very sort of teaching
    that Scripture is — making manifest what is hidden to reason — is
    itself an argument for its divinity.

# ─── CHYTRAEUS 1594 · Locus I (De Deo, De Trinitate, De Christo) ────────

symbolum_apostolicum:
  english: The Apostles' Creed
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 1"
  note: >
    In Chytraeus's pedagogical usage, the simplicissima et prima forma
    doctrinae de Deo — the priority-form for children's catechesis.
    The Nicene enters at the confessional-doctrinal level.
  see_also: [symbolum_fidei, symbolum_nicaenum]

essentia_dei:
  english: The essence of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 2"
  note: >
    Chytraeus's compact list of divine attributes: spiritualis, aeterna,
    vera, sapiens, bona, misericors, omnipotens. Anticipates the fuller
    scholastic-Lutheran treatment in Gerhard Loci II.

persona_boethiana:
  english: Person (Boethian definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 3"
  note: >
    Individua substantia intelligens, incommunicabilis, non sustentata
    in alio. Chytraeus's expansion of the Boethian definition (naturae
    rationabilis individua substantia — Boethius Contra Eutychen III,
    PL 64:1343) with the Thomist qualifiers (STh I q.29 a.1) — making
    the definition precise for Trinitarian and Christological use.
  see_also: [unio_personalis, hypostasis]

fundamentum_totius_doctrinae:
  english: Foundation of the whole theological doctrine
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 4"
  note: >
    Chytraeus's compact statement of the Lutheran Sola Scriptura:
    nothing about God's essence or will is to be thought or taught
    except as He has revealed Himself in the Word delivered through
    the Prophets and Apostles. Deut 4:2; Isa 8:20.
  see_also: [sola_scriptura, authoritas_divina]

logos_verbum:
  english: Word (Logos, Verbum)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 8"
  note: >
    Chytraeus's double aspect: (i) respectu Patris — the Son as the
    substantial Image of the Father; (ii) respectu nostri — the Son as
    the One who speaks the Gospel promise and is efficacious in His
    Word. Cf. Chemnitz De Duabus Naturis, cap. II-IV.

imago_patris_substantialis:
  english: The substantial and integral Image of the Father
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 6"
  note: >
    The Son as imago consubstantialis — distinguished from the imago
    Dei in man (an accidental created likeness, capable of loss and
    restoration).

homoousion:
  english: Of the same substance (homoousion)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 10"
  note: >
    ὁμοούσιον. The Nicene-Constantinopolitan term for the
    consubstantiality of the persons. Chytraeus applies it to the Holy
    Spirit as well as to the Son, following Athanasius Ep. ad Serapionem.

pneuma_hagion:
  english: Holy Spirit (Πνεῦμα ἅγιον)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 9"
  note: >
    Chytraeus's account of the Spirit's processio is Filioquist (Western,
    a Patre Filioque) — the settled Lutheran doctrine, articulated
    against the Reformed and confirmed at the Formula of Concord.

filioque:
  english: And from the Son
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 9"
  note: >
    The Western clause added to the Nicene-Constantinopolitan Creed on
    the Spirit's procession, formally affirmed by Lutheran orthodoxy.

incarnatio_filii_dei:
  english: Incarnation of the Son of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 12"
  note: >
    Chytraeus's definition — unio personalis duarum naturarum — is
    Chalcedonian and closely tracks Chemnitz De Duabus Naturis (Jena,
    1571/1578), cap. II. Both natures preserved without confusion,
    change, division, or separation.
  see_also: [unio_personalis, chalcedonense]

assumptio_naturae_humanae:
  english: Assumption of human nature
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 11"
  note: >
    The one-way movement of the Incarnation: the Son of God takes to
    Himself human nature — not the reverse. Central to Lutheran
    Christological polemics.

emmanuel_quatuor_causae:
  english: Emmanuel — four causes
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 13"
  note: >
    Chytraeus's four-fold explanation of the name Emmanuel (Isa 7:14,
    Matt 1:23): (1) assumption of our nature, (2) intercession and
    price of redemption, (3) indwelling by faith, (4) presence in
    perils and death.

synaphos:
  english: Joined-together (σύναφος)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 12"
  note: >
    Chytraeus's Greek Christological adjective for the Emmanuel-union —
    rare in classical usage but functional in his Christological
    register.

syngenos:
  english: Kindred (σύγγενος)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 13"
  note: >
    Applied to Christ as "flesh of our flesh, bone of our bones" in
    the assumption of our nature.

homogenes:
  english: Of the same kind (ὁμογενής)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 15"
  note: Applied to Christ as sanctifier of the assumed nature.

mediator_definitio_chytraei:
  english: Mediator (definition per Chytraeus)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 14"
  note: >
    The Person set between angered God and guilty man, who satisfies
    divine justice, sustains wrath and punishment, pleads for us,
    applies His merits, and hears our prayers. Anselmic-scholastic
    in structure, confessionally Lutheran in idiom.
  see_also: [satisfactio_vicaria, mediator]

munus_triplex_christi:
  english: The threefold office of Christ
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 16"
  note: >
    Prophet (revealing the Father through the Gospel), Priest
    (interceding and satisfying), King (governing and defending the
    Church). Common Reformation property; Chytraeus articulates it
    without naming Calvin.

praxis_pietatis:
  english: The practice of piety
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 18"
  note: >
    Chytraeus's identifier of the true Church of God: not doctrine as
    speculation but doctrine as invocation, gratitude, and obedience.
    Distinct from the later 17th-c. Pietist theologia practica.

invocatio_dei_vera:
  english: True Invocation of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 19"
  note: >
    Chytraeus's definition centres on (i) address to the true
    trinitarian God, (ii) knowledge of the promise, (iii) confidence
    of hearing on account of Christ the Mediator.

partes_invocationis:
  english: Parts of Invocation (six)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 20"
  note: >
    Chytraeus's six: compellatio, cogitatio mandatorum, poenitentia seu
    confessio, consideratio promissionis, fides, commemoratio.

paracletus:
  english: Comforter, Paraclete
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 18"
  note: >
    Johannine title of the Holy Spirit (John 14:16, 26; 15:26; 16:7).
    Preserved on formal Trinitarian occurrence.

septem_petitiones:
  english: The seven petitions of the Lord's Prayer
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus I § 20"
  note: Matt 6:9-13.

# ─── CHYTRAEUS 1594 · Locus II (De Creatione, De Providentia, De Homine) ─

creatio_ex_nihilo:
  english: Creation out of nothing
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 1"
  note: >
    Chytraeus's definition stresses (i) actio externa Dei — outward, not
    an eternal emanation from the divine essence (against Neoplatonic
    and Origenist inheritance); (ii) ex nihilo — against Aristotelian
    eternalism; (iii) ecclesiological finis — the eternal Church, not
    the world for its own sake.

opera_trinitatis_ad_extra:
  english: The outward works of the Trinity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 2"
  note: >
    In Lutheran orthodoxy, indivisa — every outward work is jointly of
    the Father, the Son, and the Holy Spirit. Preserved untranslated on
    formal doctrinal use. Cf. Augustine De Trinitate I.4.7; Aquinas STh
    I q.45 a.6.

hexaemeron:
  english: The Six-Day Work of Creation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 3"
  note: >
    The literal six days of Gen 1:1-2:3, per the standard 16th-c.
    Lutheran hexaemeral reading (Luther In Genesin, WA 42:1-91).

theatrum_naturae:
  english: The Theatre of Nature
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, locus II § 4"
  note: >
    Chytraeus's humanist metaphor for the created universe as a schola
    sapientiae Dei. Ultimately from Cicero De Natura Deorum II.98,
    mediated through Melanchthon Initia Doctrinae Physicae (1549).

providentia_generalis_specialis:
  english: Providence (general and special)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    Chytraeus's twofold definition: (i) action of the divine mind that
    sees and foresees; (ii) government by which God preserves, cares
    for the human race, punishes crimes, rewards righteousness.
  see_also: [determinatio_divina, concursus_divinus]

determinatio_divina:
  english: Divine determination
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    A part of Providence: God, seeing all events, helps the good,
    permits the evil, and to that permission sets times and limits.
    Classical distinction between God's voluntas signi and His
    permission.

permissio_divina:
  english: Divine permission
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 5"
  note: >
    God's negative-permissive relation to evil, distinguished from His
    positive will. God permits evil but sets its limits.

angeli_boni:
  english: Good Angels
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 6"
  note: >
    Spiritual essences, created to God's image (intelligent, truthful,
    just, free-willed), immortal, ordained by God to celebrate Him,
    servants of the Church and guardians of the pious.

diaboli:
  english: Devils
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 7"
  note: >
    Initially created to God's image, fell by depravitas propriae
    voluntatis (not by divine impulse — the Augustinian anti-Manichaean
    point), enemies of God, God-permitted, God-repressed, God-terminated
    at the Last Judgement. Cf. Augustine De Civitate Dei XI.9-17.

anima_immortalis:
  english: The immortal soul
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 9"
  note: >
    Chytraeus's insistence that the soul is not extinguished when it
    departs from the body — aimed against the mortalist (psychopannychist)
    tradition in the radical Reformation. Fuller treatment in Locus X.

vires_animae_quinque:
  english: The five powers of the soul
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Rational, sensitive, appetitive, locomotive, vegetative. The
    Aristotelian-Melanchthonian scheme (Aristotle De Anima II-III;
    Melanchthon De Anima 1553, CR 13:5-178). Chytraeus was Melanchthon's
    student and here reproduces the master's textbook.

mens_intellectus:
  english: Mind / Intellect
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Power of rational soul, rectrix vitae, seat of the principia et
    normae artium (axioms of the arts), including the λόγοι of number
    and order. Given chiefly ad cognoscendum Deum — for the knowledge
    of God.

voluntas_indeclinabilis:
  english: Will (not compelled)
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Pre-lapsarian will was indeclinabilis — not compelled either to good
    or to evil — but acquiescens in lege Dei. Careful pre-Formula-of-
    Concord language; not semi-Pelagian since it treats the pre-lapsarian
    condition.

affectus_cordis:
  english: Affects of the heart
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus II § 10"
  note: >
    Motions of the will or heart following cognition — species and
    forms of movement accompanied by delight or pain, by which we
    pursue or flee the object shown by mind or sense.

imago_dei_in_creatione:
  english: The Image of God in creation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    Chytraeus's threefold analysis: mind illuminated with true knowledge
    of God + will freely loving and obeying God + heart with affects
    conformable to the Law of God. Follows Melanchthon Loci Praecipui
    1559, CR 21:665-69.
  see_also: [renovatio_imaginis, imago_dei]

renovatio_imaginis:
  english: The renewal of the Image of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    Renewal of the imago Dei in Christ, per Col 3:10, Eph 4:24,
    2 Cor 3:18 — the standard Lutheran axis for renewed anthropology.

archetypus:
  english: Archetype
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 11"
  note: >
    God Himself, of whom the imago in man was the similitude and
    conformity of the principal human powers. Preserved on formal use.

liberum_arbitrium_ante_lapsum:
  english: Free choice before the Fall
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Integrity of mind and will — Adam had libertas contradictionis,
    free to obey or to fall. FC SD I §9-11, Art. II §10-12.

liberum_arbitrium_post_lapsum:
  english: Free choice after the Fall
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Retains natural competence in things of civil life (honest / base,
    useful / useless), but servile et captivum et mortuum in things
    pertaining to salvation. Luther De Servo Arbitrio (1525) doctrine
    as received into FC SD II §7, 17, 24, 60.

liberum_arbitrium_in_renatis:
  english: Free choice in the regenerate
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Careful post-Formula theology by a Formula signatory (Chytraeus,
    1577): (i) liberated by the Son — passive; (ii) helped by the Holy
    Spirit — cooperative; (iii) by their own effort and diligence in
    SANCTIFICATION (not in conversion). Explicitly allows the possibility
    of losing faith (et rursum a Deo deficere potest) — against Reformed
    perseverantia sanctorum.
  see_also: [concursus_divinus, perseverantia_sanctorum]

tenebrae_peccati:
  english: Darkness of sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Chytraeus's term for the noetic effect of the Fall — the mind is
    oppressa and cannot rightly know God's essence or will.

aversa_adversa_deo:
  english: Averse to and set against God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Chytraeus's FC-conformable description of the fallen will and heart
    (aversa et adversa Deo).

servum_arbitrium:
  english: Servile choice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Luther's De Servo Arbitrio (1525), WA 18:632-787. The fallen will
    is servile, captive, and dead in things pertaining to salvation.
    Received by Chytraeus and by FC SD II.

perseverantia_sanctorum:
  english: Perseverance of the saints
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus II § 12"
  note: >
    Reformed doctrine (five points of Dort will formalise later) that
    the regenerate cannot finally fall. Chytraeus, following the Formula
    of Concord, allows that they CAN fall — et rursum a Deo deficere
    potest.

# ─── CHYTRAEUS 1594 · Locus III Part 1 (De Lege Dei — Framework + 1st Table)

lex_dei_duplex_definitio:
  english: The Law of God (twofold definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III §§ 1-2"
  note: >
    (i) Brief: the Ten Commandments. (ii) Melanchthonian: the eternal
    and unmoved wisdom and rule of righteousness in God, discerning
    right and non-right, obliging all rational creatures. Cf.
    Melanchthon Loci Praecipui 1559, De Lege, CR 21:685-89.
  see_also: [decalogus, lex_moralis, lex_naturae]

lex_moralis:
  english: The Moral Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The part of the Mosaic Law which is eternal and immutable — the
    Decalogue itself. Distinct from Leges ceremoniales and Leges
    forenses which were abrogated with the Mosaic polity.

leges_ceremoniales:
  english: Ceremonial Laws
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The rites and cultic prescriptions of the OT, abrogated in the NT.
    Types of Christ. FC SD V, VI.

leges_forenses:
  english: Forensic Laws
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 3"
  note: >
    The judicial and civil prescriptions of the Mosaic polity,
    abrogated with the polity itself when Christ was exhibited.

lex_naturae:
  english: Law of Nature
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 5"
  note: >
    The notice of the divine Law innate by God in human nature (Rom 2:15).
    Its sum is contained in the Decalogue. Melanchthonian-humanist
    mainstream, not the strong voluntarism of some later Reformed
    writers.

leges_positivae_humanae:
  english: Positive Human Laws
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus III § 6"
  note: >
    Political laws laid down by magistrates as adminicula of the Law of
    Nature; mutable, binding only to external obedience and bodily
    penalties, only binding those to whom given.

politeia_mosis:
  english: The polity of Moses
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 8"
  note: >
    The whole Mosaic ecclesiastical-civil order, described by Chytraeus
    as hospitium et schola Christi — the domicile and school of Christ
    before His manifestation. Draws on Gal 3:24 (paedagogus in Christum).

impletio_legis_quatuor_modis:
  english: Christ's four-fold fulfilment of the Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 9"
  note: >
    (i) Perfect active obedience for our person; (ii) sufficient passive
    obedience/penalty for our disobedience; (iii) right explanation of
    the true meaning of the Law (Sermon on the Mount); (iv) new
    obedience in believers through the Holy Spirit (tertius usus legis).
    Cf. FC SD III §14-15; SD VI.
  see_also: [tertius_usus_legis, iustificatio, satisfactio_vicaria]

maledictio_legis:
  english: The malediction (curse) of the Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 10"
  note: >
    What Christ took upon Himself (Gal 3:13) and from which the
    justified are liberated. But the eternal obligation to obedience
    remains — Formula-of-Concord doctrine.

libertas_christiana:
  english: Christian Liberty
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 11"
  note: >
    NOT licence to do whatever one pleases; the liberation from sin,
    wrath, curse of the Law, Mosaic ceremonies and forensic laws, and
    external rites without divine command (outside the case of scandal).
    Cf. Luther De Libertate Christiana (1520), WA 7:49-73.

pietas_erga_deum:
  english: Piety toward God (Religion)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The common genus of all the virtues of the First Table in Chytraeus's
    eight-virtue enumeration (Wisdom, Fear, Faith, Love, Hope, Humility,
    Patience, Perseverance).

vera_notitia_dei:
  english: True knowledge of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    To rightly acknowledge God's essence and will as revealed in the
    Law and Gospel, confirmed by illustrious testimonies of miracles
    (exodus, resurrection of the dead).

caligo_mentis:
  english: Blindness of the mind
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The noetic effect of the Fall, opposite of vera notitia Dei. Cf.
    Locus II § 12 (tenebrae peccati).

timor_dei_filialis:
  english: Filial fear of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Not servile terror but reverent submission and shunning of crimes.
    Chytraeus's two extremes: securitas (careless) and superstitio
    (fearful where no fear).

fides_et_fiducia:
  english: Faith and trust
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Chytraeus's habitual coupling: fides as cognitive assent to all
    articles of Christian doctrine plus the promise; fiducia as the
    resting-in of the will in that promise for Christ's sake.

dilectio_dei:
  english: Love of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    The ardent burning of love by which the mind and will, acknowledging
    God's love toward us in the Son, embraces God. Identified with
    universal obedience (Rom 13:10, Dilectio est impletio Legis).

spes:
  english: Hope
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Certain expectation of eternal life and of liberation from
    calamities in this life according to the counsel of God.

humilitas_tapeinophrosyne:
  english: Humility (ταπεινοφροσύνη)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Chytraeus's Pauline (Phil 2:3; Col 3:12) technical term for the
    virtue by which we do not exalt ourselves but subject ourselves in
    the fear of God. Extreme opposite: superbia.

patientia_christiana:
  english: Christian Patience
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Virtue by which sorrows are borne moderately and calmly, subjecting
    oneself reverently to the will of God. Parts: timor Dei and fides.

perseverantia_in_fide:
  english: Perseverance in faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 13"
  note: >
    Constantly and perpetually to remain in the true knowledge of God
    and faith in Christ until the extreme of life. Distinct from
    Reformed perseverantia sanctorum (which excludes possibility of
    losing faith).

idololatria_quadruplex:
  english: Idolatry (Chytraeus's fourfold definition)
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    (i) to feign that some thing is God which is not; (ii) to attribute
    honour due to God to a non-God; (iii) to bind God to something to
    which He has not bound Himself; (iv) to invent and confide in
    worships without divine command. Dii alieni = quidquid amamus et
    timemus plus quam Deum.

hypocrisis:
  english: Hypocrisy
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    Simulation of external piety with heart void of true Fear of God
    and Faith. Chytraeus's technical term for false religion beyond
    mere formal external worship.

scandalum:
  english: Scandal
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 14"
  note: >
    False doctrine or bad example harming the glory of God and salvation
    of others. Fivefold enumeration in Chytraeus.

gratiarum_actio:
  english: Thanksgiving
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 15"
  note: >
    To confess with mind and voice that God is fons et unicus autor of
    all benefits — spiritual and bodily.

iusiurandum:
  english: Oath-taking
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 15"
  note: >
    Invocation of the true God as witness that we speak truth. Extremes:
    perjury and superstitious observation of impious oaths.

sanctificatio_sabbati:
  english: Sanctification of the Sabbath
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 17"
  note: >
    Not idleness or bodily labour, but attendance on the ministry of
    teaching and the divinely instituted ceremonies.

conservatio_ministerii_evangelici:
  english: Conservation of the Evangelical Ministry
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 17"
  note: >
    The virtue akin to Sabbath-sanctification: preserving and providing
    for the office of publicly preaching the Word and administering the
    Sacraments legitimately.

ceremoniae_divinae_humanae:
  english: Ceremonies (divine and human)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 18"
  note: >
    Chytraeus's careful distinction: (i) Divine — commanded by God (OT:
    circumcision, sacrifices; NT: Baptism, Lord's Supper); (ii) Human
    (Pauline traditiones humanae) — either openly against the Word, or
    Adiaphora.

adiaphora_ceremoniarum:
  english: Adiaphora (things indifferent) in ceremonies
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 18"
  note: >
    Neither commanded nor prohibited by God; free to observe or not.
    FC SD X De Adiaphoris. Some useful for good order; some ludicrous
    or superstitious. Distinguish from soteric adiaphora.

sabbatum_moraliter_ceremonialiter:
  english: The Sabbath, morally and ceremonially
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 19"
  note: >
    Morally — the conservation of public ministry; retained. Ceremonially
    — the specific rite of the seventh day; abrogated. The Lord's Day
    (first day of the week) substituted, on which Christ rose. Cf. AC
    XXVIII; Luther Large Catechism, Third Commandment.

# ─── CHYTRAEUS 1594 · Locus III Part 2 (Second Table + Uses of the Law) ─

honor_septem_partes:
  english: Honour and its seven parts
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: >
    Chytraeus's Melanchthonian expansion of classical honor (Aristotle
    EN IV.3) to include (i) acknowledgement of divine institution,
    (ii) approbation of persons, (iii) reverence, (iv) thanksgiving,
    (v) prayer, (vi) obedience, (vii) candour/equity.

philostorgia:
  english: Natural familial affection (φιλοστοργία)
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: >
    Rom 12:10. Pauline moral vocabulary. Its extreme opposite:
    ἀστοργία (astorgia, Rom 1:31 — without natural affection).

politia:
  english: Polity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: >
    Legitimate ordination of an assembly of men associated by honest
    laws, ordered to the principal finis that men may be taught
    concerning God and the eternal Church gathered. Cf. AC XVI.

magistratus:
  english: Magistrate
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: >
    The governor constituted by the ordination of God — nutritius
    Ecclesiae et scholarum — guardian of discipline and peace. Lutheran
    two-kingdoms doctrine. Cf. AC XVI, XXVIII.

iustitia_distributiva:
  english: Distributive Justice
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: >
    By geometrical proportion (Aristotle EN V.3). Distinct from
    iustitia commutativa (arithmetical proportion, V.4).

sedulitas:
  english: Diligence
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 20"
  note: Opposed to ignavia and πολυπραγμοσύνη (polypragmosynē, meddling curiosity).

dilectio_proximi:
  english: Love of Neighbour
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    The common genus of virtues in almost the whole Second Table. In
    Chytraeus's fourteen-fold enumeration: iustitia particularis,
    puniens scelera, fortitudo bellica/togata, patientia philosophica,
    mansuetudo, epieikeia, misericordia, candor, amicitia, fidelitas,
    studium concordiae, humanitas, nemesis.

iustitia_particularis:
  english: Particular Justice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Rendering to each his due, preserving equality. Opposed to iniuria,
    petulantia, nequitia. Excess: summum ius, summa iniuria.

fortitudo_togata:
  english: Civic Fortitude
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Ciceronian topos from De Officiis 1.77 (Cedant arma togae). Paired
    with fortitudo bellica (military fortitude). Constancy of soul
    persevering in an honest purpose despite despising pleasures,
    honours, threats, wealth, detractions, envy.

epieikeia:
  english: Equity (ἐπιείκεια)
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Aristotle EN V.10, 1137a31-1138a3. The equity which corrects the
    general law in particular cases where the letter would work
    injustice. Classical bridge between natural and positive law.

misericordia:
  english: Mercy
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Sorrow at another's calamity, mitigating penalties. Grounded in
    justice (toward the innocent), goodness (relaxing strict right),
    or the shared human lot.

candor:
  english: Candour
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Willing well to good people, rejoicing in their prosperities;
    bending ambiguous things to the better part.

studium_concordiae:
  english: Zeal for Concord (εἰρηνοποιία)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Peace-making — Matt 5:9 (μακάριοι οἱ εἰρηνοποιοί). Preserving
    concord by humility, moderation of anger, tolerance, pardoning.
    Opposed to φιλονεικία (philoneikia, contentiousness).

humanitas:
  english: Humanity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: Conjunction of justice with milder and sweeter virtues.

nemesis_zelus:
  english: Righteous Indignation (Nemesis, Zelus)
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, locus III § 21"
  note: >
    Indignation against turpitude, just sorrow at another's crime, and
    desire to expel and punish it.

castitas_celibalis_coniugalis:
  english: Chastity of celibate and married life
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 22"
  note: >
    Preserving cleanness of mind and body according to God's will —
    either without contamination of bodies (celibate) or reverently
    guarding matrimony (conjugal).

coniugium:
  english: Matrimony
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 22"
  note: >
    Legitimate and indissoluble conjunction of one husband and one wife,
    divinely instituted. Fines: cult of God, propagation of the Church,
    mutual chastity. Cf. AC XXIII; Luther Von Ehesachen (1530), WA
    30.3:198-246.

verecundia_pudor:
  english: Modesty, Shame (Verecundia, Pudor)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 22"
  note: >
    Fearing true infamy, divine judgement, and reproach of conscience.
    Extreme opposite: impudentia.

temperantia:
  english: Temperance
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 22"
  note: >
    Moderating appetites of food and drink. Extremes: voracitas
    (gluttony), ebrietas (drunkenness), nimia abstinentia.

iustitia_commutativa:
  english: Commutative Justice
  type: scholastic
  first_use: "chytraeus-catechismus-1594, locus III § 23"
  note: >
    In contracts, preserving arithmetical equality (Aristotle EN V.4).
    Opposed to all frauds in contracts.

beneficentia_liberalitas:
  english: Beneficence, Liberality
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 23"
  note: >
    Communicating resources not by civil but by natural or divine
    obligation. Mean between prodigality and sordidness.

hospitalitas:
  english: Hospitality
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 23"
  note: >
    Especially toward exiles for the true doctrine's sake — a live
    16th-c. concern for Lutheran refugee ministers.

autarkeia:
  english: Self-sufficiency, contentment (αὐτάρκεια)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 23"
  note: >
    1 Tim 6:6 (piety with contentment); Phil 4:11. Christian contentment
    with divine providence, distinct from Stoic-Cynic self-sufficiency
    in indifference.

veritas:
  english: Truth
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Loving sentences congruent with things as they are, constantly
    speaking and doing what is true. Opposed to all mendacia — including
    heresies, forensic calumnies, perfidy, perjury, boasting.

simplicitas:
  english: Simplicity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Perspicuous and open truth, without involvements or ambiguities.

constantia:
  english: Constancy
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: Perseverance in truth and justice; opposed to levity and inconstantia.

modestia_gravitas:
  english: Modesty and Gravity
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Opposed to arrogantia (in speech), iactantia (boasting), ambitio,
    and scurrility.

appetitio_verae_gloriae:
  english: Right Appetite of Glory
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Approving one's work according to the norm of divine will, seeking
    approbation of God, of one's conscience rightly judging, and of
    good men.

docilitas:
  english: Docility (teachableness)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Opposed to pertinacity and Academic ματαιότης (mataiotēs, vanity;
    2 Tim 3:7).

urbanitas:
  english: Urbanity
  type: rhetorical
  first_use: "chytraeus-catechismus-1594, locus III § 24"
  note: >
    Ornament of truth: seasonable and honest jocose speech that
    admonishes, gentles, or seasonably provokes. Opposed to scurrility.

concupiscentia_originalis:
  english: Concupiscence (original)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 25"
  note: >
    ἐπιθυμία of Rom 7:7; the sin fighting with the Ninth and Tenth
    Precepts. Not merely an act but the corruption of all the powers
    of man. FC SD I §5-17.

usus_legis_sex:
  english: The six uses of the Law
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 26"
  note: >
    Chytraeus's enumeration: (i-ii) cognitive (that God is; what God is
    like), (iii) anthropological (finis creationis), (iv) paedagogicus
    (accusing and condemning), (v) didacticus / tertius usus (rule of
    good works in the regenerate), (vi) politicus (civil discipline of
    the non-regenerate). Subsumes the standard threefold Lutheran
    scheme.
  see_also: [usus_paedagogicus, usus_politicus, usus_didacticus, tertius_usus_legis]

disciplina:
  english: Discipline
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 27"
  note: >
    Governing external morals to be congruent with the Law of God or
    right reason; repressing vicious affects; shunning external crimes.
    Demanded even of the non-regenerate.

tria_hostia_hominis:
  english: The three enemies of man (world, flesh, devil)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 27"
  note: >
    Chytraeus's three impediments to discipline: (i) natural infirmity,
    (ii) external allurements, (iii) diabolical impulsion. Classical
    world-flesh-devil scheme. Cf. 1 John 2:15-17; Eph 6:12.

promissiones_legales:
  english: Legal Promises
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 28"
  note: >
    Have annexed the condition of perfect obedience — as the cause and
    merit on account of which promised things are exhibited. Cf. Lev
    18:5.

promissiones_evangelii:
  english: Gospel Promises
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 28"
  note: >
    Promise remission of sins, imputation of righteousness, Holy Spirit,
    eternal life to all who believe GRATIS, on account of Christ,
    without any condition or exception. Cf. Rom 4:16; 2 Cor 1:20.
  see_also: [iustificatio, sola_fide, sola_gratia]

panis_quotidianus:
  english: Daily bread (bodily promises)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 28"
  note: >
    Bodily goods promised for six causes: acknowledgement of God as
    giver, conservation of the Church, exercise of invocation,
    admonition to spiritual goods, expression of gratitude, adminicula
    of vocation.

causae_crucis:
  english: The causes of the Cross
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus III § 28"
  note: >
    The twelve causes to be enumerated in Locus IX De Ecclesia: why God
    wills the affliction of the pious. Compare Luther WA 40.3:518-20.

# ─── CHYTRAEUS 1594 · Loci IV-X + Appendix ─────────────────────────────

peccatum_chytraeus:
  english: Sin (Chytraeus's definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 1"
  note: >
    Whatever is repugnant to the Law of God, which is the eternal and
    unmoved norm of goodness. 1 John 3:4 (ἀνομία as ἀσυμφωνία).

peccatum_originis:
  english: Original sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 3"
  note: >
    Defect or inclination born with us, drawing wrath and eternal
    penalties. FC SD I; AC II.

peccatum_actuale:
  english: Actual sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 3"
  note: Inner or outer action repugnant to God's Law.

peccatum_veniale:
  english: Venial sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 4"

peccatum_mortale:
  english: Mortal sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 4"

peccatum_in_spiritum_sanctum:
  english: Sin against the Holy Spirit
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 5"
  note: >
    Two-fold: attacking known truth Pharisaically, or despair. Six
    species: presumption, despair, impugning known truth, envy of
    brother's grace, hardening, despising offered repentance.

peccata_clamantia_in_coelum:
  english: Sins crying to heaven
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 4"
  note: >
    Voluntary homicide, sodomy, oppression of the poor/widows, withheld
    hire of labourer.

novem_modi_communicationis:
  english: Nine ways of sharing another's sin
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IV § 4"
  note: >
    Schoolmen's mnemonic verse "Inquinat alterius vitiis se qui male
    sanus…"

evangelium_chytraeus:
  english: The Gospel (Chytraeus's definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 1"
  note: >
    Promissio de Christo: doctrine not naturally known, drawn from the
    arcane counsel of the Divinity through the Son. Freely promises
    remission of sins, righteousness, Holy Spirit, eternal life on
    account of Christ.

discrimen_legis_evangelii:
  english: Distinction of Law and Gospel
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 3"
  note: >
    The articulus discretionis of Lutheran theology per Luther: "the
    best theologian is he who accurately distinguishes them." Cf.
    Luther WA 36:9-42, WA 40.1:207.

novum_testamentum:
  english: New Testament
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 3"
  note: >
    Plainly the same as the Gospel — promise of remission on account
    of Christ.

vetus_testamentum:
  english: Old Testament
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 3"
  note: >
    Properly, the promulgation of the Mosaic Law and the promise of
    Canaan.

spiritus_litera:
  english: Spirit vs. Letter (2 Cor 3)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 3"

iustitia_christiana:
  english: Christian righteousness
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 5"
  note: >
    Remission of sins + imputation of Christ's righteousness +
    acceptation to eternal life, freely, on account of Christ alone
    apprehended by faith.

fides_iustificans:
  english: Justifying faith
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 5"
  note: >
    Notice + assent to the whole doctrine + fiducia in Christ the
    Mediator resting in the promise.

sola_fide_correlative:
  english: Sola fide (correlative sense)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 6"
  note: >
    Not that faith is alone without works, but that we are justified
    on account of Christ alone apprehended by faith alone. Excludes
    works as CAUSE, not as effect or accompaniment.

particulae_exclusivae:
  english: Exclusive particles
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 6"
  note: "GRATIS, sine Lege, sine operibus Legis, sola fide."

regeneratio:
  english: Regeneration
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 9"
  note: >
    Action of the Holy Spirit through the Word and Baptism; from son
    of wrath to son of God.

renovatio_naturae:
  english: Renovation of nature
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus V § 9"
  note: >
    Action of the Holy Spirit dwelling in the justified, expurgating
    the old man and restoring the imago Dei.

nova_obedientia:
  english: New obedience
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VI § 1"
  note: >
    With true knowledge of Christ and faith going before, shunning
    delicts and obeying God in affects, to the end that God be
    honoured.

cultus_dei:
  english: Worship of God
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VI § 1"

sacrificium_laudis:
  english: Sacrifice of praise (eucharistic)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VI § 2"
  note: >
    Not a price for sin, but testification of God's divinity and
    thanksgiving.

iustitia_inhaerens:
  english: Inherent righteousness
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VI § 1"
  note: >
    Medieval scholastic term Chytraeus lists among synonyms for new
    obedience. Subordinated to primary iustitia imputata of
    justification.

poenitentia_chytraeus:
  english: Repentance (Chytraeus's three-part definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 1"
  note: >
    Contritio + Fides + Nova Obedientia. Against Roman two-part
    (contrition + satisfaction) and Anabaptist reduction to nova vita
    alone. Cf. AC XII; Apologia XII §28-29; FC SD V §7-14.

contritio_iudae_petri:
  english: Contrition of Judas vs. of Peter
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 5"
  note: >
    Servile terror without faith vs. filial fear conjoined with faith
    embracing Christ's promise.

confessio_species:
  english: Confession, kinds of (public, private, general)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 6"

absolutio:
  english: Absolution
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 7"
  note: >
    Announcement of remission by the minister in Christ's name to
    the sinner acting repentance.

excommunicatio:
  english: Excommunication
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 7"
  note: 1 Cor 5:5; Matt 18; 1 Tim 1.

claves_regni_coelorum:
  english: Keys of the kingdom of heavens
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 7"

octo_causae_absolutionis_privatae:
  english: Eight causes for retaining private Absolution
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VII § 8"
  note: >
    Chytraeus's Lutheran-orthodox catalogue against both Anabaptist
    rejection and Roman confessional-satisfaction distortion.

purgatorium_rejectio:
  english: Purgatory (Chytraeus's rejection)
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus VII § 8"
  note: >
    "Plane ethnicum et blasphemum contra filium Dei" — partly out of
    Plato's Gorgias, partly out of ghost-appearances, confirmed by
    superstition and profit.

indulgentiae_papales:
  english: Papal Indulgences (nundinae)
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus VII § 8"
  note: "Nothing else than the fowlings of Roman avarice."

sacramentum_chytraeus:
  english: Sacrament (Chytraeus's definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 1"
  note: >
    Actio sacra, a Deo instituta, constans verbo et administratione
    elementi integra, et addita promissioni quae est Evangelii propria.
    Three-fold Lutheran criterion: Word + element + promise.

duo_sacramenta:
  english: Two Sacraments of the New Testament
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 1"
  note: >
    Baptism + Lord's Supper. Lutheran position against the Roman seven.

baptismus_chytraeus:
  english: Baptism (Chytraeus's definition)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 2"
  note: >
    Immersion + Trinitarian formula. Infants are baptised because to
    them belongs the promise (Matt 19; John 3:5).

coena_domini:
  english: Lord's Supper
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 3"
  note: >
    Verum corpus et verus sanguis Domini sub pane et vino — the
    praesentia realis and manducatio oralis doctrine. Against Zwinglian
    symbolism and Calvinist manducatio spiritualis. FC SD VII.

sex_fines_coenae:
  english: Six ends of the Lord's Supper
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 3"
  note: >
    Confirmation of faith, adoption/union with Christ, thanksgiving,
    symbol of confession, nerve of public ministry, admonition to
    mutual love.

sex_abusus_papistarum:
  english: Six papal abuses of the Lord's Supper
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus VIII § 4"
  note: >
    Mutilation (cup withheld), ex opere operato, adoration/procession,
    Mass-as-sacrifice, transfer to the dead, Mass as application of
    Christ's sacrifice.

ex_opere_operato:
  english: By the work performed
  type: polemical
  first_use: "chytraeus-catechismus-1594, locus VIII § 4"
  note: >
    Roman-scholastic doctrine that sacraments confer grace by mere
    performance if no obstacle placed — rejected.

sacrificium_propitiatorium:
  english: Propitiatory sacrifice
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 5"
  note: Unique to Christ; distinct from eucharistic sacrifice.

summus_sacerdos:
  english: High Priest (Christ)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus VIII § 5"
  note: >
    Immediately called by God and anointed, offering Himself as the
    one sufficient propitiatory sacrifice.

ecclesia_invisibilis_visibilis:
  english: Church, invisible and visible
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 1"
  note: >
    Invisible: all pious of all times who truly believe. Visible:
    assembly embracing Gospel and rightly using Sacraments, with
    hypocrites externally mingled.

viva_mortua_membra:
  english: Living vs. dead members of the Church
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 1"

praedestinatio_lutheran:
  english: Predestination (Lutheran)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 2"
  note: >
    Eternal decree, gratuitous, IN CHRISTO, of persevering believers.
    Not the Reformed supralapsarian absolute decrees. FC SD XI.

tres_notae_ecclesiae:
  english: Three marks of the Church
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 3"
  note: >
    (i) pure Gospel doctrine on Christ, (ii) legitimate use of
    Sacraments, (iii) due obedience to the ministry.

ministerium_evangelii:
  english: Ministry of the Gospel
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 4"

ordinatio_ministrorum:
  english: Ordination of Ministers
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 4"

regnum_christi:
  english: Kingdom of Christ
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 6"
  note: >
    Christ's government from the right hand of the Father, gathering
    the Church by the Gospel, governing by Word and Spirit alone.

regnum_mundanum:
  english: Worldly kingdom
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 6"
  note: Distinct from Regnum Christi in six ways.

quatuor_causae_impulsivae_crucis:
  english: Four impulsive causes of the Church's cross
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 7"

decem_causae_finales_calamitatum:
  english: Ten final causes of the Church's calamities
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 8"

duodecim_consolationes_christianae:
  english: Twelve fountains of Christian Consolation
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus IX § 9"
  note: >
    Six shared with philosophy; six proper to the Gospel. Reflects the
    humanist-Lutheran integration of the classical consolatio tradition
    (Cicero Tusc. Disp. III-V; Seneca Consolationes) with specifically
    Christological consolation of the Cross.

mors_corporis_animae:
  english: Death of body vs. spiritual death of soul
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 1"

status_animarum_post_mortem:
  english: State of souls after death
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 2"
  note: >
    Souls of the pious do not perish nor sleep, but consciously enjoy
    God's sight until reunited with bodies at the resurrection. Against
    psychopannychism. Wis 3:1.

resurrectio_mortuorum:
  english: Resurrection of the dead
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 3"
  note: "Sedes doctrinae: 1 Cor 15."

extremum_iudicium:
  english: The Last Judgement
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 4"
  note: Christ leads all the raised before His tribunal (Matt 25:31ff).

mors_aeterna_secunda:
  english: Eternal death, second death
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 5"

vita_aeterna:
  english: Eternal life
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, locus X § 6"
  note: >
    The sight of God: the raised and utterly-liberated Church shall
    behold face-to-face the essence and will of the whole Trinity, and
    shall be filled by God who shall be all in all.

sex_loci_orationis_dominicae:
  english: Six loci for considering the Lord's Prayer
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, appendix"
  note: >
    (1) Who the true God addressed is (trinitarian), (2) Christ's
    mandate, (3) repentance, (4) God's most ample promise, (5) faith
    adding Amen, (6) things to be sought.

regula_vitae_melanchthonis:
  english: Rule of Life (Melanchthon's poem)
  type: dogmatic
  first_use: "chytraeus-catechismus-1594, appendix"
  note: >
    Melanchthon's gnomic Latin poem appended to the 1588 edition:
    nothing succeeds without God's counsel; even fated things yield
    to God when we pray.

# ═══════════════════════════════════════════════════════════════════════════
# CHYTRAEUS 1594 — WORK COMPLETE (all 10 Loci + Ch. 1 Prolegomena + closing
# Explicatio Precationis Dominicae). Second Scholastic Lutherans work done,
# after Praetorius trilogy. Every completed work appends its own new
# entries here.
# ═══════════════════════════════════════════════════════════════════════════


# ─── POLEMICS — Flacius, Catalogus Testium Veritatis (1556) ─────────────
#
# Kick-off + Paratexts (Tranche 1a) complete. Entries below this heading
# recur tranche by tranche; original ten seed entries retained, first_use
# fixed against sighted paratexts, and eight new lemmas added from title
# page + Epistola Nuncupatoria + Praefatio.

reclamare:
  english: To cry out against, to protest against
  type: polemical
  first_use: "flacius-catalogus-testium-1556, title page"
  note: >
    The verb of the title (reclamarunt Papae). Legal-forensic register:
    the witnesses "raised their voice against" the papal claim. Preserve
    on first occurrence; render as "spoke against," "protested," or
    "raised their voice against" as context requires.

testis_veritatis:
  english: Witness to the Truth
  alt: ["testes veritatis"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, title page"
  note: >
    The category-term of the work. Plural testes veritatis is the
    collective designation for Flacius's roll of pre-Reformation
    dissenting voices. Not "martyrs" (testes for whom no death is
    claimed), but witnesses in the juridical sense: those who testify.
  see_also: [reclamare, catalogus]

catalogus:
  english: Catalogue
  type: polemical
  first_use: "flacius-catalogus-testium-1556, title page"
  note: >
    In humanist Latin, a catalogue is not merely a list but an ordered
    enumeration with authority. Preserve "Catalogus" in title-and-Latin
    reference; use "Catalogue" freely in English body.

papatus:
  english: The Papacy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    The papal system-as-institution, distinct from any given pope. In
    Flacian polemic, papatus is what the witnesses spoke against;
    individual papae are its holders. Preserve the distinction.
  see_also: [primatus, hierarchia, antichristus]

primatus:
  english: Primacy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    Papal claim to primacy over the whole Church. The single doctrine
    most consistently protested by the witnesses (from Gregory the
    Great's rejection of universalis episcopus onward).
  see_also: [papatus, universalis_episcopus]

universalis_episcopus:
  english: Universal Bishop
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregory the Great entry (Tranche 2)"
  note: >
    Title Gregory the Great famously refused (Ep. V.44 to John the
    Faster of Constantinople). Flacius's paradigm witness against
    Roman claims: the papal see itself once condemned what it later
    claimed. Preserve Latin on first invocation.
  see_also: [primatus]

hierarchia:
  english: Hierarchy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    The ordered rank of ecclesiastical offices. In Roman-Catholic
    polemical usage, positive; in Flacian usage, the descriptor for
    the graded papal chain-of-command against which the witnesses
    testified.

antichristus:
  english: Antichrist
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    Standard Lutheran identification of the papal office (Smalcald
    Articles II.iv). For Flacius, the theological verdict on papatus
    as an institution — not on this or that individual pope. Preserve
    on formal doctrinal use; use "Antichrist" freely thereafter.
  see_also: [papatus]

traditio:
  english: Tradition
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    Ambivalent term: apostolic traditio is preserved; humanae
    traditiones (the merely-papal accretions) are what the witnesses
    contested. Flacius trades on the distinction — flag context on
    each occurrence.

schisma:
  english: Schism
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio"
  note: >
    In papal polemic, the charge levelled against the witnesses; in
    Flacian counter-polemic, the true schism is Rome's departure from
    the ancient Church. The word carries the whole argument.

# ─── added from Tranche 1a paratexts ────────────────────────────────────

romani_baalis:
  english: Roman Baal
  alt: ["Romanus Baal", "Baal Romanus"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — programmatic thesis at avl0007"
  note: >
    Flacius's metonymic identifier for the Papacy, drawing on the
    title-page epigraph (1 Kings 19:18 / Rom 11:4 — the 7,000 who
    did not bow to Baal). Recurs at the Praefatio close as the
    constitutive figure of the whole book. Preserve untranslated
    on first invocation; render "the Roman Baal" thereafter.
  see_also: [septem_millia, sanctus_helias]

septem_millia:
  english: The seven thousand
  alt: ["septem piorum millia"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, title-page epigraph"
  note: >
    The Elijah-remnant of 1 Kings 19:18, cited by Paul at Rom 11:4;
    Flacius reads his own 443-name catalogue as the historical
    embodiment of the remnant across the papal centuries. The
    constitutive metaphor of the whole work.
  see_also: [romani_baalis, sanctus_helias, testis_veritatis]

sanctus_helias:
  english: The holy Elijah
  alt: ["sanctus Helias"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio — opening at avl0016"
  note: >
    The paradigmatic figure of the pious minority under a state-
    sponsored idolatric regime (Ahab / Jezebel). Flacius's Praefatio
    unfolds on the Elijah typology: the sanctus Helias thinking
    true religion is lost, God revealing the hidden 7,000.
  see_also: [septem_millia, romani_baalis]

cribratio:
  english: Sifting
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio at avl0017"
  note: >
    Luke 22:31 — Christ's word for Satanic tribulation-testing
    (Simon, Satanas expetivit vos ut cribraret sicut triticum).
    Flacius applies it to the state of the true Church under
    papal ascendancy.

anathema_maranatha:
  english: Anathema maranatha
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio at avl0021"
  note: >
    1 Corinthians 16:22 — Paul's curse-formula. Flacius applies it
    to "those who preach another gospel" (i.e., the papal system).
    Preserve untranslated as a scriptural quotation.

desolationum_abominationes:
  english: Desolation-abominations
  alt: ["abominatio desolationis"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, praefatio at avl0024"
  note: >
    Plural intensification of Dan 9:27 / Matt 24:15 (τὸ βδέλυγμα
    τῆς ἐρημώσεως). Flacius applies it to the papal regime as
    apocalyptic sign.

interim:
  english: The Interim
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — historical horizon at avl0014"
  note: >
    The Augsburg Interim of 1548, imposed after the Ernestine
    defeat at Mühlberg (1547). The historical horizon the Epistola
    Nuncupatoria assumes; Flacius's own theological career, based
    in Magdeburg through the crisis, is defined by resistance
    to it. Preserve the Latinism.

piae_memoriae:
  english: Of pious memory
  alt: ["beatae memoriae"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria at avl0007 — of Luther, Doctor Martinus piae memoriae"
  note: >
    Standard humanist honorific for a recently-deceased authoritative
    teacher. Preserve on the Latin phrase's first invocation; render
    freely thereafter.

# ─── added from Tranche 1b dedication middle ────────────────────────────

glossa_sacrarum_literarum:
  english: Gloss on the sacred letters
  alt: ["Glossa Ordinaria", "Glossa"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0008"
  note: >
    The standard medieval marginal-and-interlinear Bible gloss
    (attributed to the school of Anselm of Laon †1117). Flacius's
    proposal to the Ernestine dukes is for a Lutheran replacement in
    the same layout-format; partially realised in his own Clavis
    Scripturae Sacrae (1567) and Glossa Compendiaria (1570).
    Preserve "Glossa" untranslated on first mention.

ecclesiastica_historia:
  english: Ecclesiastical History
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0008/0010"
  note: >
    Flacius's 1556 proposal for a century-by-century history of the
    Church from Christ's nativity to the Reformation — the intellectual
    programme that becomes the Magdeburg Centuries (13 vols folio,
    Basel: Oporinus, 1559–74). The 1556 dedication is the earliest
    surviving statement of the Centuries project.
  see_also: [glossa_sacrarum_literarum, catalogus]

philanthropia:
  english: Love-of-man
  alt: ["φιλανθρωπία"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0010"
  note: >
    Divine love-of-man; Titus 3:4 (χρηστότης καὶ φιλανθρωπία τοῦ
    σωτῆρος ἡμῶν θεοῦ). Chrysostom, Gregory Nazianzus, Cyril of
    Alexandria develop it as a title of the incarnate Word. Flacius
    preserves the Greek to invoke the patristic weight.

restauratio_ecclesiae:
  english: Restoration of the Church
  alt: ["restauratio ad puritatem primitivae Ecclesiae"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0010"
  note: >
    The Reformation historiographical topos of the Church's restoration
    to its primitive purity. Common in Luther, Melanchthon, Bullinger,
    Calvin from 1520 onward; Flacius reads the whole ecclesiastical past
    as an oscillation between deformation and restauratio, of which the
    Reformation is the most complete instance.

postilla:
  english: Postil
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0008"
  note: >
    Running commentary keyed to the lectionary or biblical text, from
    post illa verba textus. Luther's Kirchenpostille (WA 17.2 & 21) and
    Melanchthon's postils are Flacius's implicit reference.

theologia_humana:
  english: Human Theology
  alt: ["theologia scholastica"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, epistola nuncupatoria — middle at avl0008"
  note: >
    Flacius's contrast-term for the medieval scholastic apparatus of
    gloss-upon-gloss (Aquinas, Scotus, Ockham) that in his reading
    diverts readers from Scriptura sacra to the scriptiones hominum.
    The critique targets not only the medievals but also, by 1556,
    the growing bulk of Reformation-era commentary.

# ─── Tranche 2 body — Sanctus Petrus (vl0001–vl0007) ────────────────────

triplex_corona:
  english: Triple Crown (papal tiara)
  alt: ["tiara"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0003"
  note: >
    The papal tiara, three crowns stacked, symbolising the pope's
    threefold sovereignty (Church militant / spiritual / temporal);
    introduced under Boniface VIII (†1303), abolished by Paul VI in
    1964. Flacius's symbol of curial arrogance.

duo_gladii:
  english: The two swords
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0005"
  note: >
    Luke 22:38 (Ecce duo gladii hic), famously interpreted by
    Boniface VIII in Unam Sanctam (1302, DH 870–875) as authorising
    papal supremacy over both spiritual and temporal power. Flacius
    inverts the interpretation: Peter's misapplication of the sword
    prefigures papal misapplication of both swords.

ipsissimus_satanas:
  english: Very Satan himself
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0004"
  note: >
    Flacian intensification (superlative -issimus) of Christ's word
    to Peter at Matt 16:23 (Vade post me Satana). Preserve untranslated
    on formal doctrinal use.
  see_also: [antichristus]

primatus_Petri:
  english: The Petrine primacy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0004"
  note: >
    The papal claim that Peter received supremacy over the whole
    Apostolic college and that this supremacy passes to the Roman
    bishops. Flacius denies both claims via Gal 2:11–14 (Paul's
    Antioch rebuke) and Matt 20:25–28 (Christ's Non ita erit).
  see_also: [primatus, universalis_episcopus]

pseudoapostolus:
  english: Pseudo-apostle
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0006"
  note: >
    The Judaising missionaries at Antioch and in Galatia (Gal 1:6–9,
    2:4, 6:12–13) who invoked Peter's and James's authority against
    Paul's Gospel. Flacius reads them as the New Testament type of
    the papist appeal to Peter against the Reformation.

choragus:
  english: Chorus-master
  alt: ["praecentor", "praesultor"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — St Peter entry at vl0001"
  note: >
    Three musical/liturgical terms Flacius stacks (choragus, praecentor,
    praesultor = chorus-master, precentor, lead-dancer) to mock the
    papal styling of Peter as coryphaeus of the Apostolic college.

# ─── Tranche 2 body — Sacrae literae (vl0007–vl0011) ────────────────────

vicarius_Christi:
  english: Vicar of Christ
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0008"
  note: >
    The papal titulature Flacius reads as fulfilling Christ's warning
    that Antichrist will come "in Christ's name" (Matt 24:5). The
    title is medieval (developed under Innocent III, 1198–1216); the
    earlier papal titulature was Vicarius Petri. Preserve untranslated
    on first invocation.
  see_also: [antichristus, homo_peccati]

plenitudo_potestatis:
  english: Fullness of power
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0008"
  note: >
    The doctrine that the pope can dispensare contra Apostolum et
    Evangelistam — systematised in the medieval canonists (Gratian,
    Innocent IV, Hostiensis) and reaching extreme form in Boniface
    VIII's Unam Sanctam (1302, DH 870–875). For Flacius, the practical
    evidence of Antichrist's usurpation.
  see_also: [duo_gladii, primatus]

homo_peccati:
  english: Man of Sin
  alt: ["ho anthropos tēs anomias"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0007"
  note: >
    2 Thess 2:3 — Paul's designation of the eschatological Antichrist
    who sits in the temple of God. The single most-cited Reformation
    proof-text for the papal-Antichrist identification (Smalcald
    Articles II.iv, BSELK 462); Flacius's Sacrae literae builds the
    identification from this text plus Matt 24, 2 Pet 2, Dan 11,
    1 Tim 4, Apoc 13.
  see_also: [antichristus, quod_detinet]

quod_detinet:
  english: That which restrains
  alt: ["ὁ κατέχων"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0008"
  note: >
    2 Thess 2:6–8. Tertullian, Ambrose, and Jerome interpreted the
    restraining power as the Roman empire, whose fall in the West
    (5th c.) would release Antichrist. Flacius takes over this
    patristic exegesis and reads the timing precisely: as the western
    empire collapses (Odoacer 476), the papal claim rises (Leo I †461,
    Gelasius I †496 duo sunt doctrine).

latinus_sexcenti_sexagintasex:
  english: LATINVS = 666
  alt: ["numerus bestiae"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0010"
  note: >
    Irenaeus, Adversus Haereses V.30.3 (PG 7:1207 = SC 153:378–380)
    offers Λατεῖνος as one of three names whose Greek numerical value
    yields 666 (Λ=30, α=1, τ=300, ε=5, ι=10, ν=50, ο=70, ς=200; sum
    = 666). Irenaeus proposes it as speculative; Flacius reads it as
    a firm anti-papal identification. Rhetorically effective though
    patristically over-reading.

sesquipedalia_verba:
  english: Sesquipedalian words
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0009"
  note: >
    Horace, Ars Poetica 97 — "foot-and-a-half long words." Flacius
    applies the Horatian coinage to curial-Latinate pomposity,
    joining it to 2 Pet 2:18 (superba enim vanitatis loquentes).

depositio_principum:
  english: Deposition of Princes
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sacrae literae at vl0009"
  note: >
    The papal claim to depose monarchs and to release subjects from
    oaths of fidelity. Formally exercised by Gregory VII against
    Henry IV (1076), Innocent III against John of England (1213),
    Paul III against Henry VIII (1538 bull Ejus qui immobilis).

# ─── Tranche 2 body — Canones through Hegesippus (vl0011–vl0018) ────────

canones_apostolorum:
  english: Apostolic Canons
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Canones Apostolorum at vl0011"
  note: >
    85 canons forming Book VIII.47 of the Apostolic Constitutions
    (Antioch c. 375–380). Received in East from Trullan Synod 692;
    in West partially through Dionysius Exiguus. Flacius invokes
    canons 5, 51 (against enforced celibacy) and 34–35 (regional
    governance, no Roman appellate mention).

quinisextum:
  english: Sixth Synod (Quinisext / In Trullo)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Canones Apostolorum at vl0012"
  note: >
    Council of Constantinople 692 (Trullan II), whose Canon 13
    explicitly permits married priests to continue conjugal
    relations. Rejected by Rome precisely on that ground.

romanistarum_commentum:
  english: A Romanist contrivance
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Canones Apostolorum at vl0012"
  note: >
    Flacian polemical formula reducing papal doctrines to commenta
    (fictions/fabrications). Method inherited from Valla's De falso
    credita et ementita Constantini donatione (1440) — exposing
    papal-Antichristian commenta through source-critical historical
    argument.

ecclesia_graeca:
  english: The Greek Church
  alt: ["Graeca Ecclesia et coniunctae"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Graeca Ecclesia at vl0013"
  note: >
    Flacius's collective for the non-Latin Christian world: Greek +
    Asian + Macedonian + Moesian + Wallachian + Ruthenian + Muscovite
    + African (incl. Coptic-Ethiopian). Never conceded papal primacy,
    purgatory, private masses, indulgences, single-species communion,
    enforced celibacy, or image-adoration. Flacius closes with the
    honest caveat that not all doctrines listed hold in the present.

pseudo_clementina:
  english: The Pseudo-Clementines
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Papa at vl0014"
  note: >
    The pseudo-Clementine corpus (Recognitiones + Homiliae, Syria
    c. 220–230) attributed to Pope Clement I. The Epistula ad
    Iacobum was incorporated into Pseudo-Isidorian False Decretals
    (mid-9th c., PL 130). Flacius demolishes it in 1556 by the
    chronological argument (James †62 predeceased Peter †64-67 by
    seven-plus years, so Clement cannot have written to a dead James
    narrating Peter's death — nisi in purgatorium miserit).

falsae_decretales:
  english: The False Decretals
  alt: ["Pseudo-Isidorian Decretals"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Papa at vl0015"
  note: >
    Mid-9th-c. forged papal letters attributed to Anacletus, Clement,
    Evaristus, Alexander I + ~90 other early popes, constructed to
    buttress papal primacy. Exposed by Magdeburg Centuriators (Vol I
    1559) and definitively by David Blondel 1628. Flacius here names
    the corpus as fabrication three years before the Centuries'
    systematic demolition.

akatastasia:
  english: Instability, disorder
  alt: ["ἀκαταστασία"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Papa at vl0016"
  note: >
    Biblical Greek term (Jas 3:16, 1 Cor 14:33, Luke 21:9); Flacius
    uses it to characterise Roman polemical argument as fundamentally
    disordered against the truth-of-Scripture. Preserve the Greek.

michael_diaconus_aethiops:
  english: Michael the Ethiopian Deacon
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Graeca Ecclesia at vl0013 (implied via Coniunctae Africana)"
  note: >
    Ethiopian priest who visited Wittenberg in 1534; Luther authenticated
    his Confessio fidei in a foreword to the 1534 Bekenntnis, establishing
    the Lutheran-Ethiopian precedent by which the Ge'ez church could be
    counted among the testes veritatis (see endnote 92 in the review file).

# ─── Tranche 2d — Polycarpus + Polycrates + Irenaeus (vl0018–vl0022) ────

quartodecimana:
  english: Quartodeciman controversy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Polycarpus at vl0018 + Polycrates at vl0019 + Irenaeus at vl0020"
  note: >
    The 2nd-c. controversy over the date of Pascha: Asian churches
    (Polycarp, Polycrates, Melito) kept 14 Nisan regardless of day
    of week; Rome (Anicetus, Soter, Victor) kept the following
    Sunday. Victor I's excommunication of the Asians c. 190 provoked
    Irenaeus's rebuke. For Flacius, textbook proof that early Roman
    jurisdictional claims were resisted by other bishops as equals.

liber_ecclesiasticae_historiae:
  english: Ecclesiastical History (Eusebius)
  alt: ["Historia Ecclesiastica"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Polycarpus at vl0018 (Irenaean letter to Victor at HE V.24.16-17)"
  note: >
    Eusebius of Caesarea's Historia Ecclesiastica (c. 313, revised
    to 325). Flacius's principal source for sub-apostolic and
    ante-Nicene witnesses; cited by name at Polycarpus, Polycrates,
    Dionysius, Hegesippus, Irenaeus entries. Rufinus's Latin trans.
    (early 5th c.) is the standard medieval-and-Reformation text.

historia_tripartita:
  english: Tripartite History
  alt: ["Historia Tripartita Cassiodori"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Irenaeus at vl0020 (source-triangulation with Eusebius + Socrates)"
  note: >
    Cassiodorus's 6th-c. compilation from Socrates + Sozomen +
    Theodoret; the standard medieval Latin abridgement of 4th–5th-c.
    Greek church history. Flacius invokes it as third-in-a-triangulation
    of ancient testimony against Roman jurisdictional claims.

# ─── Tranche 2e — Council + Clemens Alex (vl0022–vl0027) ────────────────

concilium_elibertinum:
  english: Council of Elvira
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Concilium Elibertinum at vl0022"
  note: >
    Council held at Illiberis (Elvira, Spain) c. 305/306. Canon 36
    forbade pictures in the church, invoked by Byzantine iconoclasts
    (Hieria 754) and by Reformation polemicists as ancient anti-icon
    witness. Scope disputed; Flacius reads maximally.

iconoclasia:
  english: Iconoclasm
  alt: ["imagines-condemnatio"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Concilium at vl0022"
  note: >
    The Byzantine iconoclast movement (726–843), including Emperors
    Leo III + Constantine V, Council of Hieria (754). Reversed by
    Nicaea II (787), then briefly re-affirmed under Frankfurt Synod
    (794) + Libri Carolini in the Carolingian West. Flacius invokes
    the sequence selectively, suppressing Nicaea II — a rare
    instance of one-sided source-selection in the Catalogus.

thysia_eucharistica:
  english: Eucharistic sacrifice (as prayer)
  alt: ["oratio", "sacrificium spirituale"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Alex Stromateis VII.6 at vl0023"
  note: >
    Clement of Alexandria's redefinition (Stromateis VII.6.31–32,
    PG 9:433–436) of Christian sacrifice as prayer offered from the
    just soul, and altar as gathered congregation — Reformation
    proof against the medieval propitiatory-Mass doctrine.

altare_spirituale:
  english: Spiritual altar (as the gathered congregation)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Alex at vl0024"
  note: >
    Clement's ecclesiology from Stromateis VII: the altar is not
    physical stone but the gathered pious congregation. Cuts against
    later doctrine of altare consecratum and the theology of
    eucharistic space.

siricius_papa:
  english: Pope Siricius
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Alex forward-ref at vl0024"
  note: >
    Bishop of Rome 384–399. In letter *Directa* to Himerius of
    Tarragona (Feb 385) laid down first formal legislative
    requirement of clerical celibacy for the Latin West. Flacius
    forward-refs to his own entry later in the Catalogus body.

apostolorum_coniugia:
  english: The Apostles' marriages
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Clemens Alex at vl0025"
  note: >
    Clement of Alexandria (Stromateis III.6.53) argues that Peter,
    Philip, and Paul were married — historical warrant: Matt 8:14
    (Peter's mother-in-law), Acts 21:9 (Philip's daughters — Clement
    confuses Philip the deacon with Philip the Apostle), 1 Cor 9:5.
    Standard Reformation locus for defending clerical marriage.

# ─── Tranche 2f — Methodius through Attalus (vl0027–vl0031) ─────────────

ex_opere_operato:
  english: By the work worked
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ecclesiae Sclavonicae at vl0029"
  note: >
    Medieval scholastic doctrine that sacraments confer grace by
    the objective performance of the rite, not by subjective
    disposition of minister or recipient (Aquinas ST III.62.1).
    Flacius rejects: vernacular Slavonic liturgy proves early
    Christians treated sacred language as intelligibility-for-
    edification, not as ex opere operato.

pseudo_methodius:
  english: Pseudo-Methodius
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Methodius Graecus at vl0027"
  note: >
    Flacius conflates the historical Methodius of Olympus (†c. 311)
    with the 7th-c. Syriac Revelationes divi Methodii episcopi
    Paterensis (Sebastian Brant's Basel 1498 edition). The apocalyptic
    prophecies belong to Pseudo-Methodius, not the historical figure.

montanismus:
  english: Montanism (New Prophecy)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Apollonius at vl0030"
  note: >
    Late-2nd-c. Phrygian prophetic movement led by Montanus (fl.
    c. 170), imposing extra fastings + ascetic discipline. Flacius
    treats Montanist rigorism as prefiguring later papal rigorism
    (celibacy, fasts) — 2nd-c. anti-Montanist arguments serving as
    templates for 16th-c. anti-papal arguments.

vernacula_liturgia:
  english: Vernacular liturgy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ecclesiae Sclavonicae at vl0029"
  note: >
    Sts Cyril and Methodius's 863+ Old Church Slavonic mission
    established Slavic-language liturgy across the Byzantine-Slavic
    world. Aeneas Sylvius (later Pius II) records supposed heavenly
    voice sanctioning Slavic (quoting Ps 150:6). Flacius's polemical
    use: even future Pope preserved witness that heaven sanctioned
    vernacular — why now damn German vernacular as heretical?

# ─── Tranche 2g — Cyprianus through Antonius (vl0032–vl0037) ────────────

pares_dignitate_potestate:
  english: Equal in dignity and power
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Cyprianus at vl0033"
  note: >
    Cyprian De Ecclesiae Catholicae Unitate c. 4 (PL 4:513-515) —
    Hoc erant utique et ceteri apostoli quod fuit Petrus, pari
    consortio praediti et honoris et potestatis. Load-bearing
    patristic proof-text for Reformation-Lutheran doctrine of
    apostolic parity against Petrine-primacy; competing Textus
    Primatus is later interpolation.
  see_also: [primatus_Petri, primatus]

electio_populi:
  english: Election by the people
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Cyprianus at vl0032"
  note: >
    Cyprian Ep. 67: bishops are elected by the plebs Christiana,
    not appointed from above (Num 20:25-26, Acts 1:15-26 as
    proof-texts). Locus classicus for early conciliar-electoral
    ecclesiology against papal appointment.

collyridiani:
  english: Collyridians
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Epiphanius at vl0035"
  note: >
    Arabian-Syrian sect condemned by Epiphanius Panarion haer. 79 —
    women who baked cakes (κολλυρίδες) and offered them to Mary.
    Epiphanius's principle "Let Mary be in honour, but let the
    Trinity be worshiped" = pre-eminent patristic locus for
    Reformation distinction veneratio vs adoratio Mariae.

agapetae:
  english: Agapetae (subintroductae)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Agapiti at vl0036"
  note: >
    3rd-4th-c. mixed-sex ascetic households, condemned by Nicaea I
    canon 3 on subintroductae + Chrysostom Adversus eos qui
    subintroductas habent + Jerome Ep. 22, 117. Flacius reads as
    4th-c. type of medieval clerical concubinage-under-celibacy-
    pretext.

theologus_par_excellentiam:
  english: The Theologian (title)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregorius at vl0033"
  note: >
    Gregory Nazianzus's honorific title ὁ Θεολόγος par excellence,
    for his Trinitarian defence. Flacius invokes Ep. 130 "I have
    never seen a synod come to a good end" as Reformation locus
    for conciliar corruption; Melanchthon Apologia BSELK 494.

# ─── Tranche 2h — Antonius completion through Basil (vl0038–vl0043) ─────

vita_antonii:
  english: Life of Anthony (Athanasius)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Antonius at vl0038"
  note: >
    Athanasius's c. 360 hagiography of Anthony the Great — foundational
    text of Christian monasticism. Flacius invokes Vita c. 90-91 on
    burial-of-martyrs against relic-cult; Anthony-and-shoemaker legend
    (Apophthegmata Patrum + Cassian Collationes XVIII.15) for lay-
    vocation-parity vs monastic elitism.

sola_scriptura_antonii:
  english: Anthony's Evangelical codex answer
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Antonius at vl0039"
  note: >
    Per Peter Cantor of Paris (†1197) Verbum Abbreviatum, Anthony
    offered petitioners the Evangelical codex as the sufficient rule
    of life — Flacius's ancient-monastic warrant for sola-scriptura
    principle against later monastic-rule proliferation.

adulator_paparum:
  english: Flatterer of the Popes
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ravenna/Aquileia/Milan at vl0028 + Hilarius at vl0042"
  note: >
    Flacian rhetorical formula for pro-papal court-historians and
    canonists who defend papal-infallibility (Papam minime errare
    posse). Predates Vatican I 1870 definition by three centuries.
    Applied to Platina Vitae Pontificum 1479 and to contemporary
    16th-c defenders.

hilarius_vs_leo_legend:
  english: The Hilary-vs-Pope-Leo legend
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hilarius at vl0042"
  note: >
    Spurious medieval legend of Hilary of Poitiers †367 confronting
    Pope "Leo" (chronologically impossible; Leo I 440-461). Flacius
    honestly signals anachronism, suggesting story really belongs
    to Hilary of Arles (Vicennensis c. 400-449). Candor about
    historical error is characteristic of Catalogus at its scholarly
    best.

# ─── Tranche 2i — Gangra through Milevis (vl0044–vl0050) ────────────────

concilium_gangrense:
  english: Council of Gangra
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Concilium Gangrense at vl0044"
  note: >
    Council of Gangra c. 340/341 — 21 canons anathematising ascetic-
    elitism (Eustathian rigorism). Canon 4 anathematising discrimination
    against married priests is pre-eminent Reformation-anti-celibacy
    conciliar proof. Preserved via Dionysius Exiguus + Gratian.

paphnutii_sententia:
  english: The Paphnutius intervention at Nicaea
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Paphnutius at vl0045"
  note: >
    Bishop Paphnutius of Upper Thebaid at Nicaea I (325) preventing
    enforced celibacy by invoking Heb 13:4 honorabile connubium.
    Per Socrates HE I.11 + Sozomen HE I.23 + Nicephorus VIII.19.
    Modern historicity debated but universally accepted by 16th-c
    Reformation polemicists.

nicaenum_concilium:
  english: Council of Nicaea I (325)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Nicaenum concilium at vl0046"
  note: >
    First ecumenical council. Flacius emphasises Canons 4 (neighbouring-
    bishops ordination) + 6 (Alexandria/Antioch/Rome regional
    patriarchates with NO Roman universal-jurisdiction). Absence of
    Roman-super-jurisdictional language in Canon 6 is decisive.

zosimus_forgery:
  english: The Zosimus/Boniface/Celestine Nicene-canon forgery
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Nicaenum concilium at vl0048"
  note: >
    Popes Zosimus (417-418), Boniface I (418-422), Celestine I (422-432)
    sent to Council of Carthage what they claimed were Nicene canons —
    actually Sardica 343 canons granting Roman appellate jurisdiction.
    African bishops (Aurelius, Augustine) detected forgery via Alexandria
    + Constantinople manuscripts. Reformation locus classicus for papal-
    forgery.

chalcedonensis_canon_28:
  english: Chalcedon Canon 28
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Constantinopolitana Synodus at vl0050"
  note: >
    Chalcedon (451) Canon 28 reaffirmed Constantinople's primacy,
    equating Constantinople status with Rome. Leo I vigorously
    protested (Ep. 104-106) — foundational East-West rift leading
    to 1054 Schism.

# ─── Tranche 2j — Chalcedon + 6th Carthage (vl0051–vl0056) ──────────────

paschasinus_stratagem:
  english: The Paschasinus stratagem at Chalcedon
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Chalcedonensis synodus at vl0051"
  note: >
    Papal legate Paschasinus of Lilybaeum protesting Canon 28 at
    Chalcedon 451 by adding to their objection a summary claiming
    Roman primacy over all provinces — Flacius's cursive-stratagem
    charge: Rome tried to reframe the plainly Constantinople-favouring
    canon as a Roman-primacy warrant.

sexta_carthaginensis:
  english: Sixth Council of Carthage (419)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sexta Carthaginensis synodus at vl0054"
  note: >
    Under Aurelius of Carthage 419, at which the Zosimus-Boniface-
    Celestine forgeries of Nicene canons were exposed via Marcellus
    +Innocentius verification-mission to Alexandria + Constantinople.
    Codex Canonum Ecclesiae Africanae records proceedings. Textbook
    Reformation-historiography case of source-critical papal-forgery-
    exposure.

bonifacius_secundus_coercitio:
  english: Boniface II's Coercion of Eulalius
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sexta Carthaginensis at vl0055"
  note: >
    Pope Boniface II (530-532) extorted from Eulalius of Carthage
    formal repudiation of the Sixth Carthaginian synod (419),
    anathematising African bishops' own predecessors. Flacius reads
    as the moment when Latin Africa was finally subjected to Roman
    jurisdiction — six centuries into Church history.

# ─── Tranche 2k — Turonicum + Iulius + Hispani + Innocentius (vl0056-61) ─

directa_siricii:
  english: Siricius's Directa
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hispani sacerdotes at vl0058"
  note: >
    Pope Siricius (384-399) decretal Directa to Himerius of Tarragona
    10 Feb 385 (Denzinger 185) — first papal legislation mandating
    clerical celibacy for Latin West. Confuses Rom 8:8 (qui in carne
    sunt Deo placere non possunt) with marital sexuality. Exegetical
    howler corrected by Augustine + Aquinas + all serious commentators.
    Shaped medieval anti-marital pastoral rhetoric for a millennium.

hispani_sacerdotes_resistentia:
  english: Spanish clerical marriage resistance
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hispani sacerdotes at vl0058"
  note: >
    4th-c Spanish clergy invoked Heb 13:4 + 1 Cor 7 + 1 Tim 3 to
    defend clerical marriage against Siricius Directa. Extended by
    Isidore the Younger (Seville c. 560-636) De Ecclesiasticis
    Officiis II.5 permitting cleric either wholly celibate or single-
    married. Gratian Decretum Dist. 23. Resistance collapsed under
    11th-c Gregorian reform.

concilium_turonicum:
  english: Council of Tours (461)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Turonicum concilium at vl0056"
  note: >
    Under Perpetuus of Tours — Canon 3 mitigated penalty for
    clerics continuing conjugal life post-ordination to excommunication
    without perpetual deposition. Evidence 5th-c Gallic bishops did
    not treat clerical marriage as summa haeresis (as later Gregorian).

iulius_pseudo_decreta:
  english: The pseudo-Julian decretal
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Iulius Papa at vl0057"
  note: >
    Pseudo-Julian text (Cum omne crimen) preserved in Gratian
    Decretum De consecratione dist. 2, arguing for communion sub
    utraque specie. Ironically part of the same forgery-corpus
    Flacius attacks elsewhere, but he invokes gratefully against
    Constance 1415 session XIII (DH 1198-1200) denial of chalice
    to laity — foundational Hussite/Reformation locus.

# ─── Tranche 2l — Polychronius + Hilary of Arles + Symmachus (vl0061-66) ─

loca_sancta_primatus:
  english: The loca sancta primacy claim
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Polychronius at vl0061"
  note: >
    Jerusalem's 5th-c claim to primacy on ground it is site of Christ's
    suffering + resurrection + ascension + Pentecost. Argument had
    genuine currency (Juvenal of Jerusalem at Chalcedon 451 securing
    patriarchate). Flacius reads as evidence no one-city-primacy-
    doctrine existed in 5th-c Church.

ennodius_libellus:
  english: Ennodius's Libellus pro Synodo Palmari
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Symmachus at vl0065"
  note: >
    Ennodius of Pavia †521 composed Libellus pro Synodo Palmari 503
    (PL 63:183-208) defending Pope Symmachus's immunity from judicial
    process at Palmary Synod 502. Origin-text of prima sedes a nemine
    iudicatur doctrine.

prima_sedes_a_nemine_iudicatur:
  english: The first see is judged by no one
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Symmachus at vl0065"
  note: >
    Medieval canonical doctrine of papal immunity from any earthly
    tribunal — Emperor, bishops, kings. Ennodius Libellus 503, then
    Gratian Decretum Dist. 40. Flacius traces origin to Palmary Synod
    502 and reads whole subsequent papal monarchy as its consequence.

hilarius_arelatensis:
  english: Hilary of Arles
  alt: ["Hilarius Vicennensis"]
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hilarius Vicennensis at vl0063"
  note: >
    Bishop of Arles c. 401-449, senior metropolitan of Gaul. Conflict
    with Leo I 444-445 over Chelidonius of Besançon deposition led
    to Leo Ep. 10 (PL 54:628-636) 445 + Valentinian III Novella 17
    445 confirming Roman appellate jurisdiction over Gaul.

# ─── Tranche 2m — Ius civile + Celestine + Socrates + Aug-A (vl0066-72) ─

novellae_iustiniani:
  english: Justinian's Novellae
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ius civile at vl0066"
  note: >
    Novellae Constitutiones 534-565 — Justinian's imperial legislation.
    Novellae 123, 137 requiring consecrations cum illustri voce in
    language known to congregation = imperial-law witness against later
    Roman Latin-only liturgy. Novellae 3, 131 establishing Constantinople-
    Rome patriarchal equality.

celestinus_de_veste_clericorum:
  english: Celestine on clerical dress (doctrina non veste)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Celestinus primus at vl0067"
  note: >
    Celestine I Ep. 4 to Vienne+Narbonne bishops 428 (PL 50:429-436)
    — Clergy distinguished doctrina non veste, conversatione non habitu,
    mentis puritate non cultu. Widely cited Reformation locus against
    clerical distinctiveness by external observance and monastic dress.

socrates_scholasticus:
  english: Socrates Scholasticus HE V.22
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Socrates at vl0069"
  note: >
    Socrates HE V.22 — classic Reformation locus on regional variation
    in fasting, liturgical, and clerical-marriage customs. Proof-text
    that early Christian practice was diverse, not uniform, and that
    uniformity-drive is later medieval imposition. Preserved via
    Cassiodorus Historia Tripartita IX.38.

augustinus_ep_55:
  english: Augustine Ep. 55 to Ianuarius on ceremonial-burden
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0069"
  note: >
    Augustine Ep. 55 (formerly Ep. 119, PL 33:204-223) — the celebrated
    lament that Christians burdened themselves with ceremonial-observance
    more than Jews under the Law. Reformation locus classicus for
    Augustinian critique of ceremonial-proliferation.

non_praecedunt_bona_opera:
  english: Bona opera non praecedunt iustificandum, sed sequuntur iustificatum
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0071"
  note: >
    Augustine De Fide et Operibus 14 (PL 40:212). Proof-text for
    Reformation-Lutheran ordering of justification-before-sanctification.

crede_et_manducasti:
  english: Crede et manducasti (Augustine on spiritual eating)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0070"
  note: >
    Augustine Tractatus in Iohannem 25.12 (PL 35:1602) Quid paras
    dentem et ventrem? Crede, et manducasti. Reformation sola-fide +
    eucharistic-theology locus classicus for spiritualis manducatio.

# ─── Tranche 2n — Augustine-B + Sibylla + Chrysostom + Carthage V (73-77) ─

petra_non_petrus:
  english: Petra vero erat Christus (Augustine on Matt 16:18)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0073"
  note: >
    Augustine Retractationes I.21.1 (PL 32:618) — non ego dixi super
    Petrum sed super petram, quia non petra a Petro sed Petrus a petra
    dictus est. Petra vero erat Christus. Augustine reverses earlier
    Peter-as-rock exegesis in favour of Christ-as-rock. DECISIVE
    Reformation proof-text against Petrine-primacy-from-Matt-16.

de_opere_monachorum:
  english: Augustine De Opere Monachorum
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0074"
  note: >
    Augustine PL 40:547-582 systematic critique of North African
    monastic idleness. Applied by Flacius against medieval mendicant
    orders via 2 Thess 3:10 si quis non vult operari nec manducet.

confessio_auricularis_augustini_critique:
  english: Augustine's implicit critique of auricular confession
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Augustinus at vl0074"
  note: >
    Confessiones X.3.3 (PL 32:780) Quid mihi ergo est cum hominibus
    ut audiant confessiones meas? Flacius reads Augustine's suspicion
    of interpersonal confession as ancient warrant against medieval
    auricular-confession sacrament (Lateran IV 1215 obligatory annual).

oracula_sibyllina:
  english: The Sibylline Oracles
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Sibylla at vl0075"
  note: >
    Corpus of prophetic verse-oracles in Greek hexameters, composite
    Jewish-and-Christian 2nd c. BC-7th c. AD. Preserved by Lactantius
    + Augustine De Civitate Dei XVIII.23. Flacius invokes for
    Ecclesia fantastica imagery + Ernestine-exile-after-Mühlberg
    (1547 John Frederick I + Otto Henry + Kaspar Pflug) as Sibylline
    "exile-and-return of princes for true piety" retrospective
    apocalyptic confirmation.

chrysostomus_cathedra_non_facit:
  english: Cathedra non facit sacerdotem sed sacerdos cathedram
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Chrysostomus at vl0077"
  note: >
    Chrysostom In Matthaeum Homilia 43 (PG 57:459) on Matt 23:2.
    Classic Chrysostomic distinction of office from office-holder:
    the chair does not sanctify the man. Flacius reads against
    later papal claims that Roman see itself confers holiness on
    the sitter.

concilium_carthaginense_v_canon_14:
  english: Carthage V (401) Canon 14 against spurious altars
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Concilium Carthaginense V at vl0077"
  note: >
    Carthage V (401) Canon 14 — spurious altars and memorials not
    authenticated by relics or fathers' tradition to be destroyed;
    against martyr-cults based on private visions/dreams (somnia).
    Flacius reads as ancient conciliar witness against medieval
    private-revelation-based cults (Marian apparitions etc.).

# ─── Tranche 2o — Carthage V tail + Ambrose + Jerome (vl0078-vl0080) ────

ambrosiaster_thess:
  english: Ambrose(-aster) on 2 Thess 2:3 — Roman-restorer-Antichrist
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ambrosius at vl0078"
  note: >
    Ambrose (or Ambrosiaster) Commentaria in II Thessalonicenses on
    2 Thess 2:3 (PL 17:483) — homo peccati arising after Roman empire
    collapse and restoration by "Roman" figure. Pre-Reformation Latin
    exegete already indicating Roman-restoration-figure as Antichrist.

presbyter_et_episcopus_idem:
  english: Presbyter and episcopus originally same office (Jerome)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0080"
  note: >
    Jerome Ep. 146 to Evagrius (PL 22:1194) — in earliest Church
    presbyter and episcopus were same office; elevation of episcopus
    above presbyter is by human not divine right. Foundational
    Reformation proof-text against medieval episcopal-hierarchical
    claim. Parallel at Commentaria in Titum I.5 (PL 26:562).

non_sanctorum_filii:
  english: Non sanctorum filii sunt qui tenent loca sanctorum
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0080"
  note: >
    Jerome tag preserved in Gratian Decretum Dist. 40 (probably from
    Ep. 14 to Heliodorus). Aphorism against ecclesiastical position-
    holding without corresponding character. Flacius reads as Jerome's
    own critique of developing Roman-episcopal position-doctrine.

# ─── Tranche 2p — Jerome tail + Gelasius + Symm-supp + Germaniae 81-85 ──

ecclesia_ex_quo_crevit_in_possessionibus:
  english: Ecclesia ex quo crevit in possessionibus decrevit in virtutibus
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0081"
  note: >
    Famous Jeromean tag applied throughout medieval reform-literature
    and Reformation polemic. Actual Jerome source unclear (possibly
    Vita Malchi or an epistolary passage); circulated freely.

sacerdotes_baal:
  english: Priests of Baal (Jerome on clerical vanity)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0081"
  note: >
    Jerome Ep. 22 to Eustochium (PL 22:394-425) closing verdict on
    corrupt clerical vanity — perfumed vestments, curled hair,
    glittering rings, seeking honours. Letter provoked massive
    clerical hostility at Rome (n178). Reformation-standard tag.

pius_ii_conciliarism:
  english: Aeneas Sylvius conciliarism (pre-papal Pius II)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0083"
  note: >
    Aeneas Sylvius Piccolomini Commentarii de gestis Basiliensis
    Concilii (1440-42, pre-papal) — quotes Jerome on Matt 5:13
    sal insipidum as warrant for deposing bad pope. Flacius uses
    pre-papal Aeneas Sylvius against post-papal Pius II as favorite
    polemical move (parallel n152 + n221).

pilgrimage_critique:
  english: Non Hierosolymam vidisse (Jerome anti-pilgrimage)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Hieronymus at vl0083"
  note: >
    Jerome Ep. 58 to Paulinus (PL 22:579) — Non Hierosolymam uidisse
    sed Hierosolymis pie uixisse laudandum est. Reformation-standard
    anti-pilgrimage locus.

gelasius_de_consecratione_dist_2:
  english: Gelasius against communion sub una specie
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gelasius at vl0084"
  note: >
    Gelasius I (492-496) De consecratione Dist. 2 c. 12 (Gratian
    Decretum) — divisio unius eiusdemque mysterii sine grandi
    sacrilegio non potest accidere. REFORMATION-KEY PROOF-TEXT
    against Constance 1415 session XIII (DH 1198-1200) mandating
    communion in one kind for laity — even 5th-c pope declared
    it sacrilege. Internal-Roman contradiction structure.

epistola_germaniae_galliae:
  english: Epistola episcoporum Germaniae et Galliae ad Anastasium
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Episcopi Germaniae at vl0085"
  note: >
    Preserved in Johannes Aventinus Annales Boiorum (Ingolstadt 1554)
    collectanea. Contested authenticity (possibly 15th-c Gallican-
    conciliarist forgery projected onto Anastasius I 399-401 or II
    496-498). Flacius honestly notes uncertainty about which Anastasius.

# ─── Tranche 2q — Epistola ipsa + Salvian + Pelagius (vl0086-vl0090) ────

haec_sancta_conciliarism:
  english: Haec sancta conciliarist doctrine
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Epistola Germaniae ipsa at vl0086"
  note: >
    Council of Constance 1415 session V Haec sancta decreeing council
    authority superior to pope; continued at Basel 1431-1449. The
    pseudo-Anastasius letter's core thesis authoritas Conciliorum
    maior est quam unius Papae directly echoes it — either 15th-c
    Gallican forgery marker or remarkable proto-conciliarism.

salvianus_massiliensis:
  english: Salvian of Marseille De Gubernatione Dei
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Salvianus at vl0090"
  note: >
    Salvian c. 400-c. 480 De Gubernatione Dei V (PL 53:96-108) —
    blames Western Empire collapse on Roman-Christian moral corruption.
    PECCATA INTERDIXIT DEUS NON MATRIMONIA against Siricius Directa
    385 celibacy-imposition (still contemporary aftermath c. 480).

# ─── Tranche 2r — Pelagius + Gregory the Great + Sixth Synod (vl0091-95) ─

praecursor_antichristi:
  english: Precursor of Antichrist (Gregory on universalis episcopus)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregorius papa I at vl0091"
  note: >
    Gregory the Great Ep. V.44 to John the Faster of Constantinople —
    quisquis se universalem sacerdotem uocat uel uocari desiderat in
    elatione sua Antichristum praecurrit. ONE OF THE MOST DEVASTATING
    patristic self-witnesses in Reformation arsenal (already n351).

servus_servorum_dei:
  english: Servant of the servants of God (papal titulature)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregorius papa I at vl0094"
  note: >
    Papal self-titulature adopted by Gregory the Great as deliberate
    humility-formula against universalis episcopus claim. Subsequent
    popes retained title while inverting its meaning claiming totius
    orbis terrarum dominium — Flacius reads as MANIFEST LIE.

pseudo_ulricus_anti_celibatus:
  english: Pseudo-Ulric on Gregorian celibacy-abrogation
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregorius papa I at vl0092"
  note: >
    Pseudo-Ulrican letter (10th-11th c anti-celibacy forgery attributed
    to Ulric of Augsburg †973) transmits story of Gregory the Great
    abrogating clerical celibacy after discovering foetus trucidati
    (infants killed to conceal clerical liaisons). Universally cited
    in Reformation anti-celibacy literature. Not authentic Gregorian.

trullanus_canon_13:
  english: Trullan Canon 13 (permitting married clergy)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus sexta at vl0094"
  note: >
    Council in Trullo (Quinisext) 691/692 Canon 13 preserved Gratian
    Decretum Dist. 31. Explicitly permits ordained deacons/presbyters
    married before ordination to continue conjugal relations, forbids
    requiring celibacy-vows at ordination. Rome rejected Trullan
    canons on this ground — Reformation invoked as Eastern-Orthodox
    canonical proof against Roman-mandated celibacy.

# ─── Tranche 2s — Trullan continuation + Regula + Carmina (vl0096-vl0098) ─

honorius_condemnatus:
  english: Pope Honorius I condemned at Constantinople III
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus sexta at vl0097"
  note: >
    Pope Honorius I (625-638) condemned for monothelite heresy at
    Sixth Ecumenical Constantinople III (680-681) session 13, 14 March
    681. Reformation's SMOKING-GUN PROOF against papal infallibility —
    general council formally condemned pope as heretic. Bellarmine
    contorted defence in De Romano Pontifice IV.11.

latin_mass_introduction:
  english: John of Portus / Latin-Mass introduction
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus sexta at vl0097"
  note: >
    Bishop John of Portus (Porto) traditionally credited per Platina
    with introducing Latin Mass under Vigilius/Gregory mid-6th c.
    Flacius seizes ex-ore-proprio: if Latin Mass had to be introduced
    by identified 6th-c bishop, not apostolic. 700 years of Christian
    history (33-700+) without Latin Mass = clincher for vernacular
    liturgy.

trullanus_canon_55:
  english: Trullan Canon 55 (against Roman Saturday-fasting)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus sexta at vl0096"
  note: >
    Trullo 692 Canon 55 condemned Roman practice of Saturday fasting
    in Lent (not Eastern practice). Together with Canon 13 the two
    reasons Rome rejected Trullan corpus. Flacius reads as further
    conciliar correction of Rome.

# ─── Tranche 2t — Vetera carmina verses + Ulric of Augsburg (vl0099-100) ─

roma_diu_titubans:
  english: Roma diu titubans (anti-papal medieval verse)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Vetera carmina at vl0099"
  note: >
    Four elegiac couplets prophesying Rome's fall, censure/faith
    departing, hidden error made public, connubia foeda, coming of
    homo peccati. Parallels Joachimite-Franciscan spiritual apocalyptic
    (12th-13th c). Preserved via Valentin Muntzer Chronographia.

pseudo_udalricus:
  english: Pseudo-Ulric De continentia clericorum
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — S. Udalricus at vl0099"
  note: >
    PL 135:57-66 attributed to Ulric of Augsburg 890-973 but actually
    11th-c anti-Gregorian-Reform forgery composed in Germany during
    Investiture Controversy. Universally attributed to Ulric throughout
    Middle Ages, cited by Reformation-era anti-celibacy polemicists as
    authentic 10th-c testimony. Flacius treats as genuine.

fishpond_infant_skulls:
  english: Papal fish-pond 600 infant-skulls (Gregorian celibacy story)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — S. Udalricus at vl0100"
  note: >
    Pseudo-Ulrican dramatic amplification: papal fish-pond dredged
    yielded 600 infant skulls (killed by celibate priests concealing
    sexual liaisons). Not attested in Gregory's actual Regesti. Melius
    est nubere quam caedis causam praebere universally cited Reformation
    anti-celibacy. Modern scholarship recognises whole pseudo-Ulrican
    corpus as 11th-c Investiture-Controversy forgery.

# ─── Tranche 2u — Pseudo-Ulrican letter + Historici (vl0101-vl0109) ─────

nicholas_ii_1059:
  english: Nicholas II Roman Synod 1059 celibacy decree
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Pseudo-Ulricus at vl0101"
  note: >
    Roman Synod of April 1059 under Nicholas II (r. 1058-1061)
    established that clerics living with wives or concubines could
    not celebrate Mass, and that laity should refuse the sacraments
    from them. Foundational legislative moment of Gregorian Reform's
    celibacy-enforcement (intensified Gregory VII †1085, Urban II,
    definitively Lateran II 1139). Pseudo-Ulric letter responds.

sancta_discretio:
  english: Holy discretion (Ulric's canonical-legislation principle)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Pseudo-Ulricus at vl0105"
  note: >
    Ulric's technical term for mode of ecclesiastical legislation
    that must balance canonical universality against local-
    conscientious specificity. Anticipates Reformation-Lutheran
    distinctions between adiaphora and doctrina necessaria.

pseudo_ulrican_argument:
  english: Pseudo-Ulrican 7-part argument against enforced celibacy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Pseudo-Ulricus at vl0101"
  note: >
    (i) OT scriptural chain — Aaron/Levitical priests/Samuel/Zacharias
    (ii) NT scriptural chain — Matt 19:6, Heb 13:4, 1 Tim 3:2 unius-uxoris,
    1 Cor 7:2, 7:9 melius-nubere (iii) Patristic — Paphnutius Augustine
    Jerome (iv) Historical — Gregorian fish-pond-abrogation (v) Ecclesio-
    logical — no local decree overrides Nicene tradition (vi) Pastoral-
    catastrophic — celibacy causes concubinage/fornication/sodomy/
    bestiality/infanticide (vii) Peroration — Christ sole eternal high
    priest.

# ─── Tranche 2v — Historici + Nicetas + Beseritae + Const + Claudius ────

gregorius_vii_1074:
  english: Gregory VII 1074 Lenten Synod (mandated celibacy)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Historici at vl0110"
  note: >
    Hildebrand/Gregory VII r. 1073-1085 Roman Lenten Synod 1074
    formally prohibited married priests from celebrating Mass and
    required wives' expulsion. Led to German-episcopal resistance
    (Otto of Constance 1071-1086, Ratholdus of Strasbourg 1075-1077)
    and counter-schism running to Concordat of Worms 1122.

phocas_607:
  english: Phocas 607 decree recognising Roman primacy
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Archiepiscopi Constantinopolitani at vl0112"
  note: >
    Byzantine usurper Phocas r. 602-610 (deposed and killed Emperor
    Maurice + sons) in 607 issued imperial decree formally recognising
    Roman see as head of all churches — founding-moment of papal
    universal-jurisdictional claim. Phocas's parricide character taints
    the origin — Reformation ad-hominem commonplace (Luther Ad librum
    ambrosii Catharini 1521 WA 7:733-735).

nicetas_stethatos:
  english: Nicetas Stethatos and 1054 Schism
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Nicetas at vl0111"
  note: >
    Nicetas Stethatos c. 1005-c. 1090 Studite monk-theologian at
    Constantinople defending married clergy + attacking Roman customs.
    Treatises condemned by Cardinal Humbert of Silva Candida 1054 —
    the exchange of anathemas constituting traditional dating of
    East-West Schism. Flacius reads as pre-Reformation anti-celibacy.

claudius_altisidiorensis:
  english: Claudius Clemens Scotus / Claudius of Turin
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Claudius at vl0112"
  note: >
    Flacius conflates Claudius Clemens Scotus (Irish Palace-School
    scholar c. 780-c. 830 disputed with Boniface) with Claudius of
    Turin †c. 827 (great Carolingian-era anti-image-cult bishop) —
    two Claudii commonly confused in medieval and Reformation sources.
    Standard pre-Reformation anti-image-veneration witness.

# ─── Tranche 2w — Claudius-tail + Alachis + Prophetia + Michael Pal ────

adalbert_wetterau:
  english: Adalbert of Wetterau (Carolingian anti-Roman reformer)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Claudius tail at vl0113"
  note: >
    Gallic bishop condemned with Clement the Scot at Roman Synod 745
    under Zacharias for anti-hierarchical + possibly anti-image
    doctrines. Died in Fulda monastery prison. Boniface-Zacharias
    correspondence Codex Carolinus PL 89:697. Flacius reads pair as
    Carolingian-era proto-Reformers persecuted by Anglo-Roman conformism.

alachis_ticinum:
  english: Alachis of Trent — interior-vs-external piety parable
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Alachis at vl0113"
  note: >
    Alachis Duke of Trent+Brescia fl. c. 688-689 per Paul the Deacon
    Historia Langobardorum V.36-41 (PL 95:606). Deacon asked to kiss
    Alachis's feet, Alachis demanded clean foemoralia meaning INTERIOR
    purity — proto-Reformation parable of inward-vs-external piety.
    Also testicles-in-well vow anti-clerical shock.

gallorum_leuitas_prophetia:
  english: Gallorum leuitas prophecy (medieval Latin verse-oracle)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Prophetia at vl0114"
  note: >
    13th-14th c apocalyptic Latin verse-oracle circulating in late-
    medieval manuscripts sometimes attributed to St Bridget of Sweden
    1303-1373 Revelationes coelestes. Predicts universal Caesar under
    whom vain-clergy's glory ceases (read in 16th c as Charles V).
    Flacius reads as ex-ore-proprio pre-Reformation apocalyptic witness.

michael_palaeologus_ep:
  english: Michael VIII Palaeologus letter to Nicholas III (c. 1278)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Michael Palaeologus at vl0115"
  note: >
    Byzantine emperor Michael VIII r. 1259-1282 (recaptured Constan-
    tinople from Latin crusaders 1261, founded Palaeologan dynasty)
    letter to Pope Nicholas III r. 1277-1280 refuting Roman primacy
    from scripture+Fathers+councils+history. Preserved fragmentarily
    in Byzantine sources; Roman response Nicholas III Fideli ac
    devoto 1278 fully extant. Flacius laments emperor's letter
    suppressed = Reformation charge of Roman documentary suppression.

boniface_apostolus:
  english: Boniface Apostle of Germans (ambivalent inclusion)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Bonifacius at vl0115"
  note: >
    St Boniface/Winfrid c. 675-754 Anglo-Saxon missionary Christianised
    Frisia + central Germany under papal commission. Epistolae Bonifatii
    PL 89. Flacius includes ambivalently — accomplished conversion but
    also opposed Carolingian-era anti-Roman reformers (Adalbert +
    Clement Scot).

# ─── Tranche 2x — Bonifacius full + Carolus Magnus opening (vl0116-119) ─

malefacius_wordplay:
  english: Malefacius (Boniface polemical anti-title)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Bonifacius at vl0117"
  note: >
    Flacius's transformation of Bonifacius (bene-facere well-doer)
    into Malefacius (male-facere evil-doer) — polemical senhal applied
    throughout entry. Bilingual Latin pun characteristic of Reformation
    Latinate wit.

boniface_oath_722:
  english: Boniface's oath of Roman obedience 722
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Bonifacius at vl0118"
  note: >
    Preserved Codex Carolinus year 722 — Boniface pledged to work
    ad obedientiam Apostolicae sedis irritare et inclinare whatever
    hearers encountered. Flacius reads as founding moment of
    specifically-PAPAL (not merely Christian) German conversion.

virgilius_salisburgensis:
  english: St Virgilius of Salzburg (defender of antipodes)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Bonifacius at vl0118"
  note: >
    Irish-born bishop of Salzburg †784 defended doctrine of antipodes
    against Boniface's condemnation as heretical. Among Aventinus
    Annales Boiorum IV list of German-Gallic clerics opposing Boniface
    Roman conformism (Clement Scot + Adalbert + Samson + Sidonius +
    Virgilius) — Reformation-standard pre-Reformation-reformist
    catalogue.

boniface_synod_arms_ban:
  english: Boniface Concilium Germanicum 742 + Estinnes 743 arms-ban
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Bonifacius at vl0119"
  note: >
    Boniface Concilium Germanicum 742 + Synod of Estinnes 743 canons
    prohibiting clerical arms-bearing + hunting-with-dogs-and-falcons
    (except military chaplains with princely retinue). Flacius reads
    with grim irony: even Papal-Roman apostle formally banned clerical
    warfare — discipline utterly ignored by medieval papacy's warrior-
    popes (Julius II most notoriously).

carolus_magnus:
  english: Charlemagne (Holy Roman Emperor 800)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Carolus Magnus at vl0119"
  note: >
    Charles the Great r. 768-814, first Holy Roman Emperor of Latin
    West from Christmas 800. Convoked five reforming synods
    (Frankfurt 794 already n130 + Aachen 799/802/809 + Chalons 813)
    whose canons contra errores et abusus later ignored by Roman
    papacy.

# ─── Tranche 2y — Charlemagne large treatment (vl0120-vl0126) ────────────

ansegisus_capitulare:
  english: Ansegisus Collectio Capitularium 827
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Carolus Magnus at vl0120"
  note: >
    Ansegisus of Fontenelle c. 770-833 Abbot of Saint-Wandrille
    Collectio Capitularium 827 compiled Carolingian imperial
    capitularies into four books. Paris 1550 humanist printing.
    Standard Reformation source for Carolingian conciliar legislation.

libri_carolini:
  english: Libri Carolini (Theodulf c. 790 anti-Nicaea-II)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Carolus Magnus at vl0126"
  note: >
    Systematic Carolingian-Latin refutation of Second Nicene Council
    787 pro-icon decrees, composed under Theodulf of Orléans c. 790,
    Latin text PL 98. Preserved in Lateran library manuscript
    attested by Augustinus Steuchus 1497-1548 Papal librarian.
    Reformation-key polemical ancestor of Luther Wider die
    himmlischen Propheten 1525 anti-image position.

concilium_francofurtense_794:
  english: Frankfurt Synod 794 (Charlemagne)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Carolus Magnus at vl0126"
  note: >
    Charlemagne convoked Frankfurt 794 in response to Adoptionist
    heresy of Felix of Urgel (condemned) + Second Nicene Council
    787 pro-icon decrees (rejected as encouraging idolatry). West
    stood briefly with Byzantine iconoclasts against East.

hildegard_pastoral_rebuke:
  english: Charlemagne's episcopal-appointment reproaches
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Carolus Magnus at vl0124"
  note: >
    Charlemagne refused wife Hildegard's request for court-favourite
    episcopal appointment (IDONEO ET SI PAUPERI IAM DESTINAVI), publicly
    rebuked Archbishop of Mainz for jewel-studded golden sceptre
    imitating imperial regalia — En ait pastores nostros crucem
    Christi professos qui spretae cura et pascendarum ovium
    sollicitudinis ostentatione opibus luxu Imperatorem quemvis
    opulentissimum lacessant. Charlemagne as ideal pastor-of-pastors.

# ─── Tranche 2z — Charlemagne tail + Leo III + Hieria + Frankfurt ──────

leo_iii_indoctissimus:
  english: Leo III Papa homo indoctus + Latin barbara
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Leo III Papa at vl0127"
  note: >
    Pope Leo III r. 795-816 (crowned Charlemagne Emperor Christmas 800)
    — Flacius characterises as HOMO INDOCTUS + LATINI SERMONIS
    ADMODUM IGNARUS invoking barbaram Latin in his letters to Charlemagne
    preserved MGH Epistolae V. Reformation polemic seized on unpolished
    Latin as evidence of papal ignorance. Also FIRST papal assertion
    of authority-superior-to-Scripture (Gratian Decretum preserved).

concilium_hieriense_754:
  english: Iconoclast Council of Hieria 754
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Gregorius Neocaesariensis at vl0128"
  note: >
    Byzantine Iconoclast Council of Hieria 754 attended by Gregory of
    Neocaesarea (this later 8th-c bishop not 3rd-c Thaumaturgus) whose
    iconoclast treatise incorporated into council's acta. Reversed at
    Nicaea II 787 which recatalogued treatise for rejection. Flacius
    reads whole Iconoclast tradition as pre-Reformation-anti-image
    witness.

iconographic_sequence:
  english: The three-council iconographic sequence
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0129"
  note: >
    Reformation-standard reconstruction — Constantinople-Hieria 754
    (iconoclast, Gregory of Neocaesarea book) → Nicaea II 787 (pro-icon,
    Gregory rejected) → Frankfurt 794 (contra Nicaea II, Charlemagne
    Libri Carolini). Evidence iconography was contested throughout
    Christian antiquity with Latin-Frankish tradition standing with
    iconoclast side at founding-moment of medieval Latin Christendom.

burchard_ursbergensis:
  english: Burchard of Ursberg Chronicon (suppressed Frankfurt)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0129"
  note: >
    Burchard of Ursberg †c. 1230 Premonstratensian abbot Chronicon —
    standard medieval Latin chronicle that STUDIÔ SUBTICUERINT
    (deliberately kept silent) about Franco-Roman iconographic
    disagreement + Frankfurt Synod's condemnation of Nicaea II.
    Flacius accuses medieval Catholic historians of deliberate
    suppression.

# ─── Tranche 2aa — Frankfurt Synod substantive + Chalons (vl0130-135) ──

frankfurt_dammat_nicaea_ii:
  english: Frankfurt 794 damned Nicaea II 787 for image-adoration
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0130"
  note: >
    Flacian syllogism (i) Frankfurt 794 damned some Greek synod
    (documented) (ii) that Greek synod was Nicaea II 787 (iii)
    Nicaea II's chief novelty was image-adoration (iv) therefore
    Frankfurt damned image-adoration. QED against medieval Roman
    elision of Franco-Roman iconographic disagreement.

hincmar_remorum:
  english: Hincmar of Rheims (Carolingian witness)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0131"
  note: >
    Hincmar of Rheims c. 806-882 Archbishop 845-882 Opusculum LV
    Capitulorum contra Hincmarum Laudunensem c. 869-870 — 9th-c
    Carolingian witness reading Libri Carolini as young man in
    Aachen palace (non-modicum-volumen sent from Rome). Reformation-
    Lutheran ecclesiology inherits Hincmar's scholastic-conciliar
    theory of unitas → catholicitas → universalitas directly.

regino_prumensis:
  english: Regino of Prüm Chronicon (Pseudosynodus Graecorum)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0130"
  note: >
    Regino of Prüm †915 Chronicon 794 entry explicitly labels
    Nicaea II PSEUDOSYNODUS GRAECORUM PRO ADORANDIS IMAGINIBUS
    falsely called Seventh Ecumenical condemned by Frankish bishops.
    Reformation-key documentation.

media_via_imaginum:
  english: Media via imaginum (Franco-Frankfurt-Lutheran middle position)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Synodus Francofordiensis at vl0132"
  note: >
    Franco-Frankfurt position (accurately preserved by Flacius) —
    images may be HAD and CARRIED for ornament or historical
    instruction but NOT adored, NOT venerated with vestments/lights/
    incense, no procumbere aut genua flectere. Precisely Luther media
    via in Wider die himmlischen Propheten 1525 (WA 18:62-125)
    against both Karlstadt iconoclasm and Roman iconodulia.

# ─── Tranche 2bb — Chalons + Methodius Illyricus + Successores ─────────

chalons_canon_45:
  english: Chalons 813 Canon 45 (5-fold pilgrimage-abuse taxonomy)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Cabilonense concilium at vl0136"
  note: >
    Chalons 813 Canon 45 distinguishes 5 kinds of pilgrimage-abusers
    — (i) clerics thinking pilgrimage purges sins (ii) laity thinking
    pilgrimage licenses future sin (iii) powerful men using as pretext
    for extraction (iv) beggars using for mendicant profit (v) deluded
    believing sight of holy places purges sins. Against Jerome non-
    Hierosolymam-vidisse n324. Reformation-standard proof-text.

methodius_illyricus_apostolos_slavorum:
  english: Methodius of Thessaloniki (Illyrian Apostle to Slavs)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Methodius Illyricus at vl0138"
  note: >
    St Methodius c. 815-885 with brother Cyril †869 — Apostles to
    Slavs, inventors of Glagolitic alphabet for Old Church Slavonic.
    Aventinus Annales Boiorum IV. FLACIUS'S OWN REGIONAL IDENTIFICATION
    as Illyricus (from Labin/Albona in Istria) makes this entry
    personal-genealogical statement of Illyrian Christianity's anti-
    Roman heritage. Glagolitic-rite liturgy sanctioned by Innocent IV
    1248 persists in Croatian coastal dioceses.

successores_paparum_correctio:
  english: Successores Paparum errata corrigi possunt
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Successores Paparum at vl0139"
  note: >
    Gratian Decretum Causa 25 quaestio 1 — errata priorum Paparum
    a successoribus corrigi mutariq[ue] posse et debere. Flacius
    ex-ore-proprio proof against papal infallibility: if popes may
    correct popes then popes are NOT ἀναμάρτητον (anamartēton
    impeccable). Greek philosophical term deployed against medieval
    theological claim.

# ─── Tranche 2cc — Belgian bishops + Sachsenspiegel + Liutbert + Charlemagne
# Edict + Iconoclast emperors + Ludovicus opening (vl0139-vl0150) ────────

episcopi_belgici_gunther_theotgaud:
  english: The Belgian bishops (Gunther of Cologne + Theotgaud of Trier vs Nicholas I)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Episcopi Belgici at vl0139-vl0142"
  note: >
    Gunther Archbishop of Cologne (r. 850-863) + Theotgaud Archbishop
    of Trier (r. 847-863) — deposed at Roman Synod October 863 by
    Nicholas I over the LOTHAR II divorce case (858-869). Presided
    over Metz Synod June 863 approving Lothar's divorce of Teutberga
    and marriage to Waldrada; Nicholas I annulled decrees + deposed
    metropolitans without provincial hearing. Founding-moment of
    specifically-papal jurisdictional overreach into Frankish
    provincial affairs; direct precursor of Dictatus Papae 1075
    and Innocent III plenitudo potestatis. Letter preserved in
    Aventinus Annales Boiorum IV.

servus_servorum_dominus_dominantium:
  english: Servant of servants who strives to be Lord of Lords
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Episcopi Belgici Gunther/Theotgaud letter at vl0141"
  note: >
    Reformation locus classicus on papal-titulature inflation.
    Servus servorum Dei introduced by Gregory the Great Ep V.44
    as anti-universalis-episcopus humility-formula — inverted by
    later popes into title of universal jurisdiction. Dominus
    dominantium echoes 1 Tim 6:15 + Rev 17:14/19:16 (divine title
    now usurped). Gunther-Theotgaud letter deploys the contradiction
    to full polemical effect. Compare Gregory VII Dictatus Papae
    1075 §§9,11; Melanchthon Tractatus BSELK 728-732; the argument
    is the standard Reformation-Lutheran titulature critique.

lupus_sub_pastore:
  english: Wolf under the shepherd's cloak
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Episcopi Belgici Gunther/Theotgaud letter at vl0141"
  note: >
    Sub cultu pastoris lupum sentimus — under the shepherd's cloak
    we detect the wolf. Standard Reformation identification of the
    papacy under Matt 7:15 (lupi rapaces in sheep's clothing) +
    Acts 20:29 (graves lupi entering the flock). Compare Luther
    De captivitate Babylonica 1520 WA 6:497-573. Gunther-Theotgaud
    deploy the trope with special force since Nicholas I titles
    himself pontifex (shepherd) while acting the tyrant.

speculum_saxonicum:
  english: The Sachsenspiegel (Saxon Mirror)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Speculum Saxonicum at vl0142"
  note: >
    Mid-13th c German customary-law code c. 1220-1235 compiled by
    Eike von Repgow for Saxon secular usage. Says Pope cannot mandate
    or ordain anything against Saxon right; further restricts clerical
    inheritance. Flacius's dating 1000+ years and ascription to
    Constantine are humanist misdating (the Sachsenspiegel is High-
    Medieval not Late-Antique) but the polemical point survives:
    even a High-Medieval Germanic legal culture recognised limits
    on papal jurisdictional reach into secular law. MGH Fontes iuris
    germanici antiqui Nova Series I (Eckhardt).

luitpertus_moguntinus:
  english: Liutbert of Mainz (letter to Louis on papal error)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Luitpertus at vl0142-vl0145"
  note: >
    Archbishop of Mainz r. 863-889 East-Frankish primate under Louis
    the German. Letter to Louis (the German most probably, or Louis
    the Younger post-876) asking imperial intervention against papal
    error. Extended body-of-Christ pathology metaphor — head struck
    with injuries, sickness spreads to members, diseased limbs must
    be amputated iuxta praeceptum ueri medici nostri (Matt 5:29-30
    applied ecclesiologically). Zizaniorum sator = Matt 13:24-30
    tares-among-wheat identified as devil-of-doctrinal-scandal.
    Standard Reformation-Lutheran precedent for imperial-court
    coordination against papal overreach; Carolus frater = Charles
    the Bald West-Frankish king, coordination-model between East and
    West Frankish courts.

admonitio_generalis_karoli:
  english: Charlemagne's Admonitio Generalis (23 March 789)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Edictum Caroli Magni at vl0145-vl0149"
  note: >
    Charlemagne's foundational imperial ecclesiastical-reform edict
    promulgated at Aachen 23 March 789. MGH Capitularia I:52-62
    (Boretius) no. 22. 82 chapters — 59 from Dionysio-Hadriana
    canonical collection + 23 Charlemagne's own additions on
    preaching, schooling, moral discipline, clerical training.
    Standard Reformation-Lutheran proof-text: Charlemagne addresses
    bishops as pastores ecclesiarum Christi + ductores gregis +
    clarissima mundi luminaria (Phil 2:15) preserving pastoral
    office without recognising papal-monarchical superintendence.
    Modern edition Mordek/Zechiel-Eckes/Glatthaar 2012 (MGH Fontes
    iuris germanici XVI). Preaching-content: Trinity + incarnation
    + resurrection-in-ipsis-corporibus + Gal 5:19-21 vice catalog
    + Dominical Prayer + 2 Tim 3:1-9 pseudodoctores.

iosias_typus_imperatoris:
  english: Josiah as type of the Christian emperor-reformer
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Edictum Caroli Magni at vl0146"
  note: >
    2 Kings 22-23 (2 Reg. Vg) Josiah's rediscovery of Book of the Law
    + reform of Judah's worship. Charlemagne explicitly types himself
    as Josiah in Admonitio Generalis. FOUNDING-IMAGE of Christian
    imperial reform-of-religion: inspires Alfred the Great, Ottonian
    reform, and — critically — the REFORMATION itself where Frederick
    the Wise + successive Lutheran electors read themselves as Josiah
    restoring true worship. Compare Luther An den christlichen Adel
    1520 WA 6:404-469 on the Christian magistrate's duty to reform
    the Church.

missi_dominici:
  english: Missi dominici (imperial envoys)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Edictum Caroli Magni at vl0146"
  note: >
    Carolingian institutional innovation: pairs of bishop-plus-count
    sent from the palace to supervise ecclesiastical and civil affairs
    in every province. Ex nostris ad uos direximus missos qui ex nostri
    nominis authoritate una nobiscum corrigerent quae corrigenda essent
    — Charlemagne's own language. Reformation-standard evidence for
    IMPERIAL oversight of ecclesiastical discipline in the Carolingian
    period without papal mediation. Classical study F.L. Ganshof
    Frankish Institutions under Charlemagne (Providence 1968) chs. 2-3.

imperatores_iconoclastae:
  english: The Iconoclast Emperors (Leo III through Theophilus)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Imperatores & Synodus Constantinopolitana at vl0149"
  note: >
    Leo III the Isaurian (r. 717-741 iconoclast decree 726/730) →
    Constantine V Copronymus (741-775) → Leo IV the Khazar (775-780)
    → [Irene + Nicaea II 787 pro-icon interlude] → Leo V the Armenian
    (813-820) → Michael II the Amorian (820-829) → Theophilus (829-
    842). Definitively reversed at Synod of Constantinople 843
    Triumph of Orthodoxy. Standard Reformation-Lutheran reading:
    Iconoclast emperors were WITNESSES OF THE TRUTH against Nicaea
    II innovation of image-adoration. Council of Hieria 754 (338
    bishops Palace of Hieria across Bosphorus). Empress Irene
    parricida — blinded her son Constantine VI in 797, convoked
    Nicaea II 787.

regula_clericorum_aquisgranensis:
  english: The Rule of Clerics of Aachen (Institutio Canonicorum, 816)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0150"
  note: >
    Louis the Pious (r. 813 co-emperor / 814-840 sole) convoked
    Aachen 816 Council issuing Institutio Canonicorum + Institutio
    Sanctimonialium (nuns' rule). MGH Concilia II.1 (Werminghoff).
    FLACIUS'S SMOKING-GUN: Louis's letter to Archbishop of Salzburg
    who did not attend council mandates the canonical rule NULLA
    PENITUS PAPAE MENTIONEM FACIENS — "making no mention whatsoever
    of the Pope" — by imperial authority alone (Volumus et decernimus).
    Salzburg archbishop = Arno r. 785-821 or Adalram r. 821-836.
    Reformation-Lutheran standard evidence for Carolingian ecclesiastical
    governance as IMPERIAL not papal; Magdeburg Centuries Cent IX
    develops the reading. Platina Vita Ludovici Pii lament O
    Ludovice ut nam nunc uiueres.

# ─── Tranche 2dd — Ludovicus letter to Arno + Salzburg + Amalarius + Leo III
# submission + Sergius II + pseudo-Eutropius appendix (vl0151-vl0158) ─────

epistola_ludovici_ad_arnonem_salzpurgensem:
  english: Louis the Pious's letter to Arno of Salzburg (816-817)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator continuation at vl0152-vl0155"
  note: >
    Louis's imperial mandate (816-817) to Arno of Salzburg r. 785-821
    who had not attended Aachen Council. Reformation smoking-gun:
    imperial legislative formula VOLUMUS ATQUE DECERNIMUS with NO
    papal mention. Sent by missus Nothonus with canonical formulas
    from Aachen 816. Instructs Arno to summon diocesan bishops at
    convenient time and place, read out formulas chapter by chapter,
    demonstrate what serves ecclesiastical exaltation and salvation
    of souls. Imperial audit via missus dominici sent September 1
    each year to verify compliance. Volumus et decernimus = Byzantine
    imperial-legislative formula (Corpus Iuris Civilis Cod. Just.
    1.1-13) appropriated for Carolingian-Frankish ecclesiastical
    governance. Full text in MGH Epistolae V.

constitutio_romana_824:
  english: The Constitutio Romana (824) — imperial oversight of papal elections
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0151"
  note: >
    Louis the Pious 824 constitution confirming imperial oversight
    of papal elections MGH Capitularia I:322-324. Held (with Ottonian
    Privilegium Ottonianum 962 renewing it) until Nicholas II decree
    1059 restricted papal election to College of Cardinals.
    Reformation-standard pre-Gregorian-reform status quo evidence:
    in potestate Caesaris fuisse tunc, creare non tantum alios
    episcopos & prelatos, sed & Romanum, seu Papam.

meretrix_pedes_osculandos:
  english: The Whore whose stinking feet Kings and Caesars must kiss
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0151"
  note: >
    Meretrix illa caput contra Deum extulit, Regibusq[ue] ac Caesaribus
    (proh nefas) foetidos osculandos obtrusit. Rev 17 Whore-of-Babylon
    identified with papacy + osculum pedum papal foot-kissing =
    Reformation smoking-gun on inverted power. Historical inversion
    begins with Gregory VII Dictatus Papae 1075 §9 (Solus Papa possit
    uti imperialibus insigniis... Quod solius Papae pedes omnes
    principes deosculentur). Standard Melanchthon Tractatus §41.

molinaeus_dumoulin:
  english: Charles Du Moulin (Molinaeus, 1500-1566) on pre-Gregorian imperial-papal order
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0151"
  note: >
    Charles Du Moulin French Reformed-inclining jurist, prof at
    Tübingen 1554-56. Commentarius in edictum Henrici II contra
    parvas datas 1552 + De monarchia Franciae 1555 = great humanist-
    legal treatment of Gallican liberties against papal jurisdictional
    encroachment. Flacius invokes as contemporary humanist-jurist
    witness for pre-Gregorian order (in 816-840 Popes obeyed the
    Emperor).

amalarius_metensis_rector_religionis:
  english: Amalarius of Metz — Louis as rector totius Christianae religionis
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0155"
  note: >
    Amalarius of Metz c. 775-c. 850 great Carolingian liturgist,
    Liber Officialis c. 823 + De Ecclesiasticis Officiis dedicated
    to Louis the Pious. Reformation smoking-gun: Amalarius addresses
    Louis as RECTOR TOTIUS CHRISTIANAE RELIGIONIS quantum ad homines
    pertinet — where here is the Apostolic See and Primacy of the
    Pope? Same book contains proposition that MISSA TANTUM CUM
    VERBIS DOMINI CELEBRARETUR SICUT TEMPORE APOSTOLORUM — Mass
    with only Words of the Lord (Institution narrative) as in
    apostolic time. Directly anticipates Luther Formula Missae
    1523 + Deutsche Messe 1526 recovery of verba Domini as substance
    of the rite. Modern edition Studi e Testi 138-140 Hanssens 1948-50;
    Amalarius controversially condemned by Florus of Lyon at Synod of
    Quierzy 838.

pactum_ludovicianum_817:
  english: Pactum Ludovicianum (817) — Louis's donation-charter to Paschal I
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0156"
  note: >
    Louis the Pious 817 donation-charter confirming papal territorial
    rights while RESERVING imperial confirmation of papal elections
    MGH Capitularia I:352-355. Response to Paschal I r. 817-824 sending
    apologetic legation after his election without imperial confirmation.
    Later CONSTITUTUM LUDOVICIANUM = medieval forgery (DH 641) claiming
    Louis renounced imperial rights in papal creation; weaponised at
    Investiture Controversy. Reformation critical reading: Louis's
    actual Pactum did NOT renounce imperial confirmation. Modern crit
    Sickel 1883 + Schramm 1929.

leo_iii_iudicio_ludovici_submittit:
  english: Leo III submits himself to Louis's judgement (Gratian C.II q.7)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0157"
  note: >
    Reformation smoking-gun against papal infallibility preserved
    in Gratian Decretum Causa II Quaestio VII. Pope Leo III confesses:
    (i) may have acted incompetently (ii) may have failed to preserve
    just law in his subjects (iii) wills all things amended by Louis's
    judgement (iv) confesses that he — quos aliena debemus corrigere
    peccata — commits worse sins than laymen (v) requests imperial
    missi be sent to investigate. Very Leo now claimed inerrant confesses
    potential grave error and submits to secular imperial correction.
    Melanchthon Tractatus §§25-27 develops on pre-Gregorian pontifical
    submission-formulas. Emil Friedberg Corpus Iuris Canonici I 1879.

sergius_secundus_osporcus:
  english: Sergius II Hog's-mouth (Os porci) 844-847
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0157"
  note: >
    Elected + consecrated January 844 without consultation of Emperor
    Lothar I r. 840-855. Lothar sent son Louis II of Italy r. 844-875
    with DROGO OF METZ (Charlemagne's illegitimate son by concubine
    Regina, half-brother of Louis the Pious, Bishop of Metz r. 823-855;
    FLACIUS MISIDENTIFIES as Archbishop of Cologne — possibly from
    corrupted MS since Drogo was papal vicarius for Gaul-and-Germany
    844-855 which may have obscured see-identification) + strong army
    to Rome. Roman clergy + people after military coercion swore to
    observe ancient customs in papal election. Sergius ultimately
    confirmed by Lothar after heavy fine, anointed as king of Italy.

pactum_leonianum:
  english: Pactum Leonianum — Leo III's 800 oath to Charlemagne
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Ludovicus Imperator at vl0157"
  note: >
    Leo III r. 795-816 sacrosancta iuraiurando, literis ac sigillo
    to Charlemagne (attested Annales Regni Francorum ad an. 800 MGH
    SS rer. Germ. VI) that no papal election should proceed without
    imperial consultation. Oath renewed by successive Frankish
    emperors, forms constitutional basis of Carolingian imperial-
    papal relations until Nicholas II 1059 decree. Reformation-
    standard pre-Gregorian imperial-superior arrangement evidence.

pseudoeutropius_appendix:
  english: The pseudo-Eutropius appendix (medieval anonymous historical continuation)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0158"
  note: >
    Anonymous medieval historical compilation appended to ancient
    Eutropius Breviarium ab Urbe Condita producing 26-book universal
    history from Roman antiquity through medieval period. Multiple
    such continuations existed (Paul the Deacon Historia Romana
    most-diffused). Flacius draws on specific manuscript he possesses
    whose author he judges non admodum literato. Structural thesis
    matches Catalogus own: quo ratione, quibus ne fraudibus quidam
    Pontifices Caesarum potentiae labefactarint, sua[m]q oppresso
    Imperio auxerint — by what reason and frauds Pontiffs undermined
    Caesar-power and augmented their own by oppressing Empire.
    Opening translatio imperii ad Byzantium under Constantine as
    Nova Roma matching Chalcedon 451 Canon 28.

# ─── Tranche 2ee — pseudo-Eutropius appendix full narrative Peter-through-
# Louis II vs Nicholas I litanies-contra-principes (vl0159-vl0166) ───────

narsete_polyxena_silverius_legend:
  english: Narses-Polyxena-Silverius legend (papal-Lombard conspiracy narrative)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0160"
  note: >
    Pseudo-Eutropius narrative: Silverius (r. 8 Jun 536 - 11 Mar 537)
    supposedly conspired with Lombards against Byzantines; Narses's
    wife Polyxena exposed intrigue; Pope led out on ass with mocking
    cry HEI DOMINUS PAPA MORTUUS EST. Chronologically compressed
    hybrid of Silverius-Vigilius Ostrogothic conflict (537) + later
    Lombard-Byzantine papal politics; Lombard entry 568 postdated
    Silverius by 30 years. Ass-mounted-pope trope becomes Reformation
    polemic staple (Cranach Papstesel 1523).

zacharias_carolus_desiderius_intrigue:
  english: Zacharias-Charles-Desiderius papal-Frankish-Lombard triangle
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0161"
  note: >
    Pseudo-Eutropius compressed narrative of Zacharias r. 741-752
    intriguing with Frankish king against Lombard Desiderius r. 757-774
    (chronologically confused since Zacharias predates Desiderius).
    Likely conflates: Zacharias's letter to Pippin 751 authorising
    Frankish crown-assumption (Melius est vocari regem quam esse) +
    Charlemagne's divorce of Desiderata 771 + Charlemagne's invasion
    of Italy 773-774 deposing Desiderius. Establishes fabulous annual
    tribute of 10 gold pounds + 100 silver + 10 pallia to Papacy at
    Pavia palatii (not attested in historical Pactum Karoli 774).

leo_iii_799_mutilatio:
  english: Pope Leo III's attempted mutilation 25 April 799
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0162"
  note: >
    Roman conspirators Campulus + Paschalis nephews of deceased
    Adrian I attacked Leo III during Greater Litanies procession
    25 April 799; attempted to blind him and cut out tongue but
    left the job incomplete (hagiographic Vita Leonis III Liber
    Pontificalis records miraculous restoration). Leo fled to
    Charlemagne at Paderborn, escorted back to Rome November 799.
    Charlemagne synod 1 Dec 800 Leo purged himself by oath; 25 Dec
    800 crowned Charlemagne Emperor. Pseudo-Eutropius adds legendary
    "three hundred beheaded in the Lateran field" — historical
    executions were smaller-scale.

ad_lupam_tribunal_lateranense:
  english: The Lateran "at the She-Wolf" imperial tribunal
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0163"
  note: >
    Lateran location — apparently near ancient Lupa Capitolina statue
    or similar — used as IMPERIAL tribunal seat where emperor's missi
    judged Roman causes independently of the Apostolic See. Ad Lupam
    tradition confirmed by 9th-c Ordo Iudiciorum. Compositiones fines
    equally divided between imperial fisc and papal treasury. Res
    scelerata confiscated to public fisc not ecclesiastical unless
    imperial-donation precepts. Reformation-standard evidence for
    Carolingian-era imperial legal-jurisdictional presence at Rome.

ludovicus_ii_italiae_vs_nicolaus:
  english: Louis II of Italy vs Nicholas I (John of Ravenna 861)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0164-vl0166"
  note: >
    Louis II r. co-emperor 850, sole 855-875, last Carolingian emperor
    residing primarily in Italy. Bari campaign 866-871 (city taken
    2 February 871 with Byzantine naval support) against Aggareni
    Saracens/Hagarenes (Genesis 16, 21 Hagar-Ishmael ethnonym).
    Beneventan campaign 866-872 based Benevento + Calabria. Conflict
    with Pope Nicholas I r. 858-867 over deposition of JOHN VIII
    Archbishop of Ravenna r. c. 850-861 (imperial-loyal primate whom
    Nicholas deposed 861 for jurisdictional insubordination). Arbitrated
    at Ravenna 861 with papal legates; John reinstated on submission.
    Reformation-standard pre-Dictatus-Papae imperial-appellate role.

engelberga_regina_mediatrix:
  english: Empress Engelberga as mediator in imperial-papal disputes
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0165"
  note: >
    Empress Engelberga c. 830-890/91 wife of Louis II of Italy —
    one of most politically active Carolingian empresses. Chief
    mediator in Louis II / Nicholas I / John of Ravenna dispute 861,
    later Adrian II / Louis II tensions late 860s. Modern study
    François Bougard "Engelberga imperatrice" DBI 42 (1993).

synodus_ab_imperatore_non_a_papa:
  english: Synod called by Emperor not by Pope (Byzantine principle)
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0165"
  note: >
    Byzantine-imperial principle: emperor-convoked ecumenical synod
    held from Constantine at Nicaea 325 through Justinian at Constantinople
    II 553. Here asserted by Frankish-Carolingian emperor LOUIS II
    against mid-9th-c Roman papal plenitudo potestatis claim in the
    John of Ravenna deposition case: non licitum prelatum
    excommunicari sine consultatione synodalis concilii + synodus
    non a Papa sed ab Imperatore uocari deberet. Fundamental to
    Byzantine-Orthodox ecclesiology (emperor as isapostolos). Reformation
    revives: Melanchthon Tractatus §§39-45; Chytraeus De Ecclesia.

litaniae_contra_principes:
  english: Litanies and Masses "against evil-acting princes"
  type: polemical
  first_use: "flacius-catalogus-testium-1556, body — Eutropii appendix at vl0166"
  note: >
    PAPAL WEAPONISATION OF THE LITURGY as instrument of imperial-
    political coercion: Nicholas I established monks + consecrated
    virgins in Roman monasteries to celebrate daily Litanies around
    circuit of walls and sing Masses CONTRA PRINCIPES MALE AGENTES.
    Reformation locus classicus against medieval abuse of Mass as
    instrument of political-clerical warfare. Luther Wider die
    himmlischen Propheten 1525 + Vom Missbrauch der Messe 1521
    WA 8:477-563. Louis II's soldiers attacked processions
    trampling crosses + icons Byzantine-style (sicut mos est
    Graecorum) = Reformation-relevant: even 9th-c Roman practice
    was Byzantine-style icon-carrying (against later Roman claim
    of native-Latin icon-veneration tradition).

